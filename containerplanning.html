      if(datum || bestand){
        try{ await bewaarContainer(alBekend); log(f.name + ': container ' + inNaam + ' stond er al' + (datum ? ', lossen gezet op ' + losTekst(alBekend) : '') + '.' + bestand, 'ok'); }
        catch(e){ log(f.name + ': opslaan mislukt — ' + e.message, 'err'); }
      } else log(f.name + ': container ' + inNaam + ' stond er al, overgeslagen.', 'muted');
      continue;
    }
    const regel = { t:f.name + ': lezen…', cls:'muted' }; UI.bulk.log.push(regel); teken();
    try{
      const { text, methode, res } = await leesBestand(f, m => { regel.t = f.name + ': ' + m; teken(); });
      UI.bulk.log.splice(UI.bulk.log.indexOf(regel), 1);

      if(res.isPO && !f._poRonde){ poLijst.push(f); continue; }
      if(res.isPO){
        const zelfde = CONT.find(c => c.pakbon_ref === res.ref || (c.data.po && c.data.po.nr === res.ref));
        if(zelfde){ log(f.name + ': inkoopbestelling ' + res.ref + ' stond er al (' + levKort(zelfde.leverancier) + ' ' + (zelfde.pakbon_ref || '') + '), overgeslagen.', 'muted'); continue; }
        const m = f._poBest ? poMatch(res, f._poBest) : null;
        if(m){
          const c = m.c;
          c.data.po = { nr:res.ref, datum:res.poDatum, regels:res.regels.map(r => ({ code:r.productcode || r.pakbon_code, aantal:r.totaal })), score:Math.round(m.sc * 100) };
          if(OPSLAG !== false){ try{ await opslagZet('c' + c.id + '/po.pdf', f); c.data.po.pad = 'c' + c.id + '/po.pdf'; }catch(e){} }
          await bewaarContainer(c);
          log(f.name + ': inkoopbestelling ' + res.ref + ' hoort bij ' + levKort(c.leverancier) + ' ' + (c.pakbon_ref || c.containernummer || '') + ' (' + Math.round(m.sc * 100) + '% gelijk) — gekoppeld, geen nieuwe levering aangemaakt.', 'ok');
          continue;
        }
      }
      for(const d of res.docs){
        const naam = (res.lev || 'Leverancier?') + ' · ' + (d.container || res.ref || f.name);

        if(bestaat && (bestaat.data.regels || []).length){
          const bestand = !bestaat.data.pakbon_bestand ? await bewaar(bestaat, f) : '';
          if(bestand){ await bewaarContainer(bestaat); log(naam + ': stond er al.' + bestand, 'ok'); }

        if(!c){

      }

  };

    paren.forEach(p => { if(klaar.has(p.i) || bezet.has(p.c.id)) return; gelezen[p.i].f._poBest = p.c.id; klaar.add(p.i); bezet.add(p.c.id); });
    gelezen.forEach(g => g.f._poRonde = true);
    await verwerk(gelezen.map(g => g.f));
  }
  UI.bulk.bezig = false; teken();
}

  const w = 1 + Math.round(((x - j) / 864e5 - 3 + ((j.getDay() + 6) % 7)) / 7);
  const ma = new Date(d + 'T12:00:00'); ma.setDate(ma.getDate() - dag);
  return { key:x.getFullYear() + '-' + String(w).padStart(2, '0'), w, ma };
}

function rekenhulp(){

  else if(perLaag && lagen){ pakken = perLaag * lagen; nLagen = lagen; }
  const out = $('rk_out'); if(!out) return;

  const code = $('rk_out').closest('.pedit').dataset.code;
  const f = cur ? factorVan(cur, code) : 1;
  const stuks = pakken * pp * f;
  const hoogte = h ? Math.ceil(nLagen * h + PALLET_CM) : null;
  const gewicht = kg ? Math.ceil(pakken * kg + PALLET_KG) : null;
  out.innerHTML = `<b>${nf(pakken)} pakken</b> = <b>${nf(stuks)} ${eenheidVan(code)}</b> per pallet` +

async function palletOpslaan(code){

    if(wijzigt){

}

function labelLijst(c){

/* ---------- Overzicht voor Daan: per product hier / pick / backorders / klant / VST + backorders per order ---------- */
function overzichtData(cs){
  const per = {};
  cs.forEach(c => {
    const pl = pools(c), ref = c.pakbon_ref || c.containernummer || '#' + c.id;
    pl.order.forEach(code => {
      const o = per[code] = per[code] || { code, binnen:0, perC:[], dest:{}, notes:[], opm:[], geenVerdeling:[], boek:[] };
      const pool = pl.map[code], v = c.data.verdeling[code];
      o.binnen += pool.totaalU; o.perC.push({ ref, u:pool.totaalU });
      const porties = (v && v.porties || []).filter(x => portieU(x) > 0);
      if(!porties.length) o.geenVerdeling.push(ref);
      porties.forEach(x => {
        const k = x.dest === 'GROUND' ? 'UP' : x.dest, d = o.dest[k] = o.dest[k] || { pal:0, u:0, los:0 };
        if(x.soort === 'pallet') d.pal += num(x.n) || 0; else d.los += num(x.n) || 0;
        d.u += portieU(x);
        if(x.note) o.notes.push((x.soort === 'pallet' ? x.n + ' pallet' + (x.n === 1 ? '' : 's') : 'los') + ' ' + (DEST[x.dest] || {}).nl.toLowerCase() + ': ' + x.note);

async function labelBestemming(lijst){
  let T = {};
  try{ const r = await api('GET', 'catalog?key=eq.wh-taken&select=data'); T = (r && r.length ? r[0].data : {}) || {}; }catch(e){ /* zonder planning: alleen de soort */ }
  const pickVan = code => String((P[code] || {}).locaties_hm || '').split(',').map(x => x.trim()).filter(l => /^[A-Z]{2}\d{2}[A-D]0\d$/.test(l) || /^AH\d{2}[A-D]\d{2}$/.test(l));
  let n = 0;
  lijst.forEach(r => {
    if(r.aanvul) return;
    if(r.key){
      const g = T[r.key] && T[r.key].loc ? T[r.key] : T['cvs:' + r.key];
      r.naar = g && g.loc ? [g.loc].concat(g.extra || []).join(' + ') : '';
      r.soortTxt = r.dest === 'GROUND' ? 'GROND' : 'BULK';

    else if(r.dest === 'VST'){ r.naar = ''; r.soortTxt = 'VST'; }
  });
  return n;
}

function kopieer(t){

  vakk: el => { const code = el.closest('[data-code]').dataset.code; const v = cur.data.verdeling[code]; v.bevestigd = !v.bevestigd; UI.open['v-' + code] = false; save(); rerender(); },
  vopen: el => { const code = el.closest('[data-code]').dataset.code; UI.open['v-' + code] = true; rerender(); },
  // pallets
  pedit: el => { UI.pe = UI.pe === el.dataset.code ? null : el.dataset.code; rerender(); maxHint(); if(UI.pe && $('pecard')) $('pecard').scrollIntoView({ behavior:'smooth', block:'start' }); },
  neem: el => { const inp = $(el.dataset.f); if(!inp) return; if(inp.tagName === 'SELECT' && ![...inp.options].some(o => o.value === el.dataset.v)){ const o = document.createElement('option'); o.textContent = el.dataset.v; inp.insertBefore(o, inp.lastElementChild); } inp.value = el.dataset.v; inp.dispatchEvent(new Event('input', { bubbles:true })); maxHint(); },
  rkneem: el => { if(el.dataset.s) $('pe_spp').value = el.dataset.s; if(el.dataset.h) $('pe_h').value = el.dataset.h; if(el.dataset.kg) $('pe_kg').value = el.dataset.kg; maxHint(); toast('Overgenomen — vergeet niet op te slaan.'); },
  psave: el => palletOpslaan(el.dataset.code),
  // producten (pakbon-stap)
  pkopen: el => { UI.pkOpen[el.dataset.code] = true; rerender(); },
  pkdicht: el => { UI.pkOpen[el.dataset.code] = false; rerender(); },
  pkalles: el => { const k = el.dataset.code; UI.pkAlles[k] = !UI.pkAlles[k]; UI.pkOpen[k] = true; rerender(); },
  pksave: el => productenOpslaan([el.dataset.code]),
  pkaanvul: el => maakLabels(cur, [aanvulLabel(el.dataset.code)]),
  kies: el => { const b = el.closest('[data-kc]'), c = CONT.find(x => x.id === +b.dataset.kc), r = c && c.data.regels.find(x => String(x.id) === b.dataset.kr); if(r) regelKoppel(c, r, el.dataset.code); },
  regelweg2: el => { const b = el.closest('[data-kc]'), c = CONT.find(x => x.id === +b.dataset.kc), r = c && c.data.regels.find(x => String(x.id) === b.dataset.kr); if(r) regelWeg(c, r); },
  pkallesop: () => productenOpslaan([...new Set([...document.querySelectorAll('[data-pk]')].map(e => e.dataset.pk))]),
  // uitvoer
  wbprint: () => { $('print').innerHTML = werkbonHtml(cur); document.body.classList.add('printing'); if(window.Bestanden) Bestanden.printAls(bnNaam('werkbon', bnCtx(cur)).replace(/\.pdf$/, '')); window.print(); },
  wbcopy: () => kopieer(werkbonTekst(cur)),
  labels: () => maakLabels(cur),
  pdfall: () => maakPdf(cur),
  pbkijk: () => pakbonToon(cur, window.innerWidth < 700),
  pbtab: () => pakbonToon(cur, true),
  copyopslag: () => kopieer(OPSLAG_SQL),
  backup: () => backupMaken(),
  wijzeralles: () => { UI.wijzerAlles = !UI.wijzerAlles; viewHome(); },
  etapakbon: () => etaUitPakbonnen(),
  ontvok: el => ontvangstBevestig(+el.dataset.i),
  ontvverdeel: el => ontvangstVerdeel(+el.dataset.i),
  ontvvoor: el => ontvangstVoorboek(+el.dataset.i),
  vboweg: el => voorboekWeg(cur, el.dataset.rc),
  pdfover: () => maakOverzichtPdf(cur),
  ontvdel: el => { UI.ontv.splice(+el.dataset.i, 1); viewHome(); },
  ontvweg: () => { UI.ontv = []; viewHome(); },
  algelost: async el => {
    const c = CONT.find(x => x.id === +el.dataset.id), d = $('gl_' + el.dataset.id).value;
    if(!c || !d) return;
    try{ await alGelost(c, d); toast(levKort(c.leverancier) + ' ' + (c.containernummer || c.pakbon_ref || '') + ': gelost op ' + fdate(d, { day:'numeric', month:'short' }) + ', afgerond.'); }
    catch(e){ toast('Opslaan mislukt: ' + e.message, 5000); }
    if(cur) rerender(); else viewHome();
  },
  algelostcur: async () => { const d = $('gl_cur').value; if(!d) return; try{ await alGelost(cur, d); toast('Gelost op ' + fdate(d, { day:'numeric', month:'short' }) + ', afgerond.'); }catch(e){ toast('Opslaan mislukt: ' + e.message, 5000); } rerender(); },
  opslagtest: async () => { await opslagCheck(); viewHome(); toast(OPSLAG ? 'Opslag werkt. Pakbonnen worden vanaf nu bewaard.' : 'Opslagmap nog niet gevonden. Is de SQL uitgevoerd?', 5000); },
  smcopy: () => kopieer(stockmoveRegels(cur).join('\n')),
  smdown: () => bestandKlaar(new Blob([stockmoveRegels(cur).join('\n') + '\n'], { type:'text/plain' }), bnNaam('stockmove', bnCtx(cur)), 'stockmove', 'Stockmove-lijst klaar'),
  mailcopy: () => kopieer(mailtoVst(cur).body),
  afronden: () => {
    const snap = {}; pools(cur).order.forEach(code => { const f = feiten(code); snap[code] = { hm:f.hm, vrij:f.vrij, vst:f.vst, rate:f.rate, bo:f.bo }; });
    cur.data.snapshot = snap; cur.data.afgerond_op = new Date().toISOString(); cur.status = 'afgerond'; save(); rerender(); toast('Container afgerond.');
  },
  heropen: () => { cur.status = 'gelost'; save(); rerender(); },
  kopedit: () => { UI.kopEdit = !UI.kopEdit; rerender(); },
  etadef: () => {
    const d = $('def_datum').value; if(!d){ toast('Vul de losdatum in.'); return; }
    cur.losdatum = d; cur.lostijd = $('def_tijd').value || null; delete cur.data.verwacht; delete cur.data.eta_auto;
    if(cur.status === 'concept') cur.status = 'ingepland';
    save(); etaHerleer(cur.leverancier); toast('Losdatum vastgezet: ' + losTekst(cur) + '. Controleer nu de verdeling met de actuele cijfers.', 5000);
    location.hash = '#/c/' + cur.id + '/verdeling';
  },
  bulkweg: () => { UI.bulk = null; viewHome(); },
  // vloernamen
  vnopslaan: () => vloernamenOpslaan(),
  vnvoor: el => { (UI.vn.wijzig[el.dataset.code] = UI.vn.wijzig[el.dataset.code] || {}).name = el.dataset.v; rerenderLater(); },
  vnlosvoor: el => { UI.vn.los[el.dataset.key] = el.dataset.v; rerenderLater(); },
  vnuitcopy: () => kopieer(vnUit().filter(c => !UI.vn.f.lev || (P[c] || {}).leverancier === UI.vn.f.lev).join('\n')),
  vnterug: async el => {
    const code = el.dataset.code;
    try{
      await api('PATCH', 'producten?productcode=eq.' + encodeURIComponent(code), { actief:true, updated_at:new Date().toISOString() }, { Prefer:'return=minimal' });
      if(P[code]) P[code].actief = true;
      rerender(); toast(code + ' teruggezet. Vloernaam en stuks per pallet opnieuw invullen.', 4000);
    }catch(e){ toast('Mislukt: ' + e.message, 5000); }
  },
  vnallevoor: () => {
    const zicht = vnGefilterd(vnLijst()); let n = 0;
    zicht.forEach(r => { if(r.voorstel){ (UI.vn.wijzig[r.code] = UI.vn.wijzig[r.code] || {}).name = r.voorstel; n++; } });
    rerender(); toast(n ? n + ' voorstel(len) overgenomen — controleer en klik Opslaan.' : 'Niets om over te nemen in het huidige overzicht.');
  },
  vndel: async el => {
    const key = el.dataset.key, x = CAT[key];
    if(!x || !confirm('Regel "' + (x.name || key) + '" uit het productgeheugen verwijderen?')) return;
    try{
      const r = await api('GET', 'catalog?key=eq.catalog-ean&select=data');
      const cat = (r.length ? r[0].data : {}) || {};
      delete cat[key];
      await api('POST', 'catalog?on_conflict=key', [{ key:'catalog-ean', mode:'ean', data:cat, updated_at:new Date().toISOString() }], { Prefer:'resolution=merge-duplicates,return=minimal' });
      indexCatalog(cat); delete UI.vn.los[key]; rerender(); toast('Verwijderd.');
    }catch(e){ toast('Mislukt: ' + e.message, 5000); }
  }
};
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  const f = ACT[el.dataset.act];
  if(f){ e.preventDefault(); f(el, e); }
});
app.addEventListener('toggle', e => { const d = e.target; if(d.dataset && d.dataset.det) UI.open[d.dataset.det] = d.open; }, true);

/* =====================================================================
   Invoer (wijzigen)
   ===================================================================== */
app.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.change === 'ontvangstenInlezen' && el.files){
    const fs = [...el.files]; el.value = '';
    if(fs.length) ontvangstenInlezen(fs);
    return;
  }
  if(el.dataset.ovc !== undefined){ UI.ontv[+el.dataset.ovc].cid = +el.value || null; viewHome(); return; }
  if(el.dataset.change === 'ontvangstHier' && el.files){
    const f = el.files[0]; el.value = ''; if(!f) return;
    UI.ontv = []; const c = cur;
    leesOntvangst(f).then(o => { UI.ontv.push({ f, o, cid:c.id, datum:o.datum || '' }); location.hash = '#/'; }).catch(e => toast(f.name + ': ' + e.message, 6000));
    return;
  }
  if(el.dataset.change === 'pakbonnenBulk' && el.files){
    const fs = [...el.files]; el.value = '';
    if(fs.length) pakbonnenBulk(fs);
    return;
  }
  if(el.dataset.change && el.files){
    const f = el.files[0]; el.value = '';
    if(!f) return;
    ({ pakbonBestand, pakbonBewaarIn, impProducten, impVerkoop, impBackorders, impKoppelingen })[el.dataset.change](f);
    return;
  }
  if(el.dataset.vn){
    const code = el.dataset.vn, w = UI.vn.wijzig[code] = UI.vn.wijzig[code] || {};
    w[el.dataset.vk] = el.value;
    rerenderLater(); return;
  }
  if(el.dataset.vnlos){ UI.vn.los[el.dataset.vnlos] = el.value.trim(); rerenderLater(); return; }
  if(el.dataset.eta){
    const c = CONT.find(x => x.id === +el.dataset.eta); if(!c || !el.value) return;
    c.losdatum = el.value; c.data.verwacht = true; delete c.data.eta_auto;
    bewaarContainer(c).then(() => { toast(levKort(c.leverancier) + ' ' + (c.containernummer || c.pakbon_ref || '') + ': ' + losTekst(c)); viewHome(); }).catch(e => toast('Opslaan mislukt: ' + e.message, 5000));
    return;
  }
  if(el.dataset.vw){ (UI.vw = UI.vw || {})[el.dataset.vw] = el.value; rerenderLater(); return; }
  if(el.dataset.vnf){
    UI.vn.f[el.dataset.vnf] = el.type === 'checkbox' ? el.checked : el.value;
    rerenderLater(); return;
  }
  if(el.hasAttribute('data-kop')){
    const b = el.closest('[data-kc]'), c = CONT.find(x => x.id === +b.dataset.kc), r = c && c.data.regels.find(x => String(x.id) === b.dataset.kr);
    if(r && el.value.trim()) regelKoppel(c, r, el.value);
    return;
  }
  if(el.dataset.pk){
    const code = el.dataset.pk, k = el.dataset.pf, d = UI.pk[code] = UI.pk[code] || {};
    let v = el.type === 'checkbox' ? (el.checked ? '1' : '') : el.value;
    if(k === 'maat' && v === 'anders'){ v = (prompt('Palletmaat (lengte x breedte in cm), bijv. 90x150:') || '').replace(/\s/g, '').toLowerCase(); }
    d[k] = v;
    if(k === 'spp' || k === 'maat' || k === 'aanvul') rerenderLater();
    return;
  }
  if(!cur) return;
  if(el.hasAttribute('data-verwacht')){ if(el.checked) cur.data.verwacht = true; else delete cur.data.verwacht; save(); rerenderLater(); return; }
  if(el.dataset.meta){
    const k = el.dataset.meta; let v = el.value.trim();
    if(k === 'containernummer') v = v.toUpperCase();
    cur[k] = v || null;
    if(k === 'losdatum') delete cur.data.eta_auto;
    save(); rerenderLater(); if(k === 'leverancier') koppelAlles(cur); return;
  }
  if(el.dataset.regel !== undefined){
    const r = cur.data.regels[+el.dataset.regel], k = el.dataset.k;
    if(k === 'productcode'){
      const v = el.value.trim(), canon = PLOW[v.toLowerCase()];
      if(v && !canon){ toast(onbekendCode(v), 7000); el.value = r.productcode || ''; return; }
      r.productcode = canon || ''; r.match = canon ? 'handmatig' : 'onbekend'; r.bevestigd = !!canon;
      if(canon){ const fv = factorVoorstel(canon, r); r.factor = fv.factor; r.factor_bron = fv.bron === 'voorstel' ? 'bevestigd' : fv.bron; leer(r); }
    } else if(k === 'pakbon_code'){ r.pakbon_code = el.value.trim(); if(!r.bevestigd) Object.assign(r, koppel(r, cur.leverancier)); }
    else if(k === 'soort'){ r.soort = el.value; }
    else if(k === 'factor'){ r.factor = num(el.value) || 1; r.factor_bron = 'bevestigd'; if(r.bevestigd) leer(r); }
    else { r[k] = num(el.value); }
    save(); rerenderLater(); return;
  }
  const portie = el.closest('.portie');
  if(portie && el.dataset.p){
    const code = portie.closest('[data-code]').dataset.code, i = +portie.dataset.i, v = cur.data.verdeling[code], x = v.porties[i];
    if(el.dataset.p === 'n') x.n = num(el.value) || 0;
    else if(el.dataset.p === 'per') x.per = num(el.value);
    else if(el.dataset.p === 'dest') x.dest = el.value;
    else if(el.dataset.p === 'note') x.note = el.value;
    v.bevestigd = false;
    save(); if(el.dataset.p !== 'note') rerenderLater(); return;
  }
  if(el.dataset.inst){ cur.data.instellingen[el.dataset.inst] = num(el.value); save(); rerenderLater(); return; }
  if(el.dataset.wb === 'taal'){ cur.data.werkbon.taal = el.value; save(); rerender(); return; }
  if(el.hasAttribute('data-aanvullabels')){ UI.aanvulLabels = el.checked; rerender(); return; }
  if(el.dataset.labeldest){ UI.labelDest[el.dataset.labeldest] = el.checked; rerender(); return; }
});
app.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.wb === 'extra' && cur){ cur.data.werkbon.extra = el.value; save(); const p = $('wbprev'); if(p) p.innerHTML = werkbonHtml(cur); return; }
  if(el.closest && el.closest('.calc')) rekenhulp();
  if(el.id === 'pe_kg') maxHint();
});
app.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.id === 'pt_nieuw'){ e.preventDefault(); ACT.ptadd(); }
});

/* =====================================================================
   Start
   ===================================================================== */
(async () => {
  if(!(await load())) return;
  route();
  // pakbonregels zonder Picqer-product opnieuw proberen (bijv. met de ingebouwde voorstellen), eenmalig bij het openen
  try{ const n = await herkoppelOpen(); if(n){ PLAN = null; rerender(); toast(n + ' pakbonregel' + (n > 1 ? 's' : '') + ' gekoppeld als voorstel — bevestig bij Producten.', 6000); } }catch(e){}
})();
})();
</script>
</body>
</html>
