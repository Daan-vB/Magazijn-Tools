</style>

function lev1(a, b){ // Levenshtein
  if(a === b) return 0;
  if(!a.length) return b.length; if(!b.length) return a.length;
  let prev = Array.from({ length:b.length + 1 }, (_, i) => i);
  for(let i = 1; i <= a.length; i++){
    const cur = [i];
    for(let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}

function cleanLine(l){
  return l.replace(/[|\[\]{}]/g, ' ')
          .replace(/(\d)\)/g, '$1 ')
          .replace(/(\d)\/(?=\s|$)/g, '$1 ')
          .replace(/\s+/g, ' ').trim();

// pakboncode uit de omschrijving halen ("ISM80X120-RUBBER STABLE MAT" -> "ISM80X120")
function eersteCode(s){
  const w = String(s || '').trim().split(/\s+/)[0] || '';
  const m = w.match(/^(.*?\d.*?)-(?=[A-Za-z]{4,})/);
  return m ? m[1] : w;
}
function codeFrase(desc){
  const words = String(desc || '').trim().split(/\s+/), out = [];
  for(const w of words){
    const m = w.match(/^(.*?\d.*?)-(?=[A-Za-z]{4,})/);
    if(m){ out.push(m[1]); break; }
    if(out.length && /^[A-Za-z]{4,}$/.test(w) && out.some(x => /\d/.test(x))) break;
    out.push(w);
    if(out.length >= 6) break;
  }
  return out.join(' ');
}
function pakbonCode(desc, ctx){
  const f = eersteCode(desc);
  if(/\d/.test(f) && norm(f).length >= 4) return f;
  const fr = codeFrase(desc);
  if(/\d/.test(fr)) return fr;
  const c = eersteCode(ctx);
  if(/\d/.test(c) && norm(c).length >= 4) return c;
  return f || fr;
}

  const isRow = [], rowOf = [];
  const probeer = l => {
    let mm = l.match(RX_REGEL);
    if(!mm){ // scanruis: haakjes en losse komma's rond getallen
      const l2 = l.replace(/[();]/g, ' ').replace(/(\d)[,.](?=\s|$)/g, '$1').replace(/\s+/g, ' ').trim();
      mm = l2.match(RX_REGEL);
    }
    if(mm && !mm[1] && !/[A-Za-z]/.test(mm[2])) mm = null; // zonder volgnummer moet er tekst in staan
    return mm;
  };
  lines.forEach((l, i) => { const mm = probeer(l); isRow[i] = !!mm; rowOf[i] = mm; });
  const skip = l => !l || /^(total|b\s*\/\s*l|container|shipped|declaration|we declare|sl\b|no\b|item code|rubber products|coir|pvc)/i.test(l) || /^[A-Z ]{6,}PRODUCTS?$/i.test(l);
  let ctx = [];
  lines.forEach((l, i) => {
    const mm = rowOf[i];
    if(!mm){
      if(/^total\b/i.test(l)){
        const t = l.match(/total\D*(\d{1,6})\s+(\d{1,5})\b/i);
        if(t){ res.totaal_stuks = +t[1]; res.totaal_eenheden = +t[2]; }
      }
      if(!skip(l)) ctx.push(l); else ctx = [];
      if(ctx.length > 2) ctx.shift();
      return;
    }
    const next = (i + 1 < lines.length && !isRow[i+1] && !skip(lines[i+1]) && !/^total/i.test(lines[i+1])) ? lines[i+1] : '';
    const desc = mm[2].trim();
    const context = ctx.join(' ');
    const serie = (mm[6] || '').replace(/\s+/g, ' ');
    let aantal = mm[5] ? +mm[5] : null;
    if(aantal === null && serie){ const sr = serie.split('-').map(x => +x.trim()); if(sr[1] >= sr[0]) aantal = sr[1] - sr[0] + 1; }
    if(aantal === null && +mm[4]) aantal = Math.round(+mm[3] / +mm[4]);
    const r = {
      sl:mm[1] ? +mm[1] : res.regels.length + 1, pakbon_code:pakbonCode(desc, context), omschrijving:desc, context:(context + ' ' + next).trim(),
      totaal:+mm[3], per:+mm[4], aantal, serie,
      netto:num(mm[7]), bruto_per:num(mm[8]), bruto:num(mm[9]), cbm:num(mm[10])
    };
    r.soort = r.bruto_per ? (r.per >= 2 && r.bruto_per >= 100 ? 'pallet' : 'los') : (res.perPallet ? 'pallet' : 'los');
    res.regels.push(r);
    ctx = [];
  });
  return res;
}
// eenvoudige vorm: code <tab> pallets <tab> stuks per pallet   of   code <tab> aantal
function parseSimpel(text){
  const regels = [];
  String(text || '').split(/\r?\n/).forEach(l => {
    if(!l.trim()) return;
    const p = (l.includes('\t') ? l.split('\t') : l.includes(';') ? l.split(';') : l.trim().split(/\s{2,}|,/)).map(s => s.trim()).filter(Boolean);
    if(p.length < 2) return;
    const code = p[0], a = num(p[1]), b = num(p[2]);
    if(!code || a === null || /^(code|product|artikel)/i.test(code)) return;
    if(b !== null) regels.push({ pakbon_code:code, omschrijving:'', totaal:a * b, per:b, aantal:a, soort:'pallet' });
    else regels.push({ pakbon_code:code, omschrijving:'', totaal:a, per:1, aantal:a, soort:'los' });
  });
  return regels;
}
/* =====================================================================
   Pakbonlezers per leverancier
   Elke lezer krijgt de tekst en de regels ({p, y, s}) van de PDF en geeft
   { regels, ref, containers, totaal_stuks, totaal_eenheden, notities } terug.
   Kolommen in s zijn gescheiden door 3+ spaties (zie pdfTekst).
   ===================================================================== */
const RX_CONT = /\b([A-Z]{3}U\d{7})\b/g;               // containernummer: 3 letters + U + 7 cijfers
const kolommen = s => String(s || '').split(/ {3,}/).map(x => x.trim()).filter(x => x !== '');
function kopBasis(text){
  const conts = [...new Set((String(text).match(RX_CONT) || []))];
  return { regels:[], notities:[], containers:conts, ref:null, bl:null, totaal_stuks:null, totaal_eenheden:null };
}
const zoek1 = (text, rx) => { const m = String(text).match(rx); return m ? m[1].trim() : null; };
// een pakbonregel in de vorm die de app kent
function pbRegel(code, oms, totaal, per, extra){
  per = per && per > 0 ? per : 1;
  const aantal = Math.round(totaal / per * 1000) / 1000;
  return Object.assign({ pakbon_code:String(code).trim(), omschrijving:String(oms || code).replace(/\s+/g, ' ').trim(), context:'',
    totaal, per, aantal:Number.isInteger(aantal) ? aantal : Math.ceil(aantal), soort:'los', bruto_per:null }, extra || {});
}
const afr = (x, d) => x == null || isNaN(x) ? null : Math.round(x * Math.pow(10, d || 1)) / Math.pow(10, d || 1);

/* Fanda / Hebei Haijie — factuur: nr | code | aantal | prijs | totaal */
function leesFanda(text, L){
  const res = kopBasis(text);
  res.ref = zoek1(text, /Ref\.?\s*No\.?\s*:?\s*([A-Z]{2,}-\d{5,})/i);
  const vrij = [];
  L.forEach(l => {
    const k = kolommen(l.s);
    if(k.length !== 5 || !/^\d{1,3}$/.test(k[0]) || !/^\d+$/.test(k[2])) return;
    const q = +k[2], prijs = num(k[3]);
    if(!prijs){ vrij.push(q + '× ' + k[1]); return; }
    res.regels.push(pbRegel(k[1], k[1], q, 1));
  });
  if(vrij.length) res.notities.push('Gratis meegestuurd (niet ingepland): ' + vrij.join(', ') + '.');
  return res;
}

/* Sanhe Great Wall Rubber — rollen, alleen omschrijving + maat, omschrijving in samengevoegde cellen */
function leesGreatWall(text, L){
  const res = kopBasis(text);
  res.ref = zoek1(text, /S\s*\/\s*C\s*No\.?\s*:?\s*([A-Z0-9-]+)/i);
  const SPEC = /^(tensile|density|elongation|hardness)/i;
  const MAAT = /^(\d+(?:\.\d+)?)\s*mm\s*x\s*([\d.]+)\s*m\s*x\s*([\d.]+)\s*m(?:\s*x\s*\d+\s*P)?$/i;
  const koppen = [], rijen = [];
  let blok = null, inT = false, klaar = false;
  L.forEach(l => {
    if(klaar) return;
    const k = kolommen(l.s);
    if(!inT){ if(/kg\s*\/\s*roll|^Item$/i.test(l.s) || k.some(x => /^Item$/i.test(x))) inT = true; return; }
    if(/^(sum|total)\b/i.test(k[0] || '')){ klaar = true; const m = l.s.match(/^SUM\s+(\d+)/i); if(m) res.totaal_stuks = +m[1]; return; }
    const si = k.findIndex(x => MAAT.test(x));
    (si >= 0 ? k.slice(0, si) : k).forEach(t => {
      if(SPEC.test(t)){ if(blok) blok.onder = Math.min(blok.onder, l.y); return; }
      if(!/[a-z]/i.test(t) || /^(item|size|thickness|width|length|quantity|weight|total weight)$/i.test(t) || /^[（(]/.test(t)) return;
      if(blok && !blok.heeftRij && blok.laatst - l.y < 14){ blok.naam += ' ' + t; blok.laatst = l.y; blok.onder = Math.min(blok.onder, l.y); return; }
      blok = { naam:t, boven:l.y, onder:l.y, laatst:l.y, heeftRij:false }; koppen.push(blok);
    });
    if(si >= 0){
      const d = k.slice(si + 1).map(num);   // dikte, breedte, lengte, rollen, kg/rol, totaal kg
      rijen.push({ y:l.y, maat:k[si].replace(/\s+/g, ' '), rollen:d[3], kg:d[4] });
      if(blok) blok.heeftRij = true;
    }
  });
  rijen.forEach(r => {
    let best = null, bd = Infinity;
    koppen.forEach(kp => {
      const top = kp.boven + 6, bot = kp.onder - 6;
      const d = r.y > top ? r.y - top : r.y < bot ? bot - r.y : 0;
      if(d < bd){ bd = d; best = kp; }
    });
    const naam = best ? best.naam.replace(/\s+/g, ' ') : 'Rubber';
    res.regels.push(pbRegel(naam + ' ' + r.maat, naam + ' ' + r.maat, r.rollen, 1, { bruto_per:r.kg, eenheid:'rol' }));
  });
  return res;
}

/* Guangxi Hongle Plastic — paklijst (pagina 1): code + maat, dozen/zakken en stuks op volgende regels */
function leesHongle(text, L){
  const res = kopBasis(text);
  res.ref = zoek1(text, /PO#\s*(\d{4}-\d{4,})/i) || zoek1(text, /INVOICE\s*:?\s*([A-Z]{2}\d{6,})/i);
  if(res.ref && /^\d{4}-/.test(res.ref)) res.ref = 'PO' + res.ref;
  let r = null;
  const af = () => {
    if(r && r.pkgs) res.regels.push(pbRegel(r.code, [r.code, r.maat].concat(r.oms).filter(Boolean).join(' '), r.pcs || r.pkgs, r.pcs ? r.pcs / r.pkgs : 1, { bruto_per:r.gw ? afr(r.gw / r.pkgs) : null }));
    r = null;
  };
  for(const l of L){
    if(l.p > 1) break;
    if(/^TOTAL\b/i.test(l.s)){ af(); const m = l.s.match(/=\s*(\d+)\s*PACKAGES/i); if(m) res.totaal_eenheden = +m[1]; break; }
    const k = kolommen(l.s);
    const m = (k[0] || '').match(/^(HL[\w-]*\d[\w-]*)\s*(.*)$/i);
    if(m){ af(); r = { code:m[1], maat:m[2], oms:[], pkgs:0, pcs:0, gw:0 }; }
    if(!r) continue;
    const pk = l.s.match(/(\d+) {3,}(CARTONS?|BAGS?|CTNS?|PALLETS?|BOX(?:ES)?)\b.*?KGS {3,}([\d.,]+) {3,}KGS/i);
    if(pk && !r.pkgs){ r.pkgs = +pk[1]; r.gw = num(pk[3]); }
    const pc = l.s.match(/(\d+) {3,}PCS\b/i);
    if(pc) r.pcs = +pc[1];
    if(!m && k[0] && /[a-z]/i.test(k[0]) && !/^\d/.test(k[0])) r.oms.push(k[0]);
  }
  return res;
}

/* Luoyang Besteel — proforma: regel met alleen de artikelcode, daaronder omschrijving + volume/aantal/prijs */
function leesBesteel(text, L){
  const res = kopBasis(text);
  res.ref = zoek1(text, /PI\s*NO\s*:?\s*([A-Z]{2}-[A-Z]?\d+)/i);
  let code = null, laatste = null;
  L.forEach(l => {
    const s = l.s.trim();
    if(/^[A-Z]{2}(?:-[A-Za-z0-9]+)+$/.test(s)){ code = s; return; }
    const pal = s.match(/^Pallet\b.*?([\d.]+) {3,}([\d.]+) {3,}(\d+) {3,}US\$/i);
    if(pal){ res.notities.push(pal[3] + ' pallets meegestuurd (' + (s.match(/For\s+([^ ].*?)(?: {3,}|$)/i) || ['', 'zie pakbon'])[1].replace(/,\s*$/, '') + '…).'); return; }
    const tot = s.match(/IN TOTAL\b.*?(\d+) {3,}\//i);
    if(tot){ res.totaal_stuks = +tot[1]; return; }
    if(/Product Total/i.test(s)) return;
    const m = s.match(/(\d+\.\d+) {3,}(\d+\.\d+) {3,}(\d+) {3,}US\$\s*([\d.,]+)/i);
    if(m && code){
      laatste = pbRegel(code, code, +m[3], 1);
      if(!num(m[4])) laatste.omschrijving += ' (gratis)';
      res.regels.push(laatste); return;
    }
    if(laatste && /without pallets/i.test(s) && !/zonder pallet/.test(laatste.omschrijving)) laatste.omschrijving += ' (zonder pallet, bovenin container)';
  });
  return res;
}

/* Ningbo Henri — factuur of paklijst: code [maat] | dozen | aantal EENHEID [| bruto | netto | m3] */
function leesNingbo(text, L){
  const res = kopBasis(text);
  res.ref = zoek1(text, /INVOICE\s*NO\s*:?\s*([A-Z]{1,3}\d{4,})/i);
  let kop = '';
  L.forEach(l => {
    const s = l.s.trim();
    const h = s.match(/^\d+\.\s*([A-Za-z].*?)\s*(?:\(.*)?$/);
    if(h && !/ {3,}\d/.test(s)){ kop = h[1].trim(); return; }
    if(/^(sub\s*)?total/i.test(s)){ const t = s.match(/(\d+(?:,\d+)?)/); if(t) res.totaal_eenheden = num(t[1]); return; }
    const m = s.match(/^(.+?) {3,}(?:(.+?) {3,})?(\d+(?:,\d+)?) {3,}(\d+) (PCS|ROLLS?|SETS?|PAIRS?)\b(?: {3,}([\d.,]+) {3,}([\d.,]+) {3,}([\d.,]+))?$/i);
    if(!m || /^(container|mark|n\/m)$/i.test(m[1])) return;
    const pkgs = num(m[3]), qty = +m[4];
    res.regels.push(pbRegel(m[1], [kop, m[2]].filter(Boolean).join(' · '), qty, pkgs ? qty / pkgs : 1,
      { bruto_per:m[6] && pkgs ? afr(num(m[6]) / pkgs) : null, eenheid:/roll/i.test(m[5]) ? 'rol' : null }));
  });
  return res;
}

/* Zhejiang Red Sun — paklijst: code | omschrijving | stuks | dozen | netto/st | bruto/st | m3/st | totalen */
function leesRedSun(text, L){
  const res = kopBasis(text);
  res.ref = zoek1(text, /Inv\.?\s*No\.?\s*:?\s*([\w-]+)/i);
  L.forEach(l => {
    const k = kolommen(l.s);
    if(k[0] === 'N/M') k.shift();
    if(k.length === 10 && /^\d+$/.test(k[2]) && /^\d+$/.test(k[3])){
      const pcs = +k[2], ctn = +k[3];
      res.regels.push(pbRegel(k[0], k[1], pcs, ctn ? pcs / ctn : 1, { bruto_per:afr(num(k[5]) * (ctn ? pcs / ctn : 1)) }));
    } else if(k.length === 4 && /^\d+$/.test(k[0]) && res.regels.length) res.totaal_eenheden = +k[0];
  });
  return res;
}

/* Foshan Selected Furniture — paklijst: code | naam | … | stuks | x PCS/CTN | dozen | maat | m3 | kg … */
function leesSelected(text, L){
  const res = kopBasis(text);
  res.ref = zoek1(text, /CI\s*NO\s*:?\s*([\d\/-]+)/i);
  const RC = /^[A-Z]{2}\d{3}[\w-]*$/i, vrij = [];
  let vrijStuks = 0, vrijDozen = 0;
  L.forEach((l, i) => {
    const k = kolommen(l.s);
    const j = k.findIndex(x => /^\d+\s*PCS?\s*\/\s*CTN$/i.test(x));
    if(j < 1){
      if(/^Total\b/i.test(k[0] || '') && k.length >= 3){ res.totaal_stuks = num(k[1]); res.totaal_eenheden = num(k[2]); }
      return;
    }
    let code = RC.test(k[0]) ? k[0] : (k[0] === '***' && RC.test(k[1]) ? k[1] : null);
    for(let b = i - 1; !code && b >= Math.max(0, i - 5); b--){
      if(/PCS?\s*\/\s*CTN/i.test(L[b].s)) break;
      const k0 = kolommen(L[b].s)[0];
      if(RC.test(k0 || '')) code = k0;
    }
    const qty = num(k[j - 1]), perDoos = num(k[j].match(/\d+/)[0]), dozen = num(k[j + 1]);
    if(k[0] === '***' || /free/i.test(l.s)){ vrij.push(qty + '× ' + (code || '?') + ' ' + (k[k[0] === '***' ? 2 : 1] || '')); vrijStuks += qty || 0; vrijDozen += dozen || 0; return; }
    res.regels.push(pbRegel(code || k[0], [code, k.slice(1, j - 1).join(' ')].filter(Boolean).join(' · '), qty, perDoos, { bruto_per:num(k[j + 7]) }));
  });
  if(vrij.length){
    res.notities.push('Gratis vervangingsonderdelen (niet ingepland): ' + vrij.join(', ') + '.');
    if(res.totaal_stuks != null) res.totaal_stuks -= vrijStuks;
    if(res.totaal_eenheden != null) res.totaal_eenheden -= vrijDozen;
  }
  return res;
}

/* Qingdao Todo Rubber — omschrijving boven/onder de getallen; soms meerdere containers op één paklijst */
function leesTodo(text, L){
  const res = kopBasis(text);
  res.ref = zoek1(text, /(TODO\d*-\d{8}-\d+)/i) || zoek1(text, /(PO\d{4}-\d{4,})/i);
  const data = [], tekst = [], labels = [];
  let inT = false, klaar = false;
  L.forEach(l => {
    if(klaar) return;
    if(/Shipping Mark|Container No/i.test(l.s)){ inT = true; return; }
    if(!inT || /^(KGS|CBMS)\b/i.test(l.s.trim())) return;
    if(/^TOTAL\b/i.test(l.s.trim())){ klaar = true; const m = l.s.match(/(\d+)\s*PKG {3,}(\d+)\s*(pcs|rolls?|sets?)/i); if(m){ res.totaal_stuks = +m[2]; res.totaal_eenheden = +m[1]; } return; }
    const k = kolommen(l.s);
    k.forEach(x => { if(/^[A-Z]{3}U\d{7}$/.test(x)) labels.push({ c:x, y:l.y }); });
    const txt = k.filter(x => !/^[A-Z]{3}U\d{7}$/.test(x) && !/^TODO$/i.test(x) && !/^\d+\s*PKG$|^\d+\s*(pcs|rolls?|sets?)$|kgs$|cbms$/i.test(x)).join(' ');
    const m = l.s.match(/(\d+)\s*PKG {3,}(\d+)\s*(pcs|rolls?|sets?) {3,}([\d.,]+)\s*kgs {3,}([\d.,]+)\s*kgs/i);
    if(m) data.push({ y:l.y, pkg:+m[1], qty:+m[2], eh:m[3].toLowerCase(), gw:num(m[5]), eigen:txt, rond:[] });
    else if(txt) tekst.push({ y:l.y, t:txt });
  });
  tekst.forEach(t => {
    let best = null;
    data.forEach(d => { if(!best || Math.abs(d.y - t.y) < Math.abs(best.y - t.y)) best = d; });
    if(best) best.rond.push(t);
  });
  data.forEach(d => {
    const delen = d.rond.filter(t => t.y > d.y).sort((a, b) => b.y - a.y).map(t => t.t)
      .concat(d.eigen ? [d.eigen] : [])
      .concat(d.rond.filter(t => t.y <= d.y).sort((a, b) => b.y - a.y).map(t => t.t));
    const oms = delen.join(' ');
    const per = d.pkg ? d.qty / d.pkg : 1, bp = d.gw && d.pkg ? afr(d.gw / d.pkg) : null;
    d.regel = pbRegel(oms, oms, d.qty, per, { bruto_per:bp, soort:(per >= 2 && bp >= 100) ? 'pallet' : 'los', eenheid:/roll/.test(d.eh) ? 'rol' : null });
    res.regels.push(d.regel);
  });
  // meerdere containers: elk containernummer staat (verticaal gecentreerd) naast zijn eigen groep regels
  if(labels.length > 1 && data.length >= labels.length){
    const lab = labels.slice().sort((a, b) => b.y - a.y), rows = data.slice().sort((a, b) => b.y - a.y);
    let beste = null;
    const zoekDeling = (start, li, grenzen, fout) => {
      if(beste && fout >= beste.fout) return;
      if(li === lab.length - 1){
        const g = rows.slice(start), f = fout + Math.abs(lab[li].y - (g[0].y + g[g.length - 1].y) / 2);
        if(!beste || f < beste.fout) beste = { fout:f, grenzen:grenzen.concat([start]) };
        return;
      }
      for(let e = start + 1; e <= rows.length - (lab.length - li - 1); e++){
        const g = rows.slice(start, e);
        zoekDeling(e, li + 1, grenzen.concat([start]), fout + Math.abs(lab[li].y - (g[0].y + g[g.length - 1].y) / 2));
      }
    };
    zoekDeling(0, 0, [], 0);
    beste.grenzen.forEach((s, li) => {
      const e = li + 1 < beste.grenzen.length ? beste.grenzen[li + 1] : rows.length;
      rows.slice(s, e).forEach(d => d.regel.container = lab[li].c);
    });
  } else if(labels.length === 1) data.forEach(d => d.regel.container = labels[0].c);
  return res;
}

// herkenning: welke lezer hoort bij deze pakbon (naam = zoals de leverancier in Picqer heet)
// Gardenya (Turkije): rollen per pallet, gemengde pallets, geen productcodes en geen containernummer
function leesGardenya(text, L){
  const res = kopBasis(text);
  const dat = zoek1(text, /Date\s*:\s*([\d.\/-]+)/i);
  res.ref = dat ? 'PL ' + dat : null;
  const prods = [], pallets = [];
  L.forEach(l => {
    const k = kolommen(l.s);
    let pal = null;
    if(k.length >= 5 && /^\d{1,2}$/.test(k[0]) && /[A-Za-z]/.test(k[1])){ pal = +k[0]; k.shift(); }
    if(k.length >= 4 && /[A-Za-z]/.test(k[0]) && /^\d+$/.test(k[1]) && /^[\d.,]+$/.test(k[2]) && !/^TOTAL/i.test(k[0])){
      prods.push({ oms:k[0].replace(/\s+/g, ' ').trim(), n:+k[1], kg:num(k[2]), y:l.y, p:l.p });
      if(pal !== null) pallets.push({ n:pal, y:l.y, p:l.p, bruto:num(k[5]) });
    } else if(k.length >= 6 && /^\d{1,2}$/.test(k[0]) && /^[\d.,]+$/.test(k[1]) && /^[\d.,]+$/.test(k[2])){
      pallets.push({ n:+k[0], y:l.y, p:l.p, bruto:num(k[2]) });
    }
    const t = l.s.match(/TOTAL\s*\(KGS\)\s+(\d+)/i); if(t) res.totaal_stuks = +t[1];
  });
  const som = {};
  prods.forEach(x => { (som[x.oms] = som[x.oms] || { n:0, kg:x.kg }).n += x.n; });
  Object.entries(som).forEach(([oms, x]) => res.regels.push(pbRegel(oms, oms + ' (rollen)', x.n, 1, { bruto_per:x.kg })));
  if(pallets.length){
    const inh = {};
    prods.forEach(x => {

const MND = { jan:1, feb:2, mar:3, maa:3, mrt:3, apr:4, may:5, mei:5, mag:5, jun:6, giu:6, jul:7, lug:7, aug:8, ago:8, sep:9, set:9, oct:10, okt:10, ott:10, nov:11, dec:12, dic:12 };
function datumTok(s){
  s = String(s || '');
  const iso = (y, mo, d) => {
    if(y < 100) y += 2000;
    const dt = new Date(y, mo - 1, d);
    if(!mo || dt.getMonth() !== mo - 1 || dt.getDate() !== d || y < 2020 || y > 2040) return null;
    return y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  };
  const mn = w => MND[String(w || '').slice(0, 3).toLowerCase()];
  let m;
  if((m = s.match(/\b(20\d\d)\s*[-\/.]\s*(\d{1,2})\s*[-\/.]\s*(\d{1,2})\b/))) return iso(+m[1], +m[2], +m[3]);
  if((m = s.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s*[-\/. ]\s*([a-z]{3,9})\.?\s*[-\/., ]?\s*(\d{4}|\d{2})\b/i)) && mn(m[2])) return iso(+m[3], mn(m[2]), +m[1]);
  if((m = s.match(/\b([a-z]{3,9})\.?\s*(\d{1,2})(?:st|nd|rd|th)?\s*,?\s*(20\d\d)\b/i)) && mn(m[1])) return iso(+m[3], mn(m[1]), +m[2]);
  if((m = s.match(/\b(\d{1,2})[.\/-](\d{1,2})[.\/-](20\d\d)\b/))) return iso(+m[3], +m[2], +m[1]);
  return null;
}
function docDatum(text){
  const regels = String(text || '').split(/\r?\n/);
  const nu = Date.now();
  const redelijk = d => { const t = new Date(d + 'T12:00:00').getTime(); return t > nu - 300 * 864e5 && t < nu + 14 * 864e5; };
  const LABELS = [
    [/shipped\s+on\s+board|on\s+board\s+date|laden\s+on\s+board/i, 'verscheept'],
    [/\bETD\b/i, 'ETD'],
    [/B\/L[^\n]{0,40}?\bDT\b/i, 'B/L-datum'],
    [/invoice\s*date|\bCI\s*Date/i, 'invoicedatum'],
    [/\bdate\b|\bdatum\b/i, 'datum pakbon']
  ];
  for(const [rx, bron] of LABELS){
    for(let i = 0; i < regels.length; i++){
      const m = regels[i].match(rx); if(!m) continue;
      let d = datumTok(regels[i].slice(m.index + m[0].length));
      for(let j = 1; j <= 2 && !d && i + j < regels.length; j++) d = datumTok(regels[i + j]);
      if(d && redelijk(d)) return { datum:d, bron };
    }
  }
  return null;
}

function leesPakbonTekst(text, L){
  L = L || tekstRegels(text);
  if(/Inkoopbestelling\s+PO\d{4}-\d+/i.test(text)){
    const r = leesPicqerPO(text, L);
    const prof = PAKBON_LEV.concat([WALLACE]).find(pf => pf.zoek.test(r.levTekst || ''));
    r.lev = prof ? levNaam(prof) : (r.levTekst || null); r.profiel = 'po';
    r.verzonden = r.poDatum ? { datum:r.poDatum, bron:'inkoopbestelling' } : null;
    r.docs = [{ container:null, regels:r.regels, totaal_stuks:r.totaal_stuks, totaal_eenheden:null }];
    return r;
  }
  const prof = PAKBON_LEV.find(pf => pf.herken.test(text));
  let r;
  if(prof){ r = prof.lees(text, L); r.lev = levNaam(prof); r.profiel = prof.id; }
  else {
    r = parsePakbon(text);
    r.notities = [];
    r.containers = r.container ? [r.container] : [...new Set(String(text).match(RX_CONT) || [])];
    r.lev = (/wallace/i.test(text) || r.ref) ? levNaam(WALLACE) : null;
    r.profiel = r.regels.length ? 'wallace' : null;
  }
  r.verzonden = docDatum(text);
  const conts = [...new Set(r.regels.map(x => x.container).filter(Boolean))];
  r.docs = conts.length > 1
    ? conts.map(cn => ({ container:cn, regels:r.regels.filter(x => x.container === cn), totaal_stuks:null, totaal_eenheden:null }))
    : [{ container:conts[0] || r.container || (r.containers.length === 1 ? r.containers[0] : null), regels:r.regels, totaal_stuks:r.totaal_stuks, totaal_eenheden:r.totaal_eenheden }];
  return r;
}

// Tekst uit een digitale PDF. Woorden die dicht bij elkaar staan worden met één spatie verbonden,
// kolommen met drie spaties. Met metRegels komt er ook per regel de hoogte (y) mee: sommige
// pakbonnen hebben samengevoegde cellen waarbij de omschrijving of het containernummer
// naast de bijbehorende regels staat.
async function pdfTekst(pdf, metRegels){
  const out = [], regels = [];
  for(let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const items = tc.items.filter(i => i.str && i.str.trim()).map(i => ({ s:i.str, x:i.transform[4], y:i.transform[5], w:i.width || 0, fs:Math.abs(i.transform[3]) || Math.abs(i.transform[0]) || 10 }));
    const lines = [];
    items.forEach(it => {
      let L = lines.find(l => Math.abs(l.y - it.y) <= Math.max(2, it.fs * 0.35));
      if(!L){ L = { y:it.y, items:[] }; lines.push(L); }
      L.items.push(it);
    });
    lines.sort((a, b) => b.y - a.y);
    lines.forEach(L => {
      L.items.sort((a, b) => a.x - b.x);
      let t = '', prev = null;
      L.items.forEach(it => {
        const w = it.s.replace(/\s+/g, ' ');
        if(prev){
          const gap = it.x - (prev.x + prev.w);
          t = t.replace(/ +$/, '');
          t += gap > prev.fs * 0.8 ? '   ' : (gap > prev.fs * 0.12 || / $/.test(prev.s) || /^ /.test(it.s) ? ' ' : '');
          t += w.replace(/^ +/, '');
        } else t += w.trim();
        prev = it;
      });
      t = t.trim();
      out.push(t); regels.push({ p, y:Math.round(L.y * 10) / 10, s:t });
    });
  }
  const text = out.join('\n');
  return metRegels ? { text, regels } : text;
}
async function ocrCanvasList(canvases, prog){
  if(!window.Tesseract) await loadScript(TESS.js);
  let pagina = 0;
  const worker = await Tesseract.createWorker('eng', 1, {
    workerPath:TESS.worker, corePath:TESS.core, langPath:TESS.lang,
    logger:m => { if(m.status === 'recognizing text') prog((pagina + m.progress) / canvases.length); else if(m.status) prog(-1, m.status); }
  });
  await worker.setParameters({ tessedit_pageseg_mode:'6', preserve_interword_spaces:'1' });
  let text = '';
  for(pagina = 0; pagina < canvases.length; pagina++){
    const { data } = await worker.recognize(canvases[pagina]);
    text += data.text + '\n';
  }
  await worker.terminate();
  return text;
}
async function pdfNaarCanvas(pdf){
  const out = [];
  for(let p = 1; p <= Math.min(pdf.numPages, 4); p++){
    const page = await pdf.getPage(p);
    const base = page.getViewport({ scale:1 });
    const scale = Math.min(3.5, 2600 / Math.max(base.width, base.height));
    const vp = page.getViewport({ scale });
    const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext:ctx, viewport:vp }).promise;
    out.push(cv);
  }
  return out;
}
async function afbeeldingNaarCanvas(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const scale = Math.min(1, 3000 / Math.max(img.width, img.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return [cv];
  }finally{ URL.revokeObjectURL(url); }
}

function voorstelVoor(r, lev, ruw){
  const lk = levKort(lev || ''), key = norm(r.pakbon_code), tok = norm(eersteCode(r.pakbon_code || r.omschrijving));
  const txt = [r.pakbon_code, r.omschrijving, r.context].map(x => norm(x || '')).join('|');   // los genormaliseerd: een code mag niet over de grens van twee velden heen 'gevonden' worden (SF276H + SF276H… = sf276hs)
  const lijst = VOORSTEL.filter(x => (!lev || x.lk === lk) && (ruw || PLOW[x.code.toLowerCase()]));
  let v = lijst.find(x => x.k === key) || lijst.find(x => x.k === tok);
  if(!v) lijst.forEach(x => { if(x.k.length >= 6 && txt.includes(x.k) && (!v || x.k.length > v.k.length)) v = x; });
  return v || null;
}
function koppel(r, lev){
  const tok = norm(eersteCode(r.pakbon_code || r.omschrijving));
  const key = norm(r.pakbon_code);
  const txt = [r.pakbon_code, r.omschrijving, r.context].map(x => norm(x || '')).join('|');   // los genormaliseerd: een code mag niet over de grens van twee velden heen 'gevonden' worden (SF276H + SF276H… = sf276hs)
  const pool = (lev && BYLEV[lev] && BYLEV[lev].length) ? BYLEV[lev] : Object.keys(P);
  const als = ALIAS.filter(a => !lev || a.leverancier === lev);
  const uit = (code, match, factor, fbron) => {
    const fv = factor !== undefined ? { factor:factor, bron:fbron || 'geleerd' } : factorVoorstel(code, r);
    return { productcode:code, match, factor:fv.factor, factor_bron:fv.bron, bevestigd:match === 'alias' || match === 'exact' };
  };
  // 1. eerder bevestigd (geleerd)
  let a = als.find(x => x.pakbon_code === key) || als.find(x => x.pakbon_code === tok);
  if(a && P[a.productcode]) return uit(a.productcode, 'alias', num(a.factor) || 1, 'geleerd');
  // 2. exact gelijk aan een Picqer-productcode of leverancierscode
  let ex = (key.length >= 4 && (pool.find(c => norm(c) === key) || Object.keys(P).find(c => norm(c) === key))) || pool.find(c => norm(c) === tok) || pool.find(c => P[c] && P[c].leverancier_code && norm(P[c].leverancier_code) === tok);
  if(!ex && tok.length >= 4) ex = Object.keys(P).find(c => norm(c) === tok);
  if(ex) return uit(ex, 'exact');
  // 2b. ingebouwd voorstel (Claude), nooit bevestigd
  const vs = voorstelVoor(r, lev);
  if(vs){ const k = uit(PLOW[vs.code.toLowerCase()], 'voorstel', vs.factor, 'voorstel'); k.vs = { toel:vs.toel, zeker:vs.zeker }; return k; }
  // 3. code komt voor in de pakbontekst (langste wint)
  let best = null;
  als.forEach(x => { if(x.pakbon_code.length >= 4 && txt.includes(x.pakbon_code) && P[x.productcode] && (!best || x.pakbon_code.length > best.len)) best = { len:x.pakbon_code.length, code:x.productcode, alias:x }; });
  pool.forEach(c => { const n = norm(c); if(n.length >= 4 && txt.includes(n) && (!best || n.length > best.len)) best = { len:n.length, code:c }; });
  if(best) return best.alias ? uit(best.code, 'alias', num(best.alias.factor) || 1, 'geleerd') : uit(best.code, 'voorstel');
  // 4. bijna gelijk (typefout / OCR)
  let fz = null;
  if(tok.length >= 4) pool.forEach(c => {
    const nc = norm(c);
    if(nc !== tok && (nc.startsWith(tok) || tok.startsWith(nc))) return;   // SF276H en SF276HS zijn twee producten: een extra letter is geen typefout
    const d = lev1(nc, tok), lim = tok.length >= 8 ? 2 : 1;

}
// twee verschillende pakboncodes mogen nooit stilletjes één product worden: een voorstel (nog niet bevestigd) op een product dat al door een andere regel vaststaat, wordt "onbekend"
function ontdubbel(regels, lev){
  let n = 0;
  // het product is van de pakboncode die er letterlijk mee overeenkomt; een andere pakboncode op hetzelfde product (gok, leverancierscode of een eerder bevestigde koppeling) is dan verdacht
  const eigen = {};
  regels.forEach(r => { if(r.productcode && norm(r.productcode) === norm(r.pakbon_code)) eigen[r.productcode] = norm(r.pakbon_code); });
  regels.forEach(r => {
    if(!r.productcode || r.match === 'handmatig' || !eigen[r.productcode] || eigen[r.productcode] === norm(r.pakbon_code)) return;
    const vs = lev ? voorstelVoor(r, lev) : null, pc = vs ? PLOW[vs.code.toLowerCase()] : '';
    if(pc && pc !== r.productcode) Object.assign(r, { productcode:pc, match:'voorstel', factor:vs.factor, factor_bron:'voorstel', bevestigd:false, vs:{ toel:vs.toel, zeker:vs.zeker } });   // ingebouwd voorstel voor deze pakboncode
    else Object.assign(r, { productcode:'', match:'onbekend', factor:1, factor_bron:'vast', bevestigd:false });
    n++;

}

// welke Picqer-producten lijken op deze pakbonregel? (woorden uit de omschrijving tegen code en naam)
function kandidaten(r, lev, n){
  const w = t => String(t || '').toLowerCase().split(/[^a-z0-9]+/).filter(x => x.length >= 2 && !/^(the|and|per|mtr|roll|rol|mat|with|for|of|van|de|het|een|black|zwart)$/.test(x));
  const tw = w((r.omschrijving || '') + ' ' + (r.pakbon_code || '') + ' ' + (r.context || ''));
  if(!tw.length) return [];
  const pool = (lev && BYLEV[lev] && BYLEV[lev].length) ? BYLEV[lev] : Object.keys(P);
  const uit = [];
  pool.forEach(code => {
    const p = P[code]; if(p && p.actief === false) return;
    const dw = new Set(w(code + ' ' + (p.naam || '') + ' ' + (p.leverancier_code || '')));
    let sc = 0; tw.forEach(x => { if(dw.has(x)) sc += /\d/.test(x) ? 3 : 2; else if(x.length >= 4 && [...dw].some(y => y.startsWith(x) || x.startsWith(y) && y.length >= 4)) sc += 1; });
    if(sc >= 3) uit.push({ code, sc });
  });
  return uit.sort((a, b) => b.sc - a.sc || a.code.localeCompare(b.code)).slice(0, n || 4).map(x => x.code);
}

   Voorraad per product in deze container (pallets en los)
   ===================================================================== */
function factorVan(c, code){ const r = c.data.regels.find(x => x.productcode === code); return r ? (num(r.factor) || 1) : 1; }
function pools(c){
  const map = {}, order = [];
  c.data.regels.forEach(r => {
    if(!r.productcode) return;
    const f = num(r.factor) || 1;
    let p = map[r.productcode];
    if(!p){ p = map[r.productcode] = { code:r.productcode, regels:[], pallets:[], losU:0, totaalU:0, gebouwd:0, factor:f }; order.push(r.productcode); }
    p.regels.push(r);
    const tot = num(r.totaal) || 0, per = num(r.per) || 0, n = num(r.aantal) || 0;
    p.totaalU += tot * f;
    if(r.soort === 'pallet' && per > 0){
      const vol = Math.min(n, Math.floor(tot / per));
      for(let i = 0; i < vol; i++) p.pallets.push(per * f);
      const rest = tot - vol * per;
      if(rest > 0){ if(n > vol) p.pallets.push(rest * f); else p.losU += rest * f; }
    } else p.losU += tot * f;
  });
  order.forEach(code => {
    const p = map[code];
    const spp = sppVan(code);
    p.spp = spp;
    const losRegels = p.regels.filter(r => r.soort !== 'pallet');
    if(spp && losRegels.length && p.losU >= spp){
      const n = Math.floor(p.losU / spp);
      for(let i = 0; i < n; i++) p.pallets.push(spp);
      p.losU -= n * spp; p.gebouwd = n;
    }
    // al (deels) geleverd via een eerdere ontvangst: dat deel telt niet meer mee
    const g = Math.min(p.totaalU, num(((c.data.geleverd || {})[norm(code)])) || 0);
    if(g > 0){
      let rest = g;
      const uitLos = Math.min(p.losU, rest); p.losU -= uitLos; rest -= uitLos;
      p.pallets.sort((a, b) => a - b);
      while(rest > 0.0001 && p.pallets.length){ const x = p.pallets.pop(); if(x <= rest + 0.0001) rest -= x; else { p.pallets.push(x - rest); rest = 0; } }
      p.totaalU -= g; p.geleverd = g;
    }
    p.pallets.sort((a, b) => b - a);
    p.maten = {};
    p.pallets.forEach(s => p.maten[s] = (p.maten[s] || 0) + 1);
  });
  const vol = order.filter(code => map[code].geleverd && map[code].totaalU <= 0.0001);
  return { map, order:order.filter(code => !vol.includes(code)), klaar:vol };
}
// alles wat op de pakbon staat, per sleutel (Picqer-code, anders pakboncode), in Picqer-eenheden
function pakbonEenheden(c){
  const out = {};
  (c.data.regels || []).forEach(r => { const code = r.productcode || r.pakbon_code, k = norm(code); if(!k) return; (out[k] = out[k] || { code, u:0 }).u += (num(r.totaal) || 0) * (num(r.factor) || 1); });
  return out;
}
const nogOpen = (c, k) => { const pb = pakbonEenheden(c)[k]; return pb ? Math.max(0, pb.u - (num((c.data.geleverd || {})[k]) || 0)) : 0; };
function portieU(x){ return x.soort === 'pallet' ? (num(x.n) || 0) * (num(x.per) || 0) : (num(x.n) || 0); }
function restVan(pool, porties){
  const r = { maten:Object.assign({}, pool.maten), los:pool.losU, U:pool.totaalU };
  (porties || []).forEach(x => {
    r.U -= portieU(x);
    if(x.soort === 'pallet') r.maten[x.per] = (r.maten[x.per] || 0) - (num(x.n) || 0);
    else r.los -= num(x.n) || 0;
  });
  r.ok = Math.abs(r.U) < 0.001 && Object.values(r.maten).every(v => v === 0) && Math.abs(r.los) < 0.001;
  return r;
}
/* ---------- Planning over alle open containers (vooruitkijken) ----------
   Containers op datumvolgorde. Per product telt de app wat eerdere containers hier/BO/VST brengen
   (vastgelegde verdeling, anders hun advies), en hoeveel er tot aankomst verkocht wordt. */
let PLAN = null;
let GELADEN = 0;
// terug naar de app (ander tabblad, telefoon uit slaap): na een minuut de nieuwste gegevens ophalen
document.addEventListener('visibilitychange', async () => {
  if(document.hidden || Date.now() - GELADEN < 60000 || dirty || (UI.bulk && UI.bulk.bezig) || Object.keys(UI.pk || {}).length || UI.etaBezig) return;
  const a = document.activeElement; if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  if(await load()){ PLAN = null; rerender(); }
});
const volgKey = x => (x.losdatum || '9999') + ' ' + (x.lostijd || '99') + ' ' + String(x.id).padStart(8, '0');
function maandenTot(c){
  if(!c.losdatum) return 0;
  const d = new Date(c.losdatum + 'T12:00:00'), nu = new Date(); nu.setHours(12, 0, 0, 0);
  return Math.max(0, (d - nu) / (30.44 * 864e5));
}
const leegEerder = () => ({ hier:0, bo:0, vst:0, vstUit:0, refs:[] });
function planning(){
  if(PLAN) return PLAN;
  const plan = { per:{}, volg:[] };
  const acc = {};
  CONT.filter(o => o.status !== 'afgerond').sort((a, b) => volgKey(a).localeCompare(volgKey(b))).forEach(o => {
    ensureData(o);
    const pl = pools(o);
    plan.volg.push(o.id); plan.per[o.id] = {};
    pl.order.forEach(code => {
      const a = acc[code] = acc[code] || leegEerder();
      const eerder = { hier:a.hier, bo:a.bo, vst:a.vst, vstUit:a.vstUit, refs:a.refs.slice() };
      const adv = adviesKern(o, pl.map[code], eerder);
      const v = o.data.verdeling[code];
      const vast = !!(v && v.porties && v.porties.length);
      const porties = vast ? v.porties : adv.porties;
      let h = 0, b = 0, vs = 0;
      porties.forEach(x => { const u = portieU(x); if(DEST[x.dest] && DEST[x.dest].hier) h += u; else if(x.dest === 'BO') b += u; else if(x.dest === 'VST') vs += u; });
      a.hier += h; a.bo += b; a.vst += vs; a.vstUit += adv.uitVst || 0;
      if(h || b || vs) a.refs.push(o.pakbon_ref || o.containernummer || ('#' + o.id));
      plan.per[o.id][code] = { eerder, adv, porties, vast, h, b, vs };
    });
  });
  PLAN = plan;
  return plan;
}
function eerderGepland(c, code){
  const p = planning().per[c.id];
  return (p && p[code] && p[code].eerder) || leegEerder();
}
function advies(c, pool){
  const p = planning().per[c.id];
  if(p && p[pool.code]) return p[pool.code].adv;
  return adviesKern(c, pool, leegEerder());
}
function adviesKern(c, pool, eerder){
  const code = pool.code;
  const f = feiten(code);
  const maanden = num(c.data.instellingen.maanden) || 1.5;
  const uitleg = [];
  const pallets = pool.pallets.slice();
  const porties = [];
  const psize = pallets.length ? pallets[0] : 0;
  // voorraad hier bij aankomst: nu vrij + wat eerdere containers hier brengen − verkoop tot aankomst
  const start = f.vrij + eerder.hier + eerder.bo;
  const mnd = maandenTot(c);
  const verbruik = f.rate ? f.rate * mnd : 0;
  const vstOver = Math.max(0, f.vst + eerder.vst - eerder.vstUit);
  const uitVst = Math.min(Math.max(0, verbruik - Math.max(0, start)), vstOver);
  let vrij = start - verbruik + uitVst;
  const proj = vrij;
  const bo = Math.max(0, f.bo - eerder.bo);
  if(eerder.refs.length) uitleg.push('incl. ' + eerder.refs.join(', ') + ' (eerder)');
  if(verbruik >= 1 && mnd >= 0.1) uitleg.push('bij aankomst over ' + nf(mnd * 30.44 / 7, 1) + ' wk: −' + nf(verbruik) + ' verkoop' + (uitVst >= 1 ? ', ' + nf(uitVst) + ' terug uit VST' : '') + ' → hier ' + nf(vrij));
  // 1. backorders in hele pallets
  if(bo > 0 && psize > 0){
    let n = 0; while(n < pallets.length && (n + 1) * pallets[n] <= bo) n++;
    if(n > 0){ porties.push({ soort:'pallet', n, per:psize, dest:'BO' }); pallets.splice(0, n); vrij += n * psize; uitleg.push(n + ' pallet' + (n > 1 ? 's' : '') + ' dekt backorders'); }
  }
  // 2. benodigd hier
  let need;
  if(!f.rate){
    need = Math.max(0, -vrij) + (psize || pool.losU || 0);
    uitleg.push('geen verkoophistorie: backorders + 1 pallet extra');
  } else {
    const doel = f.rate * maanden;
    need = Math.max(0, doel - vrij);
    uitleg.push('doel ' + nf(doel) + ' (' + nf(maanden, 1) + ' mnd × ' + nf(f.rate) + '/mnd), vrij ' + nf(vrij));
  }
  // 3. los -> eerst hier aanvullen tot het doel, rest naar VST
  if(pool.losU > 0){
    const hierU = Math.max(0, Math.min(pool.losU, need));
    if(hierU > 0) porties.push({ soort:'los', n:hierU, dest:'PICK' });
    if(pool.losU - hierU > 0) porties.push({ soort:'los', n:pool.losU - hierU, dest:'VST' });
    need -= pool.losU;
  }
  // 4. pallets hier / VST
  let nHier = 0, acc = 0;
  while(need > 0 && acc < need && nHier < pallets.length){ acc += pallets[nHier]; nHier++; }
  const pickLeeg = pool.losU === 0 && (f.hm - f.bo + (vrij - f.vrij)) <= Math.max(0, (f.rate || 0) * 0.25);
  pallets.forEach((s, i) => {
    const dest = i < nHier ? ((i === 0 && pickLeeg) ? 'PICK' : 'UP') : 'VST';
    const last = porties[porties.length - 1];
    if(last && last.soort === 'pallet' && last.dest === dest && last.per === s) last.n++;
    else porties.push({ soort:'pallet', n:1, per:s, dest });
  });
  return { porties, uitleg:uitleg.join(' · '), feiten:f, eerder, proj, verbruik, uitVst, mnd };
}
function portiesGelijk(a, b){
  const k = arr => (arr || []).filter(x => portieU(x) > 0).map(x => x.soort + ':' + x.dest + ':' + (x.soort === 'pallet' ? x.per : '') + ':' + x.n).sort().join('|');
  return k(a) === k(b);
}

   Open punten

function punten(c, pl){
  const L = [];
  const add = (key, lvl, tekst, code, t, type, kort) => L.push({ key, lvl, tekst, code, tab:t, type:type || key, kort:kort || tekst });
  const R = c.data.regels;
  if(!c.losdatum) add('losdatum', 'let', 'Losdatum ontbreekt.', null, null);
  if(!R.length) add('geenregels', 'info', 'Nog geen pakbon ingelezen.', null, 'pakbon');
  const pb = c.data.pakbon || {};
  if(R.length && (pb.totaal_stuks != null || pb.totaal_eenheden != null)){
    const s = R.reduce((a, r) => a + (num(r.totaal) || 0), 0), e = R.reduce((a, r) => a + (num(r.aantal) || 0), 0);
    const mis = [];
    if(pb.totaal_stuks != null && Math.abs(s - pb.totaal_stuks) > 0.01) mis.push(nf(s) + ' stuks ingelezen, pakbon zegt ' + nf(pb.totaal_stuks));
    if(pb.totaal_eenheden != null && Math.abs(e - pb.totaal_eenheden) > 0.01) mis.push(nf(e) + ' pallets/dozen ingelezen, pakbon zegt ' + nf(pb.totaal_eenheden));
    if(mis.length) add('pbtot', 'fout', 'Regels tellen niet op tot het pakbontotaal (' + mis.join('; ') + '). Controleer de regels.', null, 'pakbon');
  }
  (pb.notities || []).forEach((t, i) => add('pbn-' + i, 'info', t, null, 'pakbon', 'pbn-' + i));
  if((pb.andere_containers || []).length) add('pbc', 'info', 'Op dezelfde pakbon staan ook container ' + pb.andere_containers.join(', ') + '. Die worden apart ingepland.', null, null, 'pbc');
  R.forEach((r, i) => {
    const lab = (r.pakbon_code || ('regel ' + (i + 1)));
    if(!r.productcode) add('code-' + r.id, 'fout', lab + ': nog geen Picqer-productcode gekoppeld.', null, 'pakbon', 'code', lab);
    else if(!r.bevestigd) add('bev-' + r.id, 'let', lab + ' → ' + r.productcode + ': voorstel, nog bevestigen.', r.productcode, 'pakbon', 'bev', lab + ' → ' + r.productcode);
    const t = num(r.totaal), pe = num(r.per), a = num(r.aantal);
    if(t && pe && a && Math.abs(t - pe * a) > 0.01 && !(r.soort === 'pallet' && t < pe * a && t > pe * (a - 1)))
      add('som-' + r.id, 'let', lab + ': ' + nf(pe) + ' × ' + nf(a) + ' is niet ' + nf(t) + '.', r.productcode, 'pakbon', 'som', lab + ' (' + nf(pe) + ' × ' + nf(a) + ' ≠ ' + nf(t) + ')');
    if(r.productcode && r.factor_bron === 'voorstel')
      add('fac-' + r.id, 'let', lab + ': factor ' + r.factor + ' (1 stuk op de pakbon = ' + nf(r.factor) + ' in Picqer, ' + (eenheidVan(r.productcode) === 'st.' ? 'afgeleid uit productgeheugen' : 'Picqer telt in ' + eenheidVan(r.productcode)) + '). Klopt dat?', r.productcode, 'pakbon', 'fac', lab + ': 1 = ' + r.factor + ' ' + eenheidVan(r.productcode));
    if(r.productcode && r.factor_bron === 'onbekend')
      add('fac-' + r.id, 'fout', lab + ': Picqer telt in cm, rollengte onbekend — vul de factor in.', r.productcode, 'pakbon', 'fac', lab + ': rollengte onbekend');
  });
  pl.order.forEach(code => {
    const pool = pl.map[code], p = P[code];
    if(!p){ add('pq-' + code, 'fout', code + ' staat niet in de Picqer-import. Importeer de Picqer-export van deze leverancier.', code, null); return; }
    const spp = sppVan(code);
    pool.regels.filter(r => r.soort === 'pallet').forEach(r => {
      const u = (num(r.per) || 0) * (num(r.factor) || 1);
      if(spp && u && u !== spp) add('spp-' + code + '-' + u, 'info', code + ': ' + nf(u) + ' per pallet op de pakbon, productgeheugen zegt ' + nf(spp) + '. Labels volgen de pakbon.', code, 'pakbon', 'spp', code + ' (pakbon ' + nf(u) + ', geheugen ' + nf(spp) + ')');
    });
    // Picqer-gewicht controleren tegen pakbon
    const netto = pool.regels.reduce((a, r) => a + (num(r.netto) || 0), 0);
    if(netto > 0 && pool.totaalU > 0){
      const perU = netto / pool.totaalU, pq = num(p.gewicht_product_g), per_ = eenheidVan(code) === 'st.' ? 'stuk' : eenheidVan(code);
      const x = pq ? perU / (pq / 1000) : 0;
      if(pq && x > 20 && factorVan(c, code) === 1) add('eh-' + code, 'let', code + ': pakbon ' + nf(perU, 1) + ' kg per stuk, Picqer ' + nf(pq / 1000, 3) + ' kg per eenheid. Telt Picqer per cm of meter? Zet dan de factor goed.', code, 'pakbon', 'eh', code + ' (' + nf(pq / 1000, 3) + ' kg in Picqer)');
      else if(!pq) add('gw-' + code, 'let', code + ': gewicht ontbreekt in Picqer (pakbon: ' + nf(perU, 2) + ' kg per ' + per_ + '). Aanpassen in Picqer.', code, null, 'gw', code + ' leeg → ' + nf(perU, 2) + ' kg/' + per_);
      else if(Math.abs(pq / 1000 - perU) / perU > 0.25) add('gw-' + code, 'let', code + ': Picqer-gewicht ' + nf(pq / 1000, 2) + ' kg, pakbon zegt ' + nf(perU, 2) + ' kg per ' + per_ + '. Aanpassen in Picqer (belangrijk voor orderpickers).', code, null, 'gw', code + ' ' + nf(pq / 1000, 2) + ' → ' + nf(perU, 2) + ' kg/' + per_);
    }
    const f = feiten(code);
    if(!f.rate && f.hm === 0) add('nieuw-' + code, 'info', code + ': geen verkoophistorie — nieuw product? Verdeling zelf beoordelen.', code, 'verdeling', 'nieuw', code);
    const v = c.data.verdeling[code];
    if(v && v.porties && v.porties.length && !restVan(pool, v.porties).ok) add('vd-' + code, 'fout', code + ': verdeling telt niet op.', code, 'verdeling', 'vd', code);
    if(perRol(eenheidVan(code)) && factorVan(c, code) === 1)
      add('eh-' + code, 'let', code + ': Picqer telt in ' + eenheidVan(code) + ', maar de factor is 1. Klopt dat?', code, 'pakbon', 'eh', code);
    const mis = pkInfo(c, pool).nodig.filter(x => x !== 'koppeling' && x !== 'omrekening');
    if(mis.length) add('pk-' + code, 'let', code + ': nog nodig: ' + mis.join(', ') + '.', code, 'pakbon', 'pk', code + ' (' + mis.join(', ') + ')');
  });
  c.data.punten_eigen.forEach(x => L.push({ key:'e-' + x.id, lvl:'eigen', tekst:x.tekst, code:x.productcode || null, eigen:x, type:'e-' + x.id }));
  const ord = { fout:0, let:1, eigen:2, info:3 };
  L.sort((a, b) => ord[a.lvl] - ord[b.lvl]);
  return L;
}
const LVL = { fout:['b-bad', 'fout'], let:['b-warn', 'let op'], info:['b-info', 'info'], eigen:['b-grey', 'notitie'] };

async function route(){
  PLAN = null;
  const h = location.hash || '#/';
  let m;
  if(!h.startsWith('#/producten')) SUP = null;
  const nu = h.startsWith('#/producten') ? 'producten' : h.startsWith('#/c/') ? 'home' : h.startsWith('#/gegevens') ? 'gegevens' : h.startsWith('#/vloernamen') ? 'vloernamen' : h.startsWith('#/vooruit') ? 'vooruit' : 'home';
  if(window.WHM) WHM.zet('cp:' + nu);
  if(window.WHM && !WHM.magHier('cp:' + nu)){ if(!h.startsWith('#/c/')){ if(dirty) await flushSave(); cur = null; setSaved(''); } app.innerHTML = WHM.nietHier({ producten:'Producten', vloernamen:'Vloernamen', vooruit:'Vooruit' }[nu]); return; }
  if(!h.startsWith('#/c/')){ if(dirty) await flushSave(); cur = null; setSaved(''); }
  if(['containers', 'pakbon_alias', 'verkoop', 'backorders'].some(t => MISSING.includes(t))) return viewSetup();
  if((m = h.match(/^#\/c\/(\d+)(?:\/(\w+))?/))) return viewContainer(+m[1], m[2] || 'pakbon');
  if(h.startsWith('#/gegevens')) return viewGegevens();
  if(h.startsWith('#/vooruit')) return viewVooruit();
  if(h.startsWith('#/producten')) return viewProducten(decodeURIComponent((h.split('/')[2] || '').split('?')[0]));
  if(h.startsWith('#/vloernamen')){
    const q = (h.split('?')[1] || '').split('&').find(x => x.startsWith('q='));
    if(q) UI.vn.f.q = decodeURIComponent(q.slice(2)).trim();
    return viewVloernamen();
  }
  return viewHome();
}

function focusKey(el){
  if(!el || el === document.body || !app.contains(el)) return null;
  if(el.id) return '#' + CSS.escape(el.id);
  const attrs = ['data-regel', 'data-k', 'data-meta', 'data-p', 'data-inst', 'data-wb', 'data-vn', 'data-vk', 'data-vnlos', 'data-vnf', 'data-pk', 'data-pf', 'data-vw'].filter(a => el.hasAttribute(a));
  if(!attrs.length) return null;
  let sel = el.tagName.toLowerCase() + attrs.map(a => '[' + a + '="' + CSS.escape(el.getAttribute(a)) + '"]').join('');
  const port = el.closest('.portie'), box = el.closest('[data-code]');
  if(port && box) sel = '[data-code="' + CSS.escape(box.dataset.code) + '"] .portie[data-i="' + port.dataset.i + '"] ' + sel;
  return sel;
}
// na een wijziging opnieuw tekenen, maar de cursor laten staan waar je naartoe tabde/klikte
function rerenderLater(){
  setTimeout(() => {
    const k = focusKey(document.activeElement);
    rerender();
    const e = k && document.querySelector(k);
    if(e){ e.focus({ preventScroll:true }); if(e.tagName === 'INPUT' && e.type !== 'file' && e.type !== 'checkbox') try{ e.select(); }catch(_){} }
  }, 0);
}

    <a href="#/gegevens" class="btn sm" style="margin-left:auto">Gegevens bijwerken</a>
  </div>`;
}
function voortgang(c){
  const pl = pools(c), pts = punten(c, pl);
  const R = c.data.regels;
  const pakbonOk = R.length && R.every(r => r.productcode && r.bevestigd);
  const n = pl.order.length;
  const akk = pl.order.filter(code => { const v = c.data.verdeling[code]; return v && v.bevestigd && restVan(pl.map[code], v.porties).ok; }).length;
  const pdMis = pl.order.filter(code => !P[code] || pkInfo(c, pl.map[code]).nodig.length).length;
  const open = pts.filter(p => (p.lvl === 'fout' || p.lvl === 'let' || (p.eigen && !p.eigen.klaar)) && !c.data.punten_klaar[p.key]).length;
  let pallets = 0, hier = 0, vst = 0, direct = 0;
  pl.order.forEach(code => {
    const v = c.data.verdeling[code];
    pallets += pl.map[code].pallets.length;
    (v && v.porties || []).forEach(x => { if(x.soort !== 'pallet') return; const k = num(x.n) || 0; if(x.dest === 'VST') vst += k; else if(DEST[x.dest] && DEST[x.dest].hier) hier += k; else direct += k; });
  });
  return { pl, pts, pakbonOk, n, akk, pdMis, open, pallets, hier, vst, direct, R };
}

const vnActief = code => !(P[code] && P[code].actief === false);
const VN_UITLEG = 'Stuks per pallet: een getal · <b>nvt</b> = geen pallet · <b>onb</b> = nog onbekend · <b>X</b> = uitfaseren. <b>0</b> is de oude code voor een aanvulpallet: vul voortaan het echte aantal in en zet bij het product het vinkje <i>aanvulpallet</i>.';

function vnSleutels(){ // productcode (kleine letters) -> echte sleutels in het productgeheugen
  const bySub = {};
  Object.keys(CAT).forEach(k => {
    const x = CAT[k]; if(!x) return;
    const s = String(x.sub == null ? '' : x.sub).trim().toLowerCase();
    if(s) (bySub[s] = bySub[s] || []).push(k);
  });
  return bySub;
}
// Schoont een Picqer-productnaam op tot een bruikbaar voorstel voor de vloernaam.
// Haalt alleen Picqer-verkoopjargon weg (PER CM/METER/ROL, rollengte-suffix) en zet
// een naam die helemaal in hoofdletters staat om naar normaal schrift. Verzint niets
// dat er niet al stond (geen maten/diktes toevoegen) — dat blijft aan Daan.
function vnVoorstel(naam){
  let s = String(naam || '').trim();
  if(!s) return '';
  s = s.replace(/\s*-\s*PER\s+(CM|METER|ROL|STUK)\s*$/i, '');
  s = s.replace(/\s*-\s*\d+([.,]\d+)?\s*x\s*\d+([.,]\d+)?\s*m\s*$/i, '');
  s = s.replace(/\s{2,}/g, ' ').replace(/\s*-\s*$/, '').trim();
  if(s && s === s.toUpperCase() && /[A-Z]/.test(s)){
    s = s.toLowerCase().replace(/(^|[\s'/(])([a-z])/g, (m0, p1, p2) => p1 + p2.toUpperCase());
    s = s.replace(/\b(Cm|Mm|Kg|Gr|Ml)\b/g, m0 => m0.toLowerCase());
  }
  return s;
}
function vnLijst(){
  const w = UI.vn.wijzig, bySub = vnSleutels();
  const rijen = Object.keys(P).filter(vnActief).sort((a, b) => a.localeCompare(b, 'nl')).map(code => {
    const keys = bySub[code.toLowerCase()] || [], regels = keys.map(k => CAT[k]);
    const g = regels[0] || null, bew = w[code] || null, p = P[code] || {};
    const eanP = String(p.ean == null ? '' : p.ean).trim(), eanG = String((g && g.ean) == null ? '' : g.ean).trim();
    return { code, lev:p.leverancier || '', pnaam:p.naam || '', regels, keys, gewijzigd:!!bew,
      ean: eanP || eanG, eanOud: eanP && eanG && eanP !== eanG ? eanG : '',
      naam: bew && bew.name !== undefined ? bew.name : String((g && g.name) == null ? '' : g.name),
      qty:  bew && bew.qty  !== undefined ? bew.qty  : String((g && g.qty)  == null ? '' : g.qty) };
  });
  const tel = {};
  rijen.forEach(r => { r.qs = qtySoort(r.qty); if(r.qs === 'weg') return; const k = vnKey(r.naam); if(k) tel[k] = (tel[k] || 0) + 1; });
  rijen.forEach(r => {
    const k = vnKey(r.naam);
    r.weg = r.qs === 'weg';
    r.leeg = !k && !r.weg;
    r.voorstel = !k && !r.weg ? vnVoorstel(r.pnaam) : '';
    r.dubbel = !r.weg && !!k && tel[k] > 1;
    r.meer = r.regels.length > 1;
    r.geenEan = !r.ean;
    r.raarEan = !!r.ean && !/^\d{8}$|^\d{12,14}$/.test(r.ean);
    r.geenQty = r.qs === 'leeg' || r.qs === 'fout';
    r.prob = r.weg ? false
      : r.qs === 'nvt' ? (r.dubbel || r.meer)
      : (r.leeg || r.dubbel || r.meer || r.geenEan || r.geenQty || r.raarEan);
  });
  return rijen;
}
function vnBadges(r){

async function vloernamenOpslaan(){
  const st = (m, cls) => { const s = $('vn_st'); if(s){ s.textContent = m; s.className = 'status ' + (cls || ''); } };
  const w = UI.vn.wijzig, los = UI.vn.los;
  const losCodes = Object.keys(los).filter(k => los[k]);
  const rijen = vnLijst(), byCode = {}; rijen.forEach(r => byCode[r.code] = r);
  const gew = Object.keys(w).map(c => byCode[c]).filter(Boolean);
  if(!gew.length && !losCodes.length) return toast('Niets gewijzigd.');
  const stuk = gew.filter(r => !r.weg && (r.dubbel || r.qs === 'fout' || (r.leeg && r.qs !== 'nvt' && r.qs !== 'leeg')));
  if(stuk.length) return st('Eerst oplossen: ' + stuk.slice(0, 5).map(r => r.code + (r.dubbel ? ' (dubbele naam)' : r.qs === 'fout' ? ' (stuks: een getal, 0, nvt, onb of X)' : ' (vloernaam is leeg)')).join(', ') + (stuk.length > 5 ? ' en nog ' + (stuk.length - 5) : ''), 'err');
  const weg = gew.filter(r => r.weg);
  if(weg.length && !confirm(weg.length + ' product(en) uitfaseren?\n\n' + weg.map(r => r.code).join(', ') +
    '\n\nZe gaan uit het productgeheugen (dus ook uit de Palletlabel-generator) en worden in deze app verborgen. Terugzetten kan onderaan de pagina Vloernamen.')) return;
  try{
    st('Opslaan…');
    const r = await api('GET', 'catalog?key=eq.catalog-ean&select=data');
    const cat = (r.length ? r[0].data : {}) || {};
    let n = 0;
    gew.forEach(rij => {
      if(rij.weg){
        Object.keys(cat).forEach(k => { if(cat[k] && String(cat[k].sub == null ? '' : cat[k].sub).trim().toLowerCase() === rij.code.toLowerCase()) delete cat[k]; });
        return;
      }
      let naam = String(rij.naam).replace(/\s+/g, ' ').trim();
      if(!naam && rij.qs === 'nvt'){ // geen pallet: naam doet er weinig toe, neem de Picqer-naam
        naam = vnVoorstel(rij.pnaam) || rij.code;
        const b = cat[vnKey(naam)];
        if(b && String(b.sub == null ? '' : b.sub).trim().toLowerCase() !== rij.code.toLowerCase()) naam += ' (' + rij.code + ')';
      }
      if(!naam) return;
      vnZetRegel(cat, rij.code, naam, rij.qty); n++;
    });
    losCodes.forEach(k => {
      const code = PLOW[String(los[k]).trim().toLowerCase()];
      if(!code || !cat[k]) return;
      cat[k].sub = code; cat[k].used = Date.now();
      const ep = String((P[code] || {}).ean == null ? '' : P[code].ean).trim();
      if(ep) cat[k].ean = ep;
      n++;
    });
    await api('POST', 'catalog?on_conflict=key', [{ key:'catalog-ean', mode:'ean', data:cat, updated_at:new Date().toISOString() }], { Prefer:'resolution=merge-duplicates,return=minimal' });
    indexCatalog(cat);
    for(const rij of weg){
      await api('PATCH', 'producten?productcode=eq.' + encodeURIComponent(rij.code), { actief:false, updated_at:new Date().toISOString() }, { Prefer:'return=minimal' });
      if(P[rij.code]) P[rij.code].actief = false;
    }
    UI.vn.wijzig = {}; UI.vn.los = {}; UI.vn.overzet = 0;
    rerender();
    toast((n ? n + ' opgeslagen' : '') + (n && weg.length ? ', ' : '') + (weg.length ? weg.length + ' uitgefaseerd' : '') + '.', 4000);
  }catch(e){ st('Opslaan mislukt: ' + e.message, 'err'); }
}

/* ---------- Picqer-imports ---------- */
function leesSheet(file){
  return file.arrayBuffer().then(buf => {
    const wb = XLSX.read(buf, { type:'array', cellDates:false });
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, blankrows:false, defval:null });
  });
}
const txt = v => leeg(v) ? null : (typeof v === 'number' ? (Number.isInteger(v) ? String(v) : String(v)) : (String(v).trim() || null));
async function impProducten(file){
  const st = m => { $('st_prod').textContent = m; $('st_prod').className = 'status'; };
  try{
    st('Lezen…');
    const arr = await leesSheet(file);
    const head = (arr[0] || []).map(h => String(h ?? '').trim());
    const MAP = { productcode:'Productcode', naam:'Naam', leverancier:'Leverancier', leverancier_code:'Productcode leverancier', ean:'Barcode',
      gewicht_product_g:'Gewicht', lengte_product_cm:'Lengte', breedte_product_cm:'Breedte', hoogte_product_cm:'Hoogte', actief:'Actief',
      abc:'ABC classificatie', locaties_hm:'Voorraadlocatie Hoofdmagazijn', voorraad_hm:'Voorraad Hoofdmagazijn',
      gereserveerd_hm:'Gereserveerde voorraad Hoofdmagazijn', vrij_hm:'Vrije voorraad Hoofdmagazijn', voorraad_vst:'Voorraad Bulk van Spreuwel', tags:'Tags' };
    const NUM = ['gewicht_product_g','lengte_product_cm','breedte_product_cm','hoogte_product_cm','voorraad_hm','gereserveerd_hm','vrij_hm','voorraad_vst'];
    const idx = {}; Object.entries(MAP).forEach(([k, h]) => idx[k] = head.indexOf(h));
    if(idx.productcode < 0) throw new Error('kolom "Productcode" niet gevonden. Is dit een Picqer-productenexport?');
    const nu = new Date().toISOString(), rows = [];
    for(let i = 1; i < arr.length; i++){
      const a = arr[i], code = txt(a[idx.productcode]);
      if(!code) continue;
      const r = { productcode:code, picqer_datum:nu };
      Object.keys(MAP).forEach(k => {
        if(k === 'productcode' || idx[k] < 0) return;
        const v = a[idx[k]];
        if(NUM.includes(k)) r[k] = num(v);
        else if(k === 'actief') r[k] = leeg(v) ? null : /^(true|ja|1|waar)$/i.test(String(v).trim());
        else r[k] = txt(v);
      });
      rows.push(r);
    }
    if(!rows.length) throw new Error('geen producten gevonden.');
    st('Opslaan… ' + rows.length + ' producten');
    { const g = new Set(); for(let i = rows.length - 1; i >= 0; i--){ if(g.has(rows[i].productcode)) rows.splice(i, 1); else g.add(rows[i].productcode); } }   // dubbele code (spatie/tab) maar één keer
    await upsert('producten', rows, 'productcode');
    await load();
    const nk = await herkoppelOpen();
    viewGegevens();
    $('st_prod').textContent = rows.length + ' producten bijgewerkt uit Picqer.' + (nk ? ' ' + nk + ' pakbonregel' + (nk > 1 ? 's' : '') + ' in open containers nu gekoppeld.' : ''); $('st_prod').className = 'status ok';
  }catch(e){ $('st_prod').textContent = 'Import mislukt: ' + e.message; $('st_prod').className = 'status err'; }
}
// koppelbestand: Leverancier | Op de pakbon | Picqer-productcode | Factor | Zekerheid
async function impKoppelingen(file){
  const st = (m, cls) => { const e = $('st_kop'); if(e){ e.textContent = m; e.className = 'status small ' + (cls || ''); } };
  try{
    const arr = await leesSheet(file);
    const h = (arr[0] || []).map(x => String(x || '').toLowerCase());
    const col = rx => h.findIndex(x => rx.test(x));
    const iL = col(/leverancier/), iP = col(/pakbon/), iC = col(/picqer|productcode/), iF = col(/factor/), iZ = col(/zeker/);
    if(iP < 0 || iC < 0) throw new Error('kolommen "Op de pakbon" en "Picqer-productcode" niet gevonden');
    const levNamen = [...new Set(CONT.map(c => c.leverancier).concat(alleLeveranciers()).filter(Boolean))];
    const rows = [], fout = [];
    arr.slice(1).forEach(r => {
      const code0 = txt(r[iC]), pb = txt(r[iP]), z = String(r[iZ] || '').toLowerCase();
      if(!pb || !code0 || /vraag/.test(z)) return;
      const code = PLOW[code0.toLowerCase()];
      if(!code){ fout.push(code0 + ' (staat niet in de Picqer-import)'); return; }
      const lk = levKort(txt(r[iL]) || '');
      const lev = levNamen.find(l => levKort(l) === lk) || txt(r[iL]);
      rows.push({ leverancier:lev, pakbon_code:norm(pb), pakbon_tekst:pb.slice(0, 200), productcode:code, factor:num(r[iF]) || 1, bevestigd_op:new Date().toISOString() });
    });
    if(!rows.length) throw new Error('geen bruikbare regels' + (fout.length ? ': ' + fout.join(', ') : ''));
    st('Opslaan… ' + rows.length + ' koppelingen');
    const saved = await upsert('pakbon_alias', rows, 'leverancier,pakbon_code');
    const sleutel = a => a.leverancier + '|' + a.pakbon_code;
    const nieuw = new Set((saved.length ? saved : rows).map(sleutel));
    ALIAS = ALIAS.filter(a => !nieuw.has(sleutel(a))).concat(saved.length ? saved : rows);
    const nk = await herkoppelOpen();
    st(rows.length + ' koppelingen opgeslagen, ' + nk + ' pakbonregel(s) in open containers nu gekoppeld.' + (fout.length ? ' Overgeslagen: ' + fout.join(', ') + '.' : ''), 'ok');
  }catch(e){ st('Import mislukt: ' + e.message, 'err'); }
}
// na een nieuwe Picqer-import: nog niet gekoppelde pakbonregels in open containers opnieuw proberen
async function herkoppelOpen(){
  let n = 0;
  for(const c of CONT){
    if(c.status === 'afgerond' || !(c.data.regels || []).length) continue;
    const prof = PAKBON_LEV.concat([WALLACE]).find(pf => pf.zoek.test(c.leverancier || ''));
    let wijz = false;
    if(prof){ const ln = levNaam(prof); if(ln !== c.leverancier){ c.leverancier = ln; wijz = true; } }
    c.data.regels.forEach(r => {                                    // voorstellen die nog niet bevestigd zijn opnieuw bekijken (eerdere fout: SF276H op SF276hS)
      if(!(r.productcode && r.match === 'voorstel') || ALIAS.some(a => a.pakbon_code === norm(r.pakbon_code) && a.leverancier === c.leverancier)) return;
      const k = koppel(r, c.leverancier);
      if(k.productcode !== r.productcode){ Object.assign(r, k); n++; wijz = true; }
    });
    if(ontdubbel(c.data.regels, c.leverancier)){ n++; wijz = true; }
    c.data.regels.forEach(r => {
      if(r.productcode) return;
      const k = koppel(r, c.leverancier);
      if(k.productcode){ Object.assign(r, k); n++; wijz = true; }
    });
    if(wijz){ try{ await bewaarContainer(c); }catch(e){} }
  }
  return n;
}

    const bnB = bnNaam('backup', {}), blobB = new Blob([JSON.stringify(data)], { type:'application/json' });

async function impVerkoop(file){
  const st = (m, c) => { $('st_vk').textContent = m; $('st_vk').className = 'status ' + (c || ''); };
  try{
    const van = $('vk_van').value, tot = $('vk_tot').value;
    if(!van || !tot || tot < van) throw new Error('vul eerst een geldige periode in.');
    const maanden = (new Date(tot) - new Date(van)) / 864e5 / 30.44 + 1 / 30.44;
    st('Lezen…');
    const arr = await leesSheet(file);
    const head = (arr[0] || []).map(h => String(h ?? '').trim());
    const ic = head.indexOf('Productcode'), ia = head.indexOf('Aantal'), il = head.indexOf('Leverancier');
    if(ic < 0 || ia < 0) throw new Error('kolommen "Productcode" en "Aantal" niet gevonden. Is dit het rapport Magazijnverkopen?');
    const som = {}, levVan = {};
    for(let i = 1; i < arr.length; i++){
      const code = txt(arr[i][ic]); if(!code) continue;
      const c2 = PLOW[code.toLowerCase()] || code;
      som[c2] = (som[c2] || 0) + (num(arr[i][ia]) || 0);
      if(il >= 0 && arr[i][il]) levVan[c2] = String(arr[i][il]).trim();
    }
    const levs = [...new Set(Object.values(levVan))];
    const nu = new Date().toISOString();
    const rows = Object.entries(som).map(([code, a]) => ({ productcode:code, leverancier:levVan[code] || (P[code] && P[code].leverancier) || null, aantal:a, periode_van:van, periode_tot:tot, maanden:+maanden.toFixed(2), per_maand:+(a / maanden).toFixed(2), geimporteerd_op:nu }));
    // producten van deze leverancier(s) zonder verkoop: 0 in deze periode
    levs.forEach(l => (BYLEV[l] || []).forEach(code => { if(!(code in som)) rows.push({ productcode:code, leverancier:l, aantal:0, periode_van:van, periode_tot:tot, maanden:+maanden.toFixed(2), per_maand:0, geimporteerd_op:nu }); }));
    st('Opslaan… ' + rows.length + ' producten');
    await upsert('verkoop', rows, 'productcode');
    await load(); viewGegevens();
    st(Object.keys(som).length + ' producten met verkoop ingeladen (' + nf(maanden, 1) + ' maanden)' + (levs.length ? ' voor ' + levs.join(', ') : '') + '.', 'ok');
  }catch(e){ st('Import mislukt: ' + e.message, 'err'); }
}
async function impBackorders(file){
  const st = (m, c) => { $('st_bo').textContent = m; $('st_bo').className = 'status ' + (c || ''); };
  try{
    st('Lezen…');
    const arr = await leesSheet(file);
    const head = (arr[0] || []).map(h => String(h ?? '').trim());
    const col = n => head.indexOf(n);
    const need = ['#', 'Productcode', 'Aantal'];
    need.forEach(n => { if(col(n) < 0) throw new Error('kolom "' + n + '" niet gevonden. Is dit de backorder-export?'); });
    const nu = new Date().toISOString(), rows = [];
    for(let i = 1; i < arr.length; i++){
      const a = arr[i], id = num(a[col('#')]); if(!id) continue;
      const bd = a[col('Besteld op')];
      rows.push({ id, bestelling:txt(a[col('Bestelling/Retour')]), leverancier:txt(a[col('Leverancier')]), productcode:txt(a[col('Productcode')]), product:txt(a[col('Product')]),
        aantal:num(a[col('Aantal')]), beschikbaar:num(a[col('Beschikbaar')]), verwacht:txt(a[col('Verwacht')]), magazijn:txt(a[col('Magazijn')]),
        besteld_op:bd && !isNaN(new Date(bd)) ? new Date(bd).toISOString() : null, geimporteerd_op:nu });
    }
    const levs = [...new Set(rows.map(r => r.leverancier).filter(Boolean))];
    st('Oude regels opruimen…');
    if(levs.length) await api('DELETE', 'backorders?leverancier=in.(' + levs.map(l => '"' + l.replace(/"/g, '') + '"').map(encodeURIComponent).join(',') + ')', undefined, { Prefer:'return=minimal' });
    if(rows.some(r => !r.leverancier)) await api('DELETE', 'backorders?leverancier=is.null', undefined, { Prefer:'return=minimal' });
    st('Opslaan… ' + rows.length + ' regels');
    await upsert('backorders', rows, 'id');
    await load(); viewGegevens();
    st(rows.length + ' backorderregels ingeladen (' + levs.length + ' leveranciers).', 'ok');
  }catch(e){ st('Import mislukt: ' + e.message, 'err'); }
}

const TABS = [['pakbon', 'Pakbon & producten'], ['verdeling', 'Verdeling'], ['uitvoer', 'Uitvoer']];
function viewContainer(id, t){
  const c = CONT.find(x => x.id === id);
  if(!c){ app.innerHTML = '<div class="card empty">Container niet gevonden. <a href="#/">Terug</a></div>'; return; }
  if(cur !== c){ cur = c; setSaved(''); }
  if(t === 'pallets') t = 'pakbon';
  tab = TABS.some(x => x[0] === t) ? t : 'pakbon';
  const g = voortgang(c);
  const tabSt = {
    pakbon: g.R.length ? (g.pakbonOk && !g.pdMis ? 'done' : 'todo') : '',
    verdeling: g.n ? (g.akk === g.n ? 'done' : 'todo') : '',
    uitvoer: c.status === 'afgerond' ? 'done' : ''
  };
  let body = '';
  if(tab === 'pakbon') body = tabPakbon(c, g);
  else if(tab === 'verdeling') body = tabVerdeling(c, g);
  else body = tabUitvoer(c, g);
  app.innerHTML = `
    <a href="#/" class="backlink">← Alle containers</a>
    ${kopKaart(c)}
    ${puntenKaart(c, g.pts)}
    <div class="tabs">${TABS.map(([k, l], i) => `<a class="tab ${k === tab ? 'on' : ''} ${tabSt[k]}" href="#/c/${c.id}/${k}"><span class="nr">${tabSt[k] === 'done' ? '✓' : i + 1}</span>${l}</a>`).join('')}</div>
    <div id="tabbody">${body}</div>
    <datalist id="dl-codes">${codesVoorLijst(c).map(code => `<option value="${esc(code)}">${esc(naamVan(code))}</option>`).join('')}</datalist>`;
}
function codesVoorLijst(c){

  const kop = L.find(l => /Inruimlijst/i.test(l.s) && !/^Inruimlijst/i.test(l.s.trim()));
  if(kop) r.lev = kolommen(kop.s)[0];
  for(let i = 0; i < L.length; i++){
    const k = kolommen(L[i].s);
    if(k.length < 3 || /^(Leverancier|Totaal|Productcode)$/i.test(k[0])) continue;
    const qi = k.map((x, j) => /^\d+$/.test(x) ? j : -1).filter(j => j >= 2).pop();
    if(qi === undefined) continue;
    let code = k[0];
    if(/-$/.test(code) && L[i + 1]) code += kolommen(L[i + 1].s)[0];
    r.regels.push({ code:PLOW[code.toLowerCase()] || code, aantal:+k[qi] });
  }
  return r;
}
async function leesOntvangst(file){
  if(/\.pdf$/i.test(file.name) || file.type === 'application/pdf'){
    const pdf = await pdfjsLib.getDocument({ data:await file.arrayBuffer() }).promise;
    const t = await pdfTekst(pdf, true);
    return leesOntvangstTekst(t.text, t.regels);
  }
  const arr = await leesSheet(file);
  const hi = arr.findIndex(r => (r || []).some(x => /^productcode$/i.test(String(x || '').trim())) && (r || []).some(x => /^aantal$/i.test(String(x || '').trim())));
  if(hi < 0) throw new Error('geen kolommen Productcode en Aantal gevonden');
  const h = arr[hi].map(x => String(x || '').trim().toLowerCase()), ic = h.indexOf('productcode'), ia = h.indexOf('aantal');
  const r = { rc:(file.name.match(/\bRC\d{4}-\d+\b/) || [])[0] || null, datum:null, lev:null, regels:[] };
  arr.slice(hi + 1).forEach(row => { const code = txt(row[ic]); if(code && num(row[ia])) r.regels.push({ code:PLOW[code.toLowerCase()] || code, aantal:num(row[ia]) }); });
  const levs = {}; r.regels.forEach(x => { const l = (P[x.code] || {}).leverancier; if(l) levs[l] = (levs[l] || 0) + 1; });
  r.lev = Object.keys(levs).sort((a, b) => levs[b] - levs[a])[0] || null;
  return r;
}

function ontvangstVerdeelPlan(o, lev){
  const k = levKort(lev || o.lev || '');
  const oud = c => (c.data.verzonden || c.losdatum || '9999') + ' ' + String(c.id).padStart(8, '0');
  const kand = CONT.filter(c => c.status !== 'afgerond' && (c.data.regels || []).length && levKort(c.leverancier) === k).sort((a, b) => oud(a).localeCompare(oud(b)));
  const per = kand.map(c => ({ c, regels:[], open:Object.fromEntries(Object.keys(pakbonEenheden(c)).map(x => [x, nogOpen(c, x)])) }));
  const extra = [];
  o.regels.forEach(x => {
    let rest = x.aantal; const key = norm(x.code);
    per.forEach(p => { const open = p.open[key] || 0; if(rest > 0 && open > 0){ const t = Math.min(open, rest); p.regels.push({ code:x.code, key, t }); p.open[key] = open - t; rest -= t; } });
    if(rest > 0) extra.push({ code:x.code, aantal:rest });
  });
  per.forEach(p => { p.vol = Object.values(p.open).every(v => v <= 0.0001); });
  return { lev:k, per:per.filter(p => p.regels.length), extra };
}

// welke open pakbon (zelfde leverancier, nog zonder inkoopbestelling) hoort bij deze inkoopbestelling
function poMatch(r, alleenId, alleenC){
  const k = levKort(r.lev || ''), po = {};
  r.regels.forEach(x => { const key = norm(x.productcode || x.pakbon_code); po[key] = (po[key] || 0) + x.totaal; });
  let best = null;
  const kand = alleenC ? [alleenC] : alleenId ? CONT.filter(c => c.id === alleenId) : CONT;
  kand.filter(c => c.status !== 'afgerond' && !c.data.po && !c.pakbon_ref?.startsWith('PO') && levKort(c.leverancier) === k && (c.data.regels || []).length).forEach(c => {
    const pb = {}; Object.entries(pakbonEenheden(c)).forEach(([key, x]) => pb[key] = x.u);
    const keys = new Set(Object.keys(po).concat(Object.keys(pb)));
    let mn = 0, mx = 0; keys.forEach(key => { const a = po[key] || 0, b = pb[key] || 0; mn += Math.min(a, b); mx += Math.max(a, b); });
    const sc = mx ? mn / mx : 0;
    if(sc >= 0.6 && (!best || sc > best.sc)) best = { c, sc };
  });
  return best;
}
// welke open container past het best bij deze ontvangst
function ontvangstMatch(o){
  const codes = new Set(o.regels.map(x => norm(x.code)));
  let best = null;
  CONT.filter(c => c.status !== 'afgerond' && (c.data.regels || []).length).forEach(c => {
    const pc = [...new Set(c.data.regels.map(r => norm(r.productcode || r.pakbon_code)))], hit = pc.filter(x => codes.has(x)).length;
    if(!hit) return;
    const sc = hit / Math.max(codes.size, pc.length) + (o.lev && levKort(o.lev) === levKort(c.leverancier) ? 0.2 : 0);
    if(!best || sc > best.sc) best = { id:c.id, sc, hit };
  });
  return best;
}
// vergelijking pakbon (in Picqer-eenheden) ↔ ontvangen
function ontvangstVergelijk(c, o){
  const ontv = {}, rij = [], pbs = {};
  o.regels.forEach(x => ontv[norm(x.code)] = (ontv[norm(x.code)] || 0) + x.aantal);
  (c.data.voorboekingen || []).filter(v => !(v.rc && v.rc === o.rc)).forEach(v => v.regels.forEach(x => ontv[norm(x.code)] = (ontv[norm(x.code)] || 0) + x.aantal));   // eerder al opgeboekt telt mee
  c.data.regels.forEach(r => { const code = r.productcode || r.pakbon_code, k = norm(code); (pbs[k] = pbs[k] || { code, pb:0 }).pb += (num(r.totaal) || 0) * (num(r.factor) || 1); });
  Object.entries(c.data.geleverd || {}).forEach(([k, g]) => { if(pbs[k]) pbs[k].pb = Math.max(0, pbs[k].pb - (num(g) || 0)); });
  Object.entries(pbs).forEach(([k, x]) => { const on = ontv[k] || 0; rij.push({ code:x.code, pb:x.pb, on, vs:on - x.pb }); delete ontv[k]; });
  o.regels.forEach(x => { if(ontv[norm(x.code)] !== undefined){ rij.push({ code:x.code, pb:0, on:ontv[norm(x.code)], vs:ontv[norm(x.code)] }); delete ontv[norm(x.code)]; } });
  return rij;
}

// leest één bestand (PDF, scan, foto, Excel of tekst) en herkent leverancier + regels
async function leesBestand(file, st){
  st = st || (() => {});
  let text = '', methode = '', res = null;
  if(/\.pdf$/i.test(file.name) || file.type === 'application/pdf'){
    st('PDF lezen…');
    if(!window.pdfjsLib) throw new Error('PDF-lezer niet geladen (internet?)');
    const pdf = await pdfjsLib.getDocument({ data:await file.arrayBuffer() }).promise;
    const t = await pdfTekst(pdf, true);
    text = t.text; methode = 'pdf'; res = leesPakbonTekst(text, t.regels);
    if(!res.regels.length && t.text.replace(/\s/g, '').length < 200){
      st('Dit lijkt een scan. Tekst herkennen… (eerste keer ± 30 sec)');
      const cvs = await pdfNaarCanvas(pdf);
      text = await ocrCanvasList(cvs, (pr, s2) => st(pr >= 0 ? 'Tekst herkennen… ' + Math.round(pr * 100) + '%' : 'Tekstherkenning starten… (' + s2 + ')'));
      methode = 'ocr'; res = leesPakbonTekst(text);
    }
  } else if(/^image\//.test(file.type)){
    st('Foto lezen…');
    const cvs = await afbeeldingNaarCanvas(file);
    text = await ocrCanvasList(cvs, (pr, s2) => st(pr >= 0 ? 'Tekst herkennen… ' + Math.round(pr * 100) + '%' : 'Tekstherkenning starten… (' + s2 + ')'));
    methode = 'ocr'; res = leesPakbonTekst(text);
  } else if(/\.(xlsx|xls|csv)$/i.test(file.name)){
    const arr = await leesSheet(file);
    text = arr.map(r => r.map(v => v ?? '').join('\t')).join('\n');
    res = leesPakbonTekst(arr.map(r => r.filter(v => v !== null && v !== '').join('   ')).join('\n'));
    methode = 'excel';
  } else {
    text = await file.text(); res = leesPakbonTekst(text); methode = 'plak';
  }
  if(!res.regels.length){
    const simpel = parseSimpel(text);
    if(simpel.length){ res.regels = simpel; res.docs = [{ container:null, regels:simpel, totaal_stuks:null, totaal_eenheden:null }]; }
  }
  return { text, methode, res };
}

// losdatum/-tijd uit de bestandsnaam, zoals "Selected MIEU3762596 01-10 0900.pdf" of "… 30-09 10.00.pdf"
function losMoment(naam){
  const t = String(naam || '').replace(/\.[a-z0-9]+$/i, '').replace(/_/g, ' ');
  const re = /(?<![\dA-Za-z])(\d{1,2})-(\d{1,2})(?:-(\d{4}|\d{2}))?(?!\d)(?:\s+(?:om\s+)?(\d{1,2})[.:u]?(\d{2})(?!\d))?/g;
  let m;
  while((m = re.exec(t))){
    const d = +m[1], mnd = +m[2];
    if(d < 1 || d > 31 || mnd < 1 || mnd > 12) continue;
    const nu = new Date(); let j;
    if(m[3]) j = m[3].length === 2 ? 2000 + +m[3] : +m[3];
    else {
      j = nu.getFullYear();
      const kand = new Date(j, mnd - 1, d);
      if(kand - nu < -120 * 864e5) j++; else if(kand - nu > 240 * 864e5) j--;
    }
    const dt = new Date(j, mnd - 1, d);
    if(dt.getMonth() !== mnd - 1) continue;
    const p2 = x => String(x).padStart(2, '0');
    let tijd = null;
    if(m[4] != null){ const u = +m[4], mi = +m[5]; if(u <= 23 && mi <= 59) tijd = p2(u) + ':' + p2(mi); }
    return { datum:j + '-' + p2(mnd) + '-' + p2(d), tijd, verwacht:/\b(eta|verwacht)\b/i.test(t) };
  }
  return null;
}
function zetLosMoment(c, lm){
  if(!lm) return false;
  const sig = () => (c.losdatum || '') + ' ' + (c.lostijd || '') + ' ' + isVerwacht(c);
  const oud = sig();
  c.losdatum = lm.datum; if(lm.tijd) c.lostijd = lm.tijd;
  c.data = c.data || {}; delete c.data.eta_auto;
  if(lm.verwacht) c.data.verwacht = true; else delete c.data.verwacht;
  return oud !== sig();
}
// doorlooptijd verzenddatum → losdatum, geleerd per leverancier uit containers met een vaste losdatum
const ETA_STANDAARD = 42;
const dagenTussen = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const plusDagen = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
function doorloopVan(lev){
  const k = levKort(lev);
  const lijst = CONT.filter(o => levKort(o.leverancier) === k && o.data && o.data.verzonden && o.losdatum && !o.data.verwacht)
    .map(o => dagenTussen(o.data.verzonden, o.losdatum)).filter(x => x >= 5 && x <= 150);
  if(!lijst.length) return { dagen:ETA_STANDAARD, n:0 };
  return { dagen:Math.round(lijst.reduce((a, b) => a + b, 0) / lijst.length), n:lijst.length, min:Math.min(...lijst), max:Math.max(...lijst) };
}
// ETA automatisch uit de verzenddatum (alleen als er nog geen datum is, of als de vorige ook automatisch was)
function zetEtaAuto(c){
  if(!c.data || !c.data.verzonden) return false;
  if(c.losdatum && !c.data.eta_auto) return false;
  if(c.losdatum && !c.data.verwacht) return false;
  const d = doorloopVan(c.leverancier), eta = plusDagen(c.data.verzonden, d.dagen);
  const oud = c.losdatum + '|' + JSON.stringify(c.data.eta_auto || null);
  c.losdatum = eta; c.lostijd = null; c.data.verwacht = true; c.data.eta_auto = { dagen:d.dagen, n:d.n };
  return oud !== c.losdatum + '|' + JSON.stringify(c.data.eta_auto);
}
// na een vaste losdatum: automatische ETA's van dezelfde leverancier bijwerken met het nieuwe gemiddelde
async function etaHerleer(lev){
  const k = levKort(lev);
  for(const o of CONT){ if(o.status !== 'afgerond' && levKort(o.leverancier) === k && o.data.eta_auto && o.data.verwacht && zetEtaAuto(o)){ try{ await bewaarContainer(o); }catch(e){} } }
}
// container is al gelost (datum voorbij): losdatum = werkelijke datum, afronden zodat de voorraad niet dubbel telt
async function alGelost(c, datum){
  c.losdatum = datum; delete c.data.verwacht; delete c.data.eta_auto;
  const snap = {}; pools(c).order.forEach(code => { const f = feiten(code); snap[code] = { hm:f.hm, vrij:f.vrij, vst:f.vst, rate:f.rate, bo:f.bo }; });
  c.data.snapshot = snap; c.data.afgerond_op = new Date().toISOString(); c.data.gelost_zonder_planning = !Object.keys(c.data.verdeling || {}).length;
  c.status = 'afgerond';
  await bewaarContainer(c);
  await etaHerleer(c.leverancier);
}
const isVoorbij = c => c.status !== 'afgerond' && c.losdatum && c.losdatum < new Date().toISOString().slice(0, 10);
// verwacht = ETA is nog een schatting (pakbon vroeg binnen); definitief = gepland met de vervoerder
const isVerwacht = c => !!(c && c.data && c.data.verwacht);
const losTekst = c => (isVerwacht(c) ? 'ETA ' : '') + fdate(c.losdatum, { weekday:'short', day:'numeric', month:'short' }) + (c.lostijd ? ' ' + c.lostijd : '');
async function pakbonnenBulk(files){

  const poLijst = [];
  const bewaar = async (c, f) => {
    if(OPSLAG === false) return '';

    catch(e){ return ' Bestand niet bewaard (' + e.message.slice(0, 60) + ').'; }
  };

  for(const f of lijst){
    const inNaam = (f.name.toUpperCase().match(/[A-Z]{3}U\d{7}/) || [])[0];   // scheelt tekstherkenning van scans die er al zijn

      const datum = zetLosMoment(alBekend, lm);
