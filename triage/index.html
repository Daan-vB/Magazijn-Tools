<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Picklocatie triage</title>
<link rel="manifest" href="./manifest.json">

<style>
:root{
  --bg:#EDEDE8; --card:#fff; --ink:#14161A; --mut:#6B7280; --line:#DEDED8;
  --navy:#1F3864; --navy2:#2F5496;
  --g:#0E8A4F; --o:#D98324; --r:#C0392B; --x:#9AA0A6;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior-y:none;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 0 0}
.hrow{display:flex;align-items:center;gap:8px;padding:2px 12px 8px}
.htitle{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
.hspace{flex:1}
.hbtn{background:rgba(255,255,255,.14);border:0;color:#fff;font-size:12px;font-weight:600;
  padding:7px 11px;border-radius:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 12px 9px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:rgba(255,255,255,.12);border:0;color:#fff;font-size:13px;
  font-weight:600;padding:8px 12px;border-radius:9px;white-space:nowrap;opacity:.75}
.tab.on{background:#fff;color:var(--navy);opacity:1}
.tab .n{font-size:11px;opacity:.7;margin-left:5px;font-variant-numeric:tabular-nums}
.tab.on .n{opacity:.6}

/* progress rail */
.rail{height:4px;display:flex;background:#0d1c33}
.rail i{display:block;height:100%}

/* ---------- toolbar ---------- */
.tools{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);
  padding:8px 12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--mut);
  font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:8px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;
  font-size:15px;background:var(--card);color:var(--ink);margin:0 0 2px}
.searchwrap{padding:8px 12px 4px;background:var(--bg)}

/* ---------- folders ---------- */
main{padding:6px 10px calc(88px + var(--safe-b))}
.lev{background:var(--card);border-radius:12px;margin-bottom:8px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.05)}
.levhead{display:flex;align-items:center;gap:10px;padding:13px 13px;cursor:pointer}
.levname{font-weight:700;font-size:14.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.levmeta{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.caret{width:9px;height:9px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);
  transform:rotate(-45deg);transition:transform .15s;flex:0 0 auto;margin-right:2px}
.lev.open .caret{transform:rotate(45deg)}
.levbody{display:none;border-top:1px solid var(--line)}
.lev.open .levbody{display:block}

/* tally bar = signature */
.tally{display:flex;height:5px;border-radius:3px;overflow:hidden;background:#E6E6E0;width:62px;flex:0 0 auto}
.tally i{display:block;height:100%}

/* family */
.fam{border-bottom:1px solid var(--line)}
.fam:last-child{border-bottom:0}
.famhead{display:flex;align-items:center;gap:9px;padding:10px 13px;background:#F6F6F2}
.famname{font-size:12.5px;font-weight:700;color:var(--navy2);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:capitalize}
.famcnt{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.fcaret{width:7px;height:7px;border-right:2px solid var(--navy2);border-bottom:2px solid var(--navy2);
  transform:rotate(-45deg);transition:transform .15s;flex:0 0 auto;opacity:.6}
.fam.open .fcaret{transform:rotate(45deg)}
.fam .bulk,.fam .p{display:none}
.fam.open .bulk{display:flex}
.fam.open .p{display:flex}
.bulk{gap:5px;padding:0 13px 10px;background:#F6F6F2;flex-wrap:wrap}
.bulk b{font-size:10.5px;color:var(--mut);font-weight:600;align-self:center;margin-right:1px;
  text-transform:uppercase;letter-spacing:.03em}
.bb{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 9px;font-size:11.5px;font-weight:700}
.bb.g{color:var(--g)} .bb.o{color:var(--o)} .bb.r{color:var(--r)} .bb.x{color:var(--x)}
.bb.afd{color:var(--navy2)}

/* ---------- product row ---------- */
.p{display:flex;gap:0;border-top:1px solid #F0F0EC;position:relative}
.stripe{width:4px;flex:0 0 auto;background:#E2E2DC}
.p[data-s=g] .stripe{background:var(--g)}
.p[data-s=o] .stripe{background:var(--o)}
.p[data-s=r] .stripe{background:var(--r)}
.p[data-s=x] .stripe{background:var(--x)}
.p[data-s=x] .pname{text-decoration:line-through;color:var(--mut)}
.pbody{flex:1;min-width:0;padding:10px 12px 9px}
.pname{font-size:13.5px;line-height:1.3;font-weight:500}
.pmeta{font-size:11px;color:var(--mut);margin-top:3px;font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta .abc{font-weight:700;color:var(--ink)}
.dead{display:inline-block;background:#EFE0E0;color:#94443A;border-radius:4px;
  padding:1px 5px;font-size:10px;font-weight:700;margin-left:5px}
.prow2{display:flex;align-items:center;gap:7px;margin-top:8px}
.afdbtn{flex:1;min-width:0;text-align:left;background:#F2F2EE;border:1px solid var(--line);
  border-radius:8px;padding:7px 9px;font-size:11.5px;font-weight:600;color:var(--navy2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.afdbtn.empty{color:#B0392B;background:#FBEFEE;border-color:#F0D8D5}
.sbtns{display:flex;gap:5px;flex:0 0 auto}
.sb{width:38px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:#fff;
  font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#C9C9C2}
.sb.g.on{background:var(--g);border-color:var(--g);color:#fff}
.sb.o.on{background:var(--o);border-color:var(--o);color:#fff}
.sb.r.on{background:var(--r);border-color:var(--r);color:#fff}
.sb.x.on{background:var(--x);border-color:var(--x);color:#fff}

/* ---------- bottom bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:9px 12px calc(9px + var(--safe-b));display:flex;gap:8px;align-items:center}
.stat{flex:1;min-width:0;font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums;line-height:1.3}
.stat b{color:var(--ink)}
.abtn{background:var(--navy);color:#fff;border:0;border-radius:9px;padding:10px 13px;
  font-size:12.5px;font-weight:700;flex:0 0 auto}
.abtn.sec{background:#E8E8E2;color:var(--ink)}

/* ---------- sheet ---------- */
.veil{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:60;display:none}
.veil.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--card);
  border-radius:16px 16px 0 0;transform:translateY(101%);transition:transform .22s ease;
  max-height:82vh;display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
.sheet.on{transform:none}
.shead{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.shead h3{margin:0;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slist{overflow-y:auto;padding:6px 10px 16px;-webkit-overflow-scrolling:touch}
.opt{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #F2F2EE;
  padding:14px 8px;font-size:14.5px;color:var(--ink);font-weight:500}
.opt.on{color:var(--navy2);font-weight:800}
.opt.on:after{content:"✓";float:right;font-weight:800}
.opt.clear{color:var(--mut)}
.empty{padding:40px 20px;text-align:center;color:var(--mut);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(78px + var(--safe-b));transform:translate(-50%,14px);
  background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:9px 15px;
  border-radius:9px;z-index:80;opacity:0;transition:.18s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
"use strict";

function showErr(msg){
  try{
    document.getElementById('errtxt').textContent = String(msg);
    document.getElementById('errbox').style.display='block';
  }catch(e){}
}
window.addEventListener('error', e=> showErr((e.message||'fout')+'  @'+(e.lineno||'?')));
window.addEventListener('unhandledrejection', e=> showErr('promise: '+(e.reason&&e.reason.message||e.reason)));

/* ============ data ============ */
const RAW  = JSON.parse(document.getElementById('DATA').textContent);
const LEVS = RAW.levs;
const FAMS = RAW.fams;
const AFDS = RAW.afds;
const TABS = RAW.tabs;
const TABNAMES = Object.keys(TABS);

// veld-index in productarray
const F = {CODE:0, NAAM:1, LEV:2, VR:3, ABC:4, LOC:5, FAM:6, AFD:7, ST:8};
const famOf = p => FAMS[p[F.FAM]];
const dood  = p => (!p[F.ABC] && !p[F.VR] && !p[F.LOC]) ? 1 : 0;

const AFDELINGEN = [
 'AA-AB','AC/Cobra','CF','Tegels',

 'Midden Kantoor','Midden trapleuningen',
 'Bureaus en bureaustoelen','Whiteboards','Whiteboard accessoires',

];

const SLABEL = {g:'Belangrijk — picklocatie', o:'Medium — ook picklocatie',
                r:'Zelden — alleen bulk', x:'Weg uit administratie'};

/* ============ storage (Claude.ai + standalone + merge) ============ */
const KEY = 'triage_v1';
const Store = {
  async readAll(){
    let a=null,b=null;
    try{ if(window.storage && window.storage.get){
      const r = await window.storage.get(KEY); if(r&&r.value) a=JSON.parse(r.value);
    }}catch(e){}
    try{ const s=localStorage.getItem(KEY); if(s) b=JSON.parse(s); }catch(e){}
    return merge(a,b);
  },
  async writeAll(obj){
    const s=JSON.stringify(obj);
    try{ if(window.storage && window.storage.set) await window.storage.set(KEY,s); }catch(e){}
    try{ localStorage.setItem(KEY,s); }catch(e){}
  }
};
function merge(a,b){
  const out={};
  for(const src of [a,b]){
    if(!src) continue;
    for(const k in src){
      if(!out[k]) out[k]={};
      Object.assign(out[k], src[k]);
    }
  }
  return out;
}

// state[tab][code] = {s:'g', a:'CF'}
let state = {};

async function persist(){
  await Store.writeAll(state);
}
let saveTimer=null;
function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(persist,350); }

/* ============ view state ============ */
let curTab = TABNAMES[0];
let filter = 'todo';
let query  = '';
const openLevs = new Set();
const openFams = new Set();    // handmatig geopend (in grote mappen)

/* ============ helpers ============ */
function getRec(tab, code){
  return (state[tab] && state[tab][code]) || null;
}
function setRec(tab, code, patch){
  if(!state[tab]) state[tab]={};
  const cur = state[tab][code] || {};
  state[tab][code] = Object.assign({}, cur, patch);
  queueSave();
  bumpChanges(1);
}
function statusOf(tab,p){
  const r=getRec(tab,p[F.CODE]);
  return (r && r.s !== undefined) ? r.s : p[F.ST];
}
function afdOf(tab,p){
  const r=getRec(tab,p[F.CODE]);
  return (r && r.a !== undefined) ? r.a : (AFDS[p[F.AFD]]||'');
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============ grouping ============ */
function groupsFor(tab){
  const prods = TABS[tab];

  for(let idx=0; idx<prods.length; idx++){
    const p = prods[idx];
    const st = statusOf(tab,p);
    if(filter==='todo' && st) continue;
    if(filter!=='all' && filter!=='todo' && st!==filter) continue;
    if(q){
      const hay = (p[F.NAAM]+' '+p[F.CODE]+' '+p[F.LOC]).toLowerCase();
      if(hay.indexOf(q)<0) continue;
    }
    const lev = LEVS[p[F.LEV]];
    if(!byLev.has(lev)) byLev.set(lev, new Map());
    const fams = byLev.get(lev);
    const fm = famOf(p);
    if(!fams.has(fm)) fams.set(fm, []);
    fams.get(fm).push(idx);
  }
  const levs = [...byLev.entries()].map(([lev,fams])=>{
    const famArr = [...fams.entries()]
      .map(([fam,items])=>({fam, items}))
      .sort((a,b)=> b.items.length-a.items.length || a.fam.localeCompare(b.fam));
    const total = famArr.reduce((n,f)=>n+f.items.length,0);
    return {lev, fams:famArr, total};
  }).sort((a,b)=> b.total-a.total || a.lev.localeCompare(b.lev));
  return levs;
}

function tallyOf(tab, idxs){
  const t={g:0,o:0,r:0,x:0,none:0};
  const prods=TABS[tab];
  for(const i of idxs){
    const s=statusOf(tab,prods[i]);
    if(s&&t[s]!==undefined) t[s]++; else t.none++;
  }
  return t;
}
function tallyHTML(t,total){
  if(!total) return '';
  const seg=(k,c)=> t[k] ? `<i style="width:${(t[k]/total*100).toFixed(2)}%;background:${c}"></i>` : '';
  return `<span class="tally">${seg('g','var(--g)')}${seg('o','var(--o)')}${seg('r','var(--r)')}${seg('x','var(--x)')}</span>`;
}

/* ============ render ============ */
function renderTabs(){
  const el=document.getElementById('tabs');
  el.innerHTML = TABNAMES.map(t=>{
    const prods=TABS[t];
    let done=0;
    for(const p of prods) if(statusOf(t,p)) done++;
    return `<button class="tab ${t===curTab?'on':''}" data-tab="${esc(t)}">${esc(t)}<span class="n">${done}/${prods.length}</span></button>`;
  }).join('');
}

function renderRail(){
  const prods=TABS[curTab];
  const t={g:0,o:0,r:0,x:0};
  let done=0;
  for(const p of prods){ const s=statusOf(curTab,p); if(s){done++; if(t[s]!==undefined)t[s]++;} }
  const n=prods.length||1;
  document.getElementById('rail').innerHTML =
    `<i style="width:${t.g/n*100}%;background:var(--g)"></i>`+
    `<i style="width:${t.o/n*100}%;background:var(--o)"></i>`+
    `<i style="width:${t.r/n*100}%;background:var(--r)"></i>`+
    `<i style="width:${t.x/n*100}%;background:var(--x)"></i>`;
  document.getElementById('stat').innerHTML =
    `<b>${curTab}</b> · ${done}/${prods.length} ingedeeld<br>`+
    `<span style="color:var(--g)">■</span> ${t.g}  <span style="color:var(--o)">■</span> ${t.o}  `+
    `<span style="color:var(--r)">■</span> ${t.r}  <span style="color:var(--x)">■</span> ${t.x}`;
}

function renderFilters(){
  const prods=TABS[curTab];
  let todo=0; for(const p of prods) if(!statusOf(curTab,p)) todo++;
  const opts=[['todo','Te doen ('+todo+')'],['all','Alles'],['g','Belangrijk'],['o','Medium'],['r','Zelden'],['x','Weg']];
  document.getElementById('filters').innerHTML = opts.map(([k,l])=>
    `<button class="chip ${filter===k?'on':''}" data-f="${k}">${esc(l)}</button>`).join('');
}

const famItems = new Map();   // fkey -> [idx,...] zodat we later kunnen bijrenderen

function rowsHTML(items){
  const prods = TABS[curTab];
  let h='';
  for(const i of items){
    const p = prods[i];
    const st = statusOf(curTab,p);
    const afd = afdOf(curTab,p);
    h += `<div class="p" data-s="${st||''}" data-i="${i}">
      <span class="stripe"></span>
      <div class="pbody">
        <div class="pname">${esc(p[F.NAAM])}${dood(p)?'<span class="dead">geen voorraad</span>':''}</div>
        <div class="pmeta mono">${esc(p[F.CODE])} · vrij ${p[F.VR]}${p[F.ABC]?' · <span class="abc">'+esc(p[F.ABC])+'</span>':''}${p[F.LOC]?' · '+esc(p[F.LOC]):''}</div>
        <div class="prow2">
          <button class="afdbtn ${afd?'':'empty'}" data-afd="${i}">${afd?esc(afd):'Kies afdeling'}</button>
          <span class="sbtns">
            <button class="sb g ${st==='g'?'on':''}" data-set="g" data-i="${i}">●</button>
            <button class="sb o ${st==='o'?'on':''}" data-set="o" data-i="${i}">●</button>
            <button class="sb r ${st==='r'?'on':''}" data-set="r" data-i="${i}">●</button>
            <button class="sb x ${st==='x'?'on':''}" data-set="x" data-i="${i}">✕</button>
          </span>
        </div>
      </div>
    </div>`;
  }
  return h;
}

function renderMain(){
  famItems.clear();
  const levs = groupsFor(curTab);
  const main = document.getElementById('main');
  if(!levs.length){
    main.innerHTML = `<div class="empty">Niets te tonen met dit filter.<br>Zet het filter op “Alles”.</div>`;
    return;
  }
  const prods = TABS[curTab];
  let html='';
  for(const L of levs){
    const key = curTab+'|'+L.lev;
    const isOpen = openLevs.has(key);
    const allIdx = L.fams.flatMap(f=>f.items);
    const t = tallyOf(curTab, allIdx);
    const done = L.total - t.none;
    html += `<section class="lev ${isOpen?'open':''}">
      <div class="levhead" data-lev="${esc(key)}">
        <span class="caret"></span>
        <span class="levname">${esc(L.lev)}</span>
        ${tallyHTML(t,L.total)}
        <span class="levmeta">${done}/${L.total}</span>
      </div>
      <div class="levbody">`;
    if(isOpen){
      const autoOpen = L.total <= 150;
      for(const Fm of L.fams){
        const ft = tallyOf(curTab, Fm.items);
        const fkey = key+'|'+Fm.fam;
        const fOpen = closedFams.has(fkey) ? false : (autoOpen || openFams.has(fkey));
        famItems.set(fkey, Fm.items);
        html += `<div class="fam ${fOpen?'open':''}" data-fkey="${esc(fkey)}">
          <div class="famhead" data-ftoggle="${esc(fkey)}">
            <span class="fcaret"></span>
            <span class="famname">${esc(Fm.fam)}</span>
            ${tallyHTML(ft,Fm.items.length)}
            <span class="famcnt">${Fm.items.length}</span>
          </div>
          <div class="bulk" data-fam="${esc(Fm.fam)}" data-lev="${esc(L.lev)}">
            <b>Alles</b>
            <button class="bb g" data-bulk="g">● Belangrijk</button>
            <button class="bb o" data-bulk="o">● Medium</button>
            <button class="bb r" data-bulk="r">● Zelden</button>
            <button class="bb x" data-bulk="x">✕ Weg</button>
            <button class="bb afd" data-bulk="afd">Afdeling…</button>
          </div>`;
        html += `<div class="pwrap">`;
        if(fOpen) html += rowsHTML(Fm.items);
        html += `</div></div>`;
      }
    }
    html += `</div></section>`;
  }
  main.innerHTML = html;
}

function renderAll(){ renderTabs(); renderRail(); renderFilters(); renderMain(); }

/* ============ interactions ============ */
document.getElementById('tabs').addEventListener('click', e=>{
  const b=e.target.closest('[data-tab]'); if(!b) return;
  curTab=b.dataset.tab; window.scrollTo(0,0); renderAll();
});
document.getElementById('filters').addEventListener('click', e=>{
  const b=e.target.closest('[data-f]'); if(!b) return;
  filter=b.dataset.f; renderFilters(); renderMain();
});
let qTimer=null;
document.getElementById('q').addEventListener('input', e=>{
  clearTimeout(qTimer);
  qTimer=setTimeout(()=>{ query=e.target.value; renderMain(); },220);
});

document.getElementById('main').addEventListener('click', e=>{
  // leverancier open/dicht
  const lh=e.target.closest('[data-lev]');
  if(lh && lh.classList.contains('levhead')){
    const k=lh.dataset.lev;
    if(openLevs.has(k)) openLevs.delete(k); else openLevs.add(k);
    renderMain();
    return;
  }
  // familie open/dicht
  const fh=e.target.closest('[data-ftoggle]');
  if(fh){
    const k=fh.dataset.ftoggle;
    const el=fh.closest('.fam');
    const nowOpen=!el.classList.contains('open');
    if(nowOpen){
      const wrap=el.querySelector('.pwrap');
      if(wrap && !wrap.firstChild){
        const items=famItems.get(k);
        if(items) wrap.innerHTML = rowsHTML(items);
      }
    }
    el.classList.toggle('open', nowOpen);
    if(nowOpen){ openFams.add(k); closedFams.delete(k); }
    else{ closedFams.add(k); openFams.delete(k); }
    return;
  }
  // status zetten
  const sb=e.target.closest('[data-set]');
  if(sb){
    const i=+sb.dataset.i, val=sb.dataset.set;
    const p=TABS[curTab][i];
    const cur=statusOf(curTab,p);
    setRec(curTab,p[F.CODE],{s: cur===val ? '' : val});
    updateRow(i);
    renderTabs(); renderRail(); renderFilters();
    return;
  }
  // afdeling kiezen
  const ab=e.target.closest('[data-afd]');
  if(ab){ openAfdSheet(+ab.dataset.afd); return; }
  // bulk
  const bb=e.target.closest('[data-bulk]');
  if(bb){
    const wrap=bb.closest('.bulk');
    const fam=wrap.dataset.fam, lev=wrap.dataset.lev;
    const idxs=indicesFor(fam,lev);
    if(bb.dataset.bulk==='afd'){ openAfdSheet(idxs, fam); return; }
    const val=bb.dataset.bulk;
    for(const i of idxs) setRec(curTab, TABS[curTab][i][F.CODE], {s:val});
    toast(idxs.length+' op '+SLABEL[val].split(' —')[0].toLowerCase());
    renderAll();
    return;
  }
});

function indicesFor(fam,lev){
  const prods=TABS[curTab], out=[];
  const q=query.trim().toLowerCase();
  for(let i=0;i<prods.length;i++){
    const p=prods[i];
    if(famOf(p)!==fam || LEVS[p[F.LEV]]!==lev) continue;
    const st=statusOf(curTab,p);
    if(filter==='todo' && st) continue;
    if(filter!=='all' && filter!=='todo' && st!==filter) continue;
    if(q){ const hay=(p[F.NAAM]+' '+p[F.CODE]+' '+p[F.LOC]).toLowerCase(); if(hay.indexOf(q)<0) continue; }
    out.push(i);
  }
  return out;
}

function updateRow(i){
  const row=document.querySelector('.p[data-i="'+i+'"]');
  if(!row) return;
  const p=TABS[curTab][i];
  const st=statusOf(curTab,p), afd=afdOf(curTab,p);
  row.dataset.s = st||'';
  row.querySelectorAll('.sb').forEach(b=> b.classList.toggle('on', b.dataset.set===st));
  const ab=row.querySelector('.afdbtn');
  ab.textContent = afd || 'Kies afdeling';
  ab.classList.toggle('empty', !afd);
}

/* ---- afdeling sheet ---- */
let sheetTarget=null;
function openAfdSheet(target, famName){
  sheetTarget = target;
  const many = Array.isArray(target);
  document.getElementById('sheetTitle').textContent =
    many ? 'Afdeling voor '+target.length+' producten' : 'Afdeling';
  const cur = many ? null : afdOf(curTab, TABS[curTab][target]);
  document.getElementById('sheetList').innerHTML =
    AFDELINGEN.map(a=>`<button class="opt ${a===cur?'on':''}" data-a="${esc(a)}">${esc(a)}</button>`).join('')
    + `<button class="opt clear" data-a="">Geen afdeling</button>`;
  document.getElementById('veil').classList.add('on');
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){
  document.getElementById('veil').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
  sheetTarget=null;
}
document.getElementById('veil').addEventListener('click', closeSheet);
document.getElementById('sheetClose').addEventListener('click', closeSheet);
document.getElementById('sheetList').addEventListener('click', e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const val=b.dataset.a;
  if(Array.isArray(sheetTarget)){
    for(const i of sheetTarget) setRec(curTab, TABS[curTab][i][F.CODE], {a:val});
    toast(sheetTarget.length+' → '+(val||'geen afdeling'));
    closeSheet(); renderMain();
  }else{
    const i=sheetTarget;
    setRec(curTab, TABS[curTab][i][F.CODE], {a:val});
    closeSheet(); updateRow(i);
  }
});

/* ---- export / import ---- */
document.getElementById('btnExport').addEventListener('click', async ()=>{
  await persist();
  const rows=[['Tab','Productcode','Naam','Leverancier','Voorraad','ABC','Locatie','Familie','Status','Statuslabel','Afdeling']];
  for(const tab of TABNAMES){
    for(const p of TABS[tab]){
      const st=statusOf(tab,p), afd=afdOf(tab,p);
      rows.push([tab,p[F.CODE],p[F.NAAM],LEVS[p[F.LEV]],p[F.VR],p[F.ABC],p[F.LOC],famOf(p),st,st?SLABEL[st]:'',afd]);
    }
  }
  const payload={_format:'triage_v1', savedAt:new Date().toISOString(), state, rows};
  dl(JSON.stringify(payload), 'triage-export-'+new Date().toISOString().slice(0,10)+'.json');
  resetChanges();
  toast('Export gemaakt — bewaar het bestand');
});
function dl(text,name){
  const b=new Blob([text],{type:'application/json'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
}
document.getElementById('nudgeExport').addEventListener('click', ()=> document.getElementById('btnExport').click());
document.getElementById('btnImport').addEventListener('click', ()=> document.getElementById('fileIn').click());
document.getElementById('fileIn').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const txt=await f.text();
    const obj=JSON.parse(txt);
    const incoming = obj.state || obj;
    state = merge(state, incoming);
    await persist();
    renderAll();
    toast('Import samengevoegd');
  }catch(err){ toast('Kon dit bestand niet lezen'); }
  e.target.value='';
});

/* ---- uitleg ---- */
document.getElementById('btnHelp').addEventListener('click', ()=>{
  sheetTarget=null;
  document.getElementById('sheetTitle').textContent='Zo werkt het';
  document.getElementById('sheetList').innerHTML=`
    <div style="padding:6px 8px 4px;font-size:14px;line-height:1.5">
      <p style="margin:0 0 12px"><b style="color:var(--g)">● Belangrijk</b><br>Dagelijks nodig, krijgt een vaste picklocatie.</p>
      <p style="margin:0 0 12px"><b style="color:var(--o)">● Medium</b><br>Minder vaak, maar hoort bij de groep en gaat ook naar de picklocatie.</p>
      <p style="margin:0 0 12px"><b style="color:var(--r)">● Zelden</b><br>Alleen een bulklocatie, geen vaste pickplek.</p>
      <p style="margin:0 0 12px"><b style="color:var(--x)">✕ Weg</b><br>Hoeft niet in deze administratie.</p>
      <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
      <p style="margin:0 0 12px">Tik een leverancier open om de families te zien. De knoppen onder een familienaam zetten alles in die familie in één keer — daarna corrigeer je losse producten.</p>
      <p style="margin:0 0 12px">Het balkje bij elke familie laat de verdeling zien terwijl je werkt.</p>
      <p style="margin:0 0 4px"><b>Export</b> geeft een JSON met alle keuzes. Bewaar die en stuur hem naar jezelf; met <b>Import</b> voeg je hem samen op een ander apparaat.</p>
    </div>`;
  document.getElementById('veil').classList.add('on');
  document.getElementById('sheet').classList.add('on');
});

/* ---- toast ---- */
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),1500);
}

/* ---- offline maken ---- */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('./sw.js').catch(function(){});
}

/* ---- opslag-zelftest + permanente opslag aanvragen ---- */
let storageOK = false;
async function checkStorage(){
  try{
    localStorage.setItem('__probe','1');
    const v = localStorage.getItem('__probe');
    localStorage.removeItem('__probe');
    storageOK = (v === '1');
  }catch(e){ storageOK = false; }
  // vraag iOS/Safari om de opslag niet op te ruimen
  try{
    if(navigator.storage && navigator.storage.persist){
      const already = navigator.storage.persisted ? await navigator.storage.persisted() : false;
      if(!already) await navigator.storage.persist();
    }
  }catch(e){}
  return storageOK;
}

/* ---- teller: wijzigingen sinds laatste export ---- */
function bumpChanges(n){
  try{
    const c = (+localStorage.getItem('changes_since_export')||0) + (n||1);
    localStorage.setItem('changes_since_export', String(c));
    paintNudge(c);
  }catch(e){}
}
function resetChanges(){
  try{ localStorage.setItem('changes_since_export','0'); }catch(e){}
  paintNudge(0);
}
function paintNudge(c){
  const el = document.getElementById('nudge');
  if(!el) return;
  if(c >= 40){
    el.style.display='flex';
    el.querySelector('span').textContent = c+' wijzigingen sinds je laatste export';
  }else{
    el.style.display='none';
  }
}

/* ---- boot ---- */
(function(){
  try{
    renderAll();
  }catch(err){ showErr('render: '+(err&&err.message||err)); return; }

  checkStorage().then(function(ok){
    if(!ok){
      showErr('Let op: deze weergave kan niets bewaren. Zet de app op je beginscherm en werk daarvandaan, anders ben je je keuzes kwijt zodra je afsluit.');
    }
    try{ paintNudge(+localStorage.getItem('changes_since_export')||0); }catch(e){}
    return Store.readAll();
  }).then(function(s){
    if(s && Object.keys(s).length){
      state = s;
      try{ renderAll(); }catch(err){ showErr('render2: '+(err&&err.message||err)); }
    }
    return persist();
  }).catch(function(err){
    showErr('opslag niet beschikbaar — gebruik Export om je werk veilig te stellen. ('+(err&&err.message||err)+')');
  });
})();
