const $ = id => document.getElementById(id);

const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
const leeg = v => v === null || v === undefined || v === '';
function num(v){
  if(leeg(v)) return null;
  if(typeof v === 'number') return isNaN(v) ? null : v;
  let s = String(v).trim().replace(/\s/g, '').replace(/[,.;:]+$/, '');
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if(lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if(lc > -1) s = s.replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
const nf = (n, d = 0) => (n === null || n === undefined || isNaN(n)) ? '–' : Number(n).toLocaleString('nl-NL', { maximumFractionDigits:d });
const plural = (n, een, meer) => n + ' ' + (n === 1 ? een : meer);

  if(!d) return '';

  });
}
function lev1(a, b){ // Levenshtein
  if(a === b) return 0;
  if(!a.length) return b.length; if(!b.length) return a.length;
  let prev = Array.from({ length:b.length + 1 }, (_, i) => i);
  for(let i = 1; i <= a.length; i++){
    const cur = [i];
    for(let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}

async function api(method, path, body, extra){
  const headers = Object.assign({}, H, extra || {});
  if(body !== undefined) headers['Content-Type'] = 'application/json';
  const res = await fetch(URL_ + '/rest/v1/' + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });

  if(!res.ok){ const e = new Error(res.status + ' ' + txt.slice(0, 240)); e.status = res.status; e.body = txt; throw e; }
  return txt ? JSON.parse(txt) : null;
}
async function getAll(table, qs){
  const out = [];
  for(let from = 0; ; from += 1000){
    const rows = await api('GET', table + '?' + qs, undefined, { Range:from + '-' + (from + 999), 'Range-Unit':'items' });
    out.push(...rows);
    if(rows.length < 1000) break;
  }
  return out;
}

async function upsert(table, rows, onConflict){
  const out = [];
  for(let i = 0; i < rows.length; i += 500){

}

function indexProducten(rows){
  P = {}; PLOW = {}; BYLEV = {};
  rows.forEach(r => {
    P[r.productcode] = r; PLOW[r.productcode.toLowerCase()] = r.productcode;
    if(r.leverancier) (BYLEV[r.leverancier] = BYLEV[r.leverancier] || []).push(r.productcode);
  });
}
function indexCatalog(cat){
  CAT = cat || {}; GEH = {};
  Object.values(CAT).forEach(x => {
    if(!x || !x.sub) return;
    const k = String(x.sub).trim().toLowerCase();
    (GEH[k] = GEH[k] || []).push(x);
  });
}
function indexVerkoop(rows){ VK = {}; rows.forEach(r => VK[r.productcode] = r); }
function indexBackorders(rows){
  BO = rows; BOBY = {};
  rows.forEach(r => {
    const code = PLOW[String(r.productcode || '').toLowerCase()] || r.productcode;
    if(!code) return;
    const b = BOBY[code] = BOBY[code] || { open:0, totaal:0, regels:[] };
    const a = num(r.aantal) || 0, bs = num(r.beschikbaar) || 0;
    b.totaal += a; b.open += Math.max(0, a - bs); b.regels.push(r);
  });
  Object.values(BOBY).forEach(b => b.regels.sort((x, y) => (num(y.aantal) || 0) - (num(x.aantal) || 0)));
}

const vnKey = s => String(s == null ? '' : s).trim().toUpperCase();
function vnZetRegel(cat, code, naam, qty){
  naam = String(naam || '').trim();
  if(!naam) throw new Error('vloernaam mag niet leeg zijn');
  const key = vnKey(naam), bezet = cat[key];
  if(bezet && String(bezet.sub == null ? '' : bezet.sub).trim().toLowerCase() !== code.toLowerCase())
    throw new Error('"' + naam + '" is al in gebruik voor ' + bezet.sub);
  const oud = Object.keys(cat).filter(k => cat[k] && String(cat[k].sub == null ? '' : cat[k].sub).trim().toLowerCase() === code.toLowerCase());
  const basis = oud.length ? cat[oud[0]] : {};
  const ean = (P[code] && String(P[code].ean || '').trim()) || basis.ean || '';
  const rec = { name:naam, ean:String(ean || ''), qty:String(qty === undefined || qty === null || qty === '' ? (basis.qty || '') : qty).trim(), sub:code, used:Date.now() };
  if(oud[0] && oud[0] !== key) delete cat[oud[0]];
  cat[key] = rec;
  return rec;
}
const geh1 = code => (GEH[String(code || '').toLowerCase()] || [])[0];
function sppVan(code){ const g = geh1(code); const n = g ? num(g.qty) : null; return n && n > 0 ? n : null; }
const naamVan = code => (P[code] && P[code].naam) || (geh1(code) || {}).name || '';
const labelNaam = code => { const g = geh1(code); return (g && g.name) || naamVan(code) || code; };
// EAN is van de Picqer-export (die is de eigenaar); alleen als Picqer er geen heeft valt hij terug op het productgeheugen
const eanVan = code => { const g = geh1(code); return String((P[code] && P[code].ean) || (g && g.ean) || '').trim(); };
function tagsVan(code){ return String((P[code] && P[code].tags) || '').toLowerCase(); }
function eenheidVan(code){
  const t = tagsVan(code), n = naamVan(code).toLowerCase();
  if(t.includes('meterroll') || /per meter/.test(n)) return 'm';
  if(t.includes('cmroll') || /per cm/.test(n)) return 'cm';
  if(t.includes('fullroll')) return 'rol';
  return 'st.';
}
const perRol = e => e === 'm' || e === 'cm';
function eenhWoord(n, e, taal){
  if(e === 'rol') return taal === 'en' ? (n === 1 ? 'roll' : 'rolls') : (n === 1 ? 'rol' : 'rollen');
  if(e === 'st.') return taal === 'en' ? 'pcs' : 'st.';
  return e;
}
function feiten(code){
  const p = P[code] || {};
  const v = VK[code];
  const b = BOBY[code] || { open:0, totaal:0, regels:[] };
  const hm = num(p.voorraad_hm) || 0;
  return {
    hm, vst:num(p.voorraad_vst) || 0,
    vrij: leeg(p.vrij_hm) ? hm - b.open : num(p.vrij_hm),
    rate: v ? num(v.per_maand) : null, verkoop:v,
    bo:b.open, boRegels:b.regels, abc:p.abc || ''
  };
}

  const d = c.data;
  d.regels = d.regels || [];
  d.verdeling = d.verdeling || {};

  d.werkbon = Object.assign({ taal:'en', extra:'' }, d.werkbon || {});

}

/* =====================================================================
   Pakbon lezen
   ===================================================================== */
function cleanLine(l){
  return l.replace(/[|\[\]{}]/g, ' ')
          .replace(/(\d)\)/g, '$1 ')
          .replace(/(\d)\/(?=\s|$)/g, '$1 ')
          .replace(/\s+/g, ' ').trim();
}
// pakboncode uit de omschrijving halen ("ISM80X120-RUBBER STABLE MAT" -> "ISM80X120")
function eersteCode(s){
  const w = String(s || '').trim().split(/\s+/)[0] || '';
  const m = w.match(/^(.*?\d.*?)-(?=[A-Za-z]{4,})/);
  return m ? m[1] : w;
}
function codeFrase(desc){
  const words = String(desc || '').trim().split(/\s+/), out = [];
  for(const w of words){
    const m = w.match(/^(.*?\d.*?)-(?=[A-Za-z]{4,})/);
    if(m){ out.push(m[1]); break; }
    if(out.length && /^[A-Za-z]{4,}$/.test(w) && out.some(x => /\d/.test(x))) break;
    out.push(w);
    if(out.length >= 6) break;
  }
  return out.join(' ');
}
function pakbonCode(desc, ctx){
  const f = eersteCode(desc);
  if(/\d/.test(f) && norm(f).length >= 4) return f;
  const fr = codeFrase(desc);
  if(/\d/.test(fr)) return fr;
  const c = eersteCode(ctx);
  if(/\d/.test(c) && norm(c).length >= 4) return c;
  return f || fr;
}
const RX_REGEL = /^(?:(\d{1,2})[\s.:]+)?(\S.*?)\s+(\d{1,6})\s+(\d{1,5})\s+(?:(\d{1,5})\s+)?(?:(\d{1,5}\s*-\s*\d{1,5})\s+)?(\d[\d.,]*)\s+(\d[\d.,]*)\s+(\d[\d.,]*)\s+(\d[\d.,]*)$/;

function parsePakbon(text){
  const raw = String(text || '');
  const lines = raw.split(/\r?\n/).map(cleanLine);
  const res = { regels:[], ref:null, container:null, bl:null, perPallet:false, totaal_stuks:null, totaal_eenheden:null };
  let m;
  if((m = raw.match(/\bNL-\d{3,4}\b/))) res.ref = m[0];
  if((m = raw.match(/CONTAINER\s*#?\s*:?\s*([A-Z]{4})\s?(\d{6,7})/i))) res.container = (m[1] + m[2]).toUpperCase();
  if((m = raw.match(/B\s*\/\s*L\s*#?\s*:?\s*([A-Z0-9][A-Z0-9\/\-]{5,})/i))) res.bl = m[1];
  res.perPallet = /Qty\s*\/\s*Pallet/i.test(raw) && !/Qty\s*\/\s*Package/i.test(raw);
  const isRow = [], rowOf = [];
  const probeer = l => {
    let mm = l.match(RX_REGEL);
    if(!mm){ // scanruis: haakjes en losse komma's rond getallen
      const l2 = l.replace(/[();]/g, ' ').replace(/(\d)[,.](?=\s|$)/g, '$1').replace(/\s+/g, ' ').trim();
      mm = l2.match(RX_REGEL);
    }
    if(mm && !mm[1] && !/[A-Za-z]/.test(mm[2])) mm = null; // zonder volgnummer moet er tekst in staan
    return mm;
  };
  lines.forEach((l, i) => { const mm = probeer(l); isRow[i] = !!mm; rowOf[i] = mm; });
  const skip = l => !l || /^(total|b\s*\/\s*l|container|shipped|declaration|we declare|sl\b|no\b|item code|rubber products|coir|pvc)/i.test(l) || /^[A-Z ]{6,}PRODUCTS?$/i.test(l);
  let ctx = [];
  lines.forEach((l, i) => {
    const mm = rowOf[i];
    if(!mm){
      if(/^total\b/i.test(l)){
        const t = l.match(/total\D*(\d{1,6})\s+(\d{1,5})\b/i);
        if(t){ res.totaal_stuks = +t[1]; res.totaal_eenheden = +t[2]; }
      }
      if(!skip(l)) ctx.push(l); else ctx = [];
      if(ctx.length > 2) ctx.shift();
      return;
    }
    const next = (i + 1 < lines.length && !isRow[i+1] && !skip(lines[i+1]) && !/^total/i.test(lines[i+1])) ? lines[i+1] : '';
    const desc = mm[2].trim();
    const context = ctx.join(' ');
    const serie = (mm[6] || '').replace(/\s+/g, ' ');
    let aantal = mm[5] ? +mm[5] : null;
    if(aantal === null && serie){ const sr = serie.split('-').map(x => +x.trim()); if(sr[1] >= sr[0]) aantal = sr[1] - sr[0] + 1; }
    if(aantal === null && +mm[4]) aantal = Math.round(+mm[3] / +mm[4]);
    const r = {
      sl:mm[1] ? +mm[1] : res.regels.length + 1, pakbon_code:pakbonCode(desc, context), omschrijving:desc, context:(context + ' ' + next).trim(),
      totaal:+mm[3], per:+mm[4], aantal, serie,
      netto:num(mm[7]), bruto_per:num(mm[8]), bruto:num(mm[9]), cbm:num(mm[10])
    };
    r.soort = r.bruto_per ? (r.per >= 2 && r.bruto_per >= 100 ? 'pallet' : 'los') : (res.perPallet ? 'pallet' : 'los');
    res.regels.push(r);
    ctx = [];
  });
  return res;
}
// eenvoudige vorm: code <tab> pallets <tab> stuks per pallet   of   code <tab> aantal
function parseSimpel(text){
  const regels = [];
  String(text || '').split(/\r?\n/).forEach(l => {
    if(!l.trim()) return;
    const p = (l.includes('\t') ? l.split('\t') : l.includes(';') ? l.split(';') : l.trim().split(/\s{2,}|,/)).map(s => s.trim()).filter(Boolean);
    if(p.length < 2) return;
    const code = p[0], a = num(p[1]), b = num(p[2]);
    if(!code || a === null || /^(code|product|artikel)/i.test(code)) return;
    if(b !== null) regels.push({ pakbon_code:code, omschrijving:'', totaal:a * b, per:b, aantal:a, soort:'pallet' });
    else regels.push({ pakbon_code:code, omschrijving:'', totaal:a, per:1, aantal:a, soort:'los' });
  });
  return regels;
}
async function pdfTekst(pdf){
  const out = [];
  for(let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const items = tc.items.filter(i => i.str && i.str.trim()).map(i => ({ s:i.str.trim(), x:i.transform[4], y:i.transform[5] }));
    const lines = [];
    items.forEach(it => {
      let L = lines.find(l => Math.abs(l.y - it.y) <= 3);
      if(!L){ L = { y:it.y, items:[] }; lines.push(L); }
      L.items.push(it);
    });
    lines.sort((a, b) => b.y - a.y);
    lines.forEach(L => { L.items.sort((a, b) => a.x - b.x); out.push(L.items.map(i => i.s).join('  ')); });
  }
  return out.join('\n');
}
async function ocrCanvasList(canvases, prog){
  if(!window.Tesseract) await loadScript(TESS.js);
  let pagina = 0;
  const worker = await Tesseract.createWorker('eng', 1, {
    workerPath:TESS.worker, corePath:TESS.core, langPath:TESS.lang,
    logger:m => { if(m.status === 'recognizing text') prog((pagina + m.progress) / canvases.length); else if(m.status) prog(-1, m.status); }
  });
  await worker.setParameters({ tessedit_pageseg_mode:'6', preserve_interword_spaces:'1' });
  let text = '';
  for(pagina = 0; pagina < canvases.length; pagina++){
    const { data } = await worker.recognize(canvases[pagina]);
    text += data.text + '\n';
  }
  await worker.terminate();
  return text;
}
async function pdfNaarCanvas(pdf){
  const out = [];
  for(let p = 1; p <= Math.min(pdf.numPages, 4); p++){
    const page = await pdf.getPage(p);
    const base = page.getViewport({ scale:1 });
    const scale = Math.min(3.5, 2600 / Math.max(base.width, base.height));
    const vp = page.getViewport({ scale });
    const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext:ctx, viewport:vp }).promise;
    out.push(cv);
  }
  return out;
}
async function afbeeldingNaarCanvas(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const scale = Math.min(1, 3000 / Math.max(img.width, img.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return [cv];
  }finally{ URL.revokeObjectURL(url); }
}

/* =====================================================================
   Koppelen aan Picqer-productcodes (en leren)
   ===================================================================== */
function lengteUit(s){
  const m = String(s || '').match(/(\d+(?:[.,]\d+)?)\s*[x×]\s*(\d+(?:[.,]\d+)?)\s*(?:mtr|meter|m)\b/i);
  return m ? num(m[2]) : null;
}
function factorVoorstel(code, r){
  const e = eenheidVan(code);
  const len = lengteUit((r.omschrijving || '') + ' ' + (r.context || ''));
  const spp = sppVan(code), per = num(r.per);
  const uitGeheugen = (r.soort === 'pallet' && spp && per && Number.isInteger(spp / per) && spp / per >= 10) ? spp / per : null;
  if(e === 'm') return { factor:Math.floor(len || 10), bron:'voorstel' };
  if(e === 'cm') return len ? { factor:Math.floor(len) * 100, bron:'voorstel' } : uitGeheugen ? { factor:uitGeheugen, bron:'voorstel' } : { factor:1, bron:'onbekend' };
  if(uitGeheugen) return { factor:uitGeheugen, bron:'voorstel' };
  return { factor:1, bron:'vast' };
}
function koppel(r, lev){
  const tok = norm(eersteCode(r.pakbon_code || r.omschrijving));
  const key = norm(r.pakbon_code);
  const txt = norm((r.pakbon_code || '') + ' ' + (r.omschrijving || '') + ' ' + (r.context || ''));
  const pool = (lev && BYLEV[lev] && BYLEV[lev].length) ? BYLEV[lev] : Object.keys(P);
  const als = ALIAS.filter(a => !lev || a.leverancier === lev);
  const uit = (code, match, factor, fbron) => {
    const fv = factor !== undefined ? { factor:factor, bron:fbron || 'geleerd' } : factorVoorstel(code, r);
    return { productcode:code, match, factor:fv.factor, factor_bron:fv.bron, bevestigd:match === 'alias' || match === 'exact' };
  };
  // 1. eerder bevestigd (geleerd)
  let a = als.find(x => x.pakbon_code === key) || als.find(x => x.pakbon_code === tok);
  if(a && P[a.productcode]) return uit(a.productcode, 'alias', num(a.factor) || 1, 'geleerd');
  // 2. exact gelijk aan een Picqer-productcode of leverancierscode
  let ex = pool.find(c => norm(c) === tok) || pool.find(c => P[c] && P[c].leverancier_code && norm(P[c].leverancier_code) === tok);
  if(!ex && tok.length >= 4) ex = Object.keys(P).find(c => norm(c) === tok);
  if(ex) return uit(ex, 'exact');
  // 3. code komt voor in de pakbontekst (langste wint)
  let best = null;
  als.forEach(x => { if(x.pakbon_code.length >= 4 && txt.includes(x.pakbon_code) && P[x.productcode] && (!best || x.pakbon_code.length > best.len)) best = { len:x.pakbon_code.length, code:x.productcode, alias:x }; });
  pool.forEach(c => { const n = norm(c); if(n.length >= 4 && txt.includes(n) && (!best || n.length > best.len)) best = { len:n.length, code:c }; });
  if(best) return best.alias ? uit(best.code, 'alias', num(best.alias.factor) || 1, 'geleerd') : uit(best.code, 'voorstel');
  // 4. bijna gelijk (typefout / OCR)
  let fz = null;
  if(tok.length >= 4) pool.forEach(c => {
    const d = lev1(norm(c), tok), lim = tok.length >= 8 ? 2 : 1;
    if(d <= lim && (!fz || d < fz.d)) fz = { d, code:c };
  });
  if(fz) return uit(fz.code, 'voorstel');
  return { productcode:'', match:'onbekend', factor:1, factor_bron:'vast', bevestigd:false };
}
function koppelAlles(c){
  c.data.regels.forEach(r => { if(r.match === 'handmatig' && r.productcode) return; Object.assign(r, koppel(r, c.leverancier)); });
}
async function leer(r){
  const key = norm(r.pakbon_code);
  if(!cur || !r.productcode || key.length < 3) return;
  if(r.match === 'exact' && (num(r.factor) || 1) === 1) return;
  const row = { leverancier:cur.leverancier, pakbon_code:key, pakbon_tekst:(r.pakbon_code + ' ' + (r.omschrijving || '')).slice(0, 200),
                productcode:r.productcode, factor:num(r.factor) || 1, bevestigd_op:new Date().toISOString() };
  try{
    const saved = await upsert('pakbon_alias', [row], 'leverancier,pakbon_code');
    ALIAS = ALIAS.filter(a => !(a.leverancier === row.leverancier && a.pakbon_code === key)).concat(saved.length ? saved : [row]);
  }catch(e){ toast('Onthouden mislukt: ' + e.message); }
}

/* =====================================================================
   Voorraad per product in deze container (pallets en los)
   ===================================================================== */
function factorVan(c, code){ const r = c.data.regels.find(x => x.productcode === code); return r ? (num(r.factor) || 1) : 1; }
function pools(c){
  const map = {}, order = [];
  c.data.regels.forEach(r => {
    if(!r.productcode) return;
    const f = num(r.factor) || 1;
    let p = map[r.productcode];
    if(!p){ p = map[r.productcode] = { code:r.productcode, regels:[], pallets:[], losU:0, totaalU:0, gebouwd:0, factor:f }; order.push(r.productcode); }
    p.regels.push(r);
    const tot = num(r.totaal) || 0, per = num(r.per) || 0, n = num(r.aantal) || 0;
    p.totaalU += tot * f;
    if(r.soort === 'pallet' && per > 0){
      const vol = Math.min(n, Math.floor(tot / per));
      for(let i = 0; i < vol; i++) p.pallets.push(per * f);
      const rest = tot - vol * per;
      if(rest > 0){ if(n > vol) p.pallets.push(rest * f); else p.losU += rest * f; }
    } else p.losU += tot * f;
  });
  order.forEach(code => {
    const p = map[code];
    const spp = sppVan(code);
    p.spp = spp;
    const losRegels = p.regels.filter(r => r.soort !== 'pallet');
    if(spp && losRegels.length && p.losU >= spp){
      const n = Math.floor(p.losU / spp);
      for(let i = 0; i < n; i++) p.pallets.push(spp);
      p.losU -= n * spp; p.gebouwd = n;
    }
    p.pallets.sort((a, b) => b - a);
    p.maten = {};
    p.pallets.forEach(s => p.maten[s] = (p.maten[s] || 0) + 1);
  });
  return { map, order };
}
function portieU(x){ return x.soort === 'pallet' ? (num(x.n) || 0) * (num(x.per) || 0) : (num(x.n) || 0); }
function restVan(pool, porties){
  const r = { maten:Object.assign({}, pool.maten), los:pool.losU, U:pool.totaalU };
  (porties || []).forEach(x => {
    r.U -= portieU(x);
    if(x.soort === 'pallet') r.maten[x.per] = (r.maten[x.per] || 0) - (num(x.n) || 0);
    else r.los -= num(x.n) || 0;
  });
  r.ok = Math.abs(r.U) < 0.001 && Object.values(r.maten).every(v => v === 0) && Math.abs(r.los) < 0.001;
  return r;
}
function eerderGepland(c, code){
  const out = { hier:0, bo:0, refs:[] };
  CONT.forEach(o => {
    if(o === c || o.status === 'afgerond') return;
    const eerder = (o.losdatum || '9999') < (c.losdatum || '9999') || ((o.losdatum || '9999') === (c.losdatum || '9999') && o.id < c.id);
    if(!eerder) return;
    const v = o.data && o.data.verdeling && o.data.verdeling[code];
    if(!v || !v.porties) return;
    let h = 0, b = 0;
    v.porties.forEach(x => { if(DEST[x.dest] && DEST[x.dest].hier) h += portieU(x); if(x.dest === 'BO') b += portieU(x); });
    if(h || b){ out.hier += h; out.bo += b; out.refs.push(o.pakbon_ref || o.containernummer || ('#' + o.id)); }
  });
  return out;
}

/* =====================================================================
   Verdelingsadvies
   Regel: eerst wat direct weggaat (backorders in hele pallets), dan
   voorraad hier aanvullen tot X maanden verkoop, rest naar VST.
   Losse stuks blijven altijd hier (picklocatie).
   ===================================================================== */
function advies(c, pool){
  const code = pool.code;
  const f = feiten(code);
  const eerder = eerderGepland(c, code);
  const maanden = num(c.data.instellingen.maanden) || 1.5;
  const uitleg = [];
  const pallets = pool.pallets.slice();
  const porties = [];
  const psize = pallets.length ? pallets[0] : 0;
  let vrij = f.vrij + eerder.hier + eerder.bo;
  const bo = Math.max(0, f.bo - eerder.bo);
  if(eerder.refs.length) uitleg.push('incl. ' + eerder.refs.join(', ') + ' (eerder/zelfde dag)');
  // 1. backorders in hele pallets
  if(bo > 0 && psize > 0){
    let n = 0; while(n < pallets.length && (n + 1) * pallets[n] <= bo) n++;
    if(n > 0){ porties.push({ soort:'pallet', n, per:psize, dest:'BO' }); pallets.splice(0, n); vrij += n * psize; uitleg.push(n + ' pallet' + (n > 1 ? 's' : '') + ' dekt backorders'); }
  }
  // 2. benodigd hier
  let need;
  if(!f.rate){
    need = Math.max(0, -vrij) + (psize || pool.losU || 0);
    uitleg.push('geen verkoophistorie: backorders + 1 pallet extra');
  } else {
    const doel = f.rate * maanden;
    need = Math.max(0, doel - vrij);
    uitleg.push('doel ' + nf(doel) + ' (' + nf(maanden, 1) + ' mnd × ' + nf(f.rate) + '/mnd), vrij ' + nf(vrij));
  }
  // 3. los -> picklocatie
  if(pool.losU > 0){ porties.push({ soort:'los', n:pool.losU, dest:'PICK' }); need -= pool.losU; }
  // 4. pallets hier / VST
  let nHier = 0, acc = 0;
  while(need > 0 && acc < need && nHier < pallets.length){ acc += pallets[nHier]; nHier++; }
  const pickLeeg = pool.losU === 0 && (f.hm - f.bo + (vrij - f.vrij)) <= Math.max(0, (f.rate || 0) * 0.25);
  pallets.forEach((s, i) => {
    const dest = i < nHier ? ((i === 0 && pickLeeg) ? 'PICK' : 'UP') : 'VST';
    const last = porties[porties.length - 1];
    if(last && last.soort === 'pallet' && last.dest === dest && last.per === s) last.n++;
    else porties.push({ soort:'pallet', n:1, per:s, dest });
  });
  return { porties, uitleg:uitleg.join(' · '), feiten:f, eerder };
}
function portiesGelijk(a, b){
  const k = arr => (arr || []).filter(x => portieU(x) > 0).map(x => x.soort + ':' + x.dest + ':' + (x.soort === 'pallet' ? x.per : '') + ':' + x.n).sort().join('|');
  return k(a) === k(b);
}

/* =====================================================================
   Open punten
   ===================================================================== */
function punten(c, pl){
  const L = [];
  const add = (key, lvl, tekst, code, t, type, kort) => L.push({ key, lvl, tekst, code, tab:t, type:type || key, kort:kort || tekst });
  const R = c.data.regels;
  if(!c.losdatum) add('losdatum', 'let', 'Losdatum ontbreekt.', null, null);
  if(!R.length) add('geenregels', 'info', 'Nog geen pakbon ingelezen.', null, 'pakbon');
  const pb = c.data.pakbon || {};
  if(R.length && pb.totaal_stuks != null){
    const s = R.reduce((a, r) => a + (num(r.totaal) || 0), 0), e = R.reduce((a, r) => a + (num(r.aantal) || 0), 0);
    if(s !== pb.totaal_stuks || (pb.totaal_eenheden != null && e !== pb.totaal_eenheden))
      add('pbtot', 'fout', 'Regels tellen niet op tot het pakbontotaal (' + nf(s) + ' / ' + nf(e) + ' ingelezen, pakbon zegt ' + nf(pb.totaal_stuks) + ' / ' + nf(pb.totaal_eenheden) + '). Controleer de regels.', null, 'pakbon');
  }
  R.forEach((r, i) => {
    const lab = (r.pakbon_code || ('regel ' + (i + 1)));
    if(!r.productcode) add('code-' + r.id, 'fout', lab + ': nog geen Picqer-productcode gekoppeld.', null, 'pakbon', 'code', lab);
    else if(!r.bevestigd) add('bev-' + r.id, 'let', lab + ' → ' + r.productcode + ': voorstel, nog bevestigen.', r.productcode, 'pakbon', 'bev', lab + ' → ' + r.productcode);
    const t = num(r.totaal), pe = num(r.per), a = num(r.aantal);
    if(t && pe && a && t !== pe * a && !(r.soort === 'pallet' && t < pe * a && t > pe * (a - 1)))
      add('som-' + r.id, 'let', lab + ': ' + nf(pe) + ' × ' + nf(a) + ' is niet ' + nf(t) + '.', r.productcode, 'pakbon', 'som', lab + ' (' + nf(pe) + ' × ' + nf(a) + ' ≠ ' + nf(t) + ')');
    if(r.productcode && r.factor_bron === 'voorstel' && !r.bevestigd)
      add('fac-' + r.id, 'let', lab + ': factor ' + r.factor + ' (1 stuk op de pakbon = ' + nf(r.factor) + ' in Picqer, ' + (eenheidVan(r.productcode) === 'st.' ? 'afgeleid uit productgeheugen' : 'Picqer telt in ' + eenheidVan(r.productcode)) + '). Klopt dat?', r.productcode, 'pakbon', 'fac', lab + ': 1 = ' + r.factor + ' ' + eenheidVan(r.productcode));
    if(r.productcode && r.factor_bron === 'onbekend')
      add('fac-' + r.id, 'fout', lab + ': Picqer telt in cm, rollengte onbekend — vul de factor in.', r.productcode, 'pakbon', 'fac', lab + ': rollengte onbekend');
  });
  pl.order.forEach(code => {
    const pool = pl.map[code], p = P[code];
    if(!p){ add('pq-' + code, 'fout', code + ' staat niet in de Picqer-import. Importeer de Picqer-export van deze leverancier.', code, null); return; }
    const spp = sppVan(code);
    pool.regels.filter(r => r.soort === 'pallet').forEach(r => {
      const u = (num(r.per) || 0) * (num(r.factor) || 1);
      if(spp && u && u !== spp) add('spp-' + code + '-' + u, 'info', code + ': ' + nf(u) + ' per pallet op de pakbon, productgeheugen zegt ' + nf(spp) + '. Labels volgen de pakbon.', code, 'pallets', 'spp', code + ' (pakbon ' + nf(u) + ', geheugen ' + nf(spp) + ')');
    });
    // Picqer-gewicht controleren tegen pakbon
    const netto = pool.regels.reduce((a, r) => a + (num(r.netto) || 0), 0);
    if(netto > 0 && pool.totaalU > 0){
      const perU = netto / pool.totaalU, pq = num(p.gewicht_product_g), per_ = eenheidVan(code) === 'st.' ? 'stuk' : eenheidVan(code);
      const x = pq ? perU / (pq / 1000) : 0;
      if(pq && x > 20 && factorVan(c, code) === 1) add('eh-' + code, 'let', code + ': pakbon ' + nf(perU, 1) + ' kg per stuk, Picqer ' + nf(pq / 1000, 3) + ' kg per eenheid. Telt Picqer per cm of meter? Zet dan de factor goed.', code, 'pakbon', 'eh', code + ' (' + nf(pq / 1000, 3) + ' kg in Picqer)');
      else if(!pq) add('gw-' + code, 'let', code + ': gewicht ontbreekt in Picqer (pakbon: ' + nf(perU, 2) + ' kg per ' + per_ + '). Aanpassen in Picqer.', code, null, 'gw', code + ' leeg → ' + nf(perU, 2) + ' kg/' + per_);
      else if(Math.abs(pq / 1000 - perU) / perU > 0.25) add('gw-' + code, 'let', code + ': Picqer-gewicht ' + nf(pq / 1000, 2) + ' kg, pakbon zegt ' + nf(perU, 2) + ' kg per ' + per_ + '. Aanpassen in Picqer (belangrijk voor orderpickers).', code, null, 'gw', code + ' ' + nf(pq / 1000, 2) + ' → ' + nf(perU, 2) + ' kg/' + per_);
    }
    const f = feiten(code);
    if(!f.rate && f.hm === 0) add('nieuw-' + code, 'info', code + ': geen verkoophistorie — nieuw product? Verdeling zelf beoordelen.', code, 'verdeling', 'nieuw', code);
    const v = c.data.verdeling[code];
    if(v && v.porties && v.porties.length && !restVan(pool, v.porties).ok) add('vd-' + code, 'fout', code + ': verdeling telt niet op.', code, 'verdeling', 'vd', code);
    const heeftPallet = (v && v.porties ? v.porties : []).some(x => x.soort === 'pallet' && DEST[x.dest] && (DEST[x.dest].hier || x.dest === 'VST'));
    if(heeftPallet){
      const mis = [];
      if(!p.palletmaat) mis.push('palletmaat'); if(leeg(p.hoogte_cm)) mis.push('hoogte'); if(leeg(p.gewicht_kg)) mis.push('gewicht'); if(leeg(p.plaatsen)) mis.push('plaatsen');
      if(mis.length) add('pd-' + code, 'let', code + ': palletdata ontbreekt (' + mis.join(', ') + ').', code, 'pallets', 'pd', code + (mis.length < 4 ? ' (' + mis.join(', ') + ')' : ''));
    }
    if(perRol(eenheidVan(code)) && factorVan(c, code) === 1)
      add('eh-' + code, 'let', code + ': Picqer telt in ' + eenheidVan(code) + ', maar de factor is 1. Klopt dat?', code, 'pakbon', 'eh', code);
    const g = geh1(code);
    if(!g || !String(g.name || '').trim()) add('vn-' + code, 'info', code + ': nog geen vloernaam (voor het palletlabel).', code, 'pallets', 'vn', code);
  });
  c.data.punten_eigen.forEach(x => L.push({ key:'e-' + x.id, lvl:'eigen', tekst:x.tekst, code:x.productcode || null, eigen:x, type:'e-' + x.id }));
  const ord = { fout:0, let:1, eigen:2, info:3 };
  L.sort((a, b) => ord[a.lvl] - ord[b.lvl]);
  return L;
}
const LVL = { fout:['b-bad', 'fout'], let:['b-warn', 'let op'], info:['b-info', 'info'], eigen:['b-grey', 'notitie'] };

async function route(){
  const h = location.hash || '#/';
  let m;
  const nu = h.startsWith('#/c/') ? 'home' : h.startsWith('#/gegevens') ? 'gegevens' : h.startsWith('#/vloernamen') ? 'vloernamen' : 'home';
  document.querySelectorAll('#nav a[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === nu));
  if(!h.startsWith('#/c/')){ if(dirty) await flushSave(); cur = null; setSaved(''); }
  if(['containers', 'pakbon_alias', 'verkoop', 'backorders'].some(t => MISSING.includes(t))) return viewSetup();
  if((m = h.match(/^#\/c\/(\d+)(?:\/(\w+))?/))) return viewContainer(+m[1], m[2] || 'pakbon');
  if(h.startsWith('#/gegevens')) return viewGegevens();
  if(h.startsWith('#/vloernamen')){
    const q = (h.split('?')[1] || '').split('&').find(x => x.startsWith('q='));
    if(q) UI.vn.f.q = decodeURIComponent(q.slice(2)).trim();
    return viewVloernamen();
  }
  return viewHome();
}

  const y = window.scrollY;

}
function focusKey(el){
  if(!el || el === document.body || !app.contains(el)) return null;
  if(el.id) return '#' + CSS.escape(el.id);
  const attrs = ['data-regel', 'data-k', 'data-meta', 'data-p', 'data-inst', 'data-wb', 'data-vn', 'data-vk', 'data-vnlos', 'data-vnf'].filter(a => el.hasAttribute(a));
  if(!attrs.length) return null;
  let sel = el.tagName.toLowerCase() + attrs.map(a => '[' + a + '="' + CSS.escape(el.getAttribute(a)) + '"]').join('');
  const port = el.closest('.portie'), box = el.closest('[data-code]');
  if(port && box) sel = '[data-code="' + CSS.escape(box.dataset.code) + '"] .portie[data-i="' + port.dataset.i + '"] ' + sel;
  return sel;
}
// na een wijziging opnieuw tekenen, maar de cursor laten staan waar je naartoe tabde/klikte
function rerenderLater(){
  setTimeout(() => {
    const k = focusKey(document.activeElement);
    rerender();
    const e = k && document.querySelector(k);
    if(e){ e.focus({ preventScroll:true }); if(e.tagName === 'INPUT' && e.type !== 'file' && e.type !== 'checkbox') try{ e.select(); }catch(_){} }
  }, 0);
}

const vnQtyOk = v => /^\d+([.,]\d+)?$/.test(String(v == null ? '' : v).trim());

function vnSleutels(){ // productcode (kleine letters) -> echte sleutels in het productgeheugen
  const bySub = {};
  Object.keys(CAT).forEach(k => {
    const x = CAT[k]; if(!x) return;
    const s = String(x.sub == null ? '' : x.sub).trim().toLowerCase();
    if(s) (bySub[s] = bySub[s] || []).push(k);
  });
  return bySub;
}
function vnLijst(){
  const w = UI.vn.wijzig, bySub = vnSleutels();
  const rijen = Object.keys(P).sort((a, b) => a.localeCompare(b, 'nl')).map(code => {
    const keys = bySub[code.toLowerCase()] || [], regels = keys.map(k => CAT[k]);
    const g = regels[0] || null, bew = w[code] || null, p = P[code] || {};
    const eanP = String(p.ean == null ? '' : p.ean).trim(), eanG = String((g && g.ean) == null ? '' : g.ean).trim();
    return { code, lev:p.leverancier || '', pnaam:p.naam || '', regels, keys, gewijzigd:!!bew,
      ean: eanP || eanG, eanOud: eanP && eanG && eanP !== eanG ? eanG : '',
      naam: bew && bew.name !== undefined ? bew.name : String((g && g.name) == null ? '' : g.name),
      qty:  bew && bew.qty  !== undefined ? bew.qty  : String((g && g.qty)  == null ? '' : g.qty) };
  });
  const tel = {};
  rijen.forEach(r => { const k = vnKey(r.naam); if(k) tel[k] = (tel[k] || 0) + 1; });
  rijen.forEach(r => {
    const k = vnKey(r.naam);
    r.leeg = !k;
    r.dubbel = !!k && tel[k] > 1;
    r.meer = r.regels.length > 1;
    r.geenEan = !r.ean;
    r.raarEan = !!r.ean && !/^\d{8}$|^\d{12,14}$/.test(r.ean);
    r.geenQty = !vnQtyOk(r.qty);
    r.prob = r.leeg || r.dubbel || r.meer || r.geenEan || r.geenQty || r.raarEan;
  });
  return rijen;
}
function vnBadges(r){
  const b = [];
  if(r.dubbel) b.push('<span class="badge b-bad">dubbele naam</span>');
  if(r.meer) b.push('<span class="badge b-bad">' + r.regels.length + ' regels</span>');
  if(r.leeg) b.push('<span class="badge b-warn">nog leeg</span>');
  if(r.geenQty) b.push('<span class="badge b-warn">stuks?</span>');
  if(r.geenEan) b.push('<span class="badge b-bad">geen EAN</span>');
  if(r.raarEan) b.push('<span class="badge b-warn">EAN klopt niet</span>');
  return b.length ? b.join(' ') : '<span class="badge b-ok">ok</span>';
}
function vnLos(){
  const leeg_ = [], vreemd = [];
  Object.keys(CAT).forEach(k => {
    const x = CAT[k]; if(!x) return;
    const s = String(x.sub == null ? '' : x.sub).trim();
    if(!s) leeg_.push({ key:k, x });
    else if(!PLOW[s.toLowerCase()]) vreemd.push({ key:k, x });
  });
  return { leeg:leeg_, vreemd };
}

async function vloernamenOpslaan(){
  const st = (m, cls) => { const s = $('vn_st'); if(s){ s.textContent = m; s.className = 'status ' + (cls || ''); } };
  const w = UI.vn.wijzig, codes = Object.keys(w), los = UI.vn.los;
  const losCodes = Object.keys(los).filter(k => los[k]);
  if(!codes.length && !losCodes.length) return toast('Niets gewijzigd.');
  const rijen = vnLijst();
  const stuk = rijen.filter(r => r.gewijzigd && (r.dubbel || (String(r.qty).trim() && !vnQtyOk(r.qty))));
  if(stuk.length) return st('Eerst oplossen: ' + stuk.slice(0, 4).map(r => r.code + (r.dubbel ? ' (dubbele naam)' : ' (stuks per pallet is geen getal)')).join(', '), 'err');
  try{
    st('Opslaan…');
    const r = await api('GET', 'catalog?key=eq.catalog-ean&select=data');
    const cat = (r.length ? r[0].data : {}) || {};
    codes.forEach(code => {
      const rij = rijen.find(x => x.code === code); if(!rij || !String(rij.naam).trim()) return;
      vnZetRegel(cat, code, rij.naam, rij.qty);
    });
    losCodes.forEach(k => {
      const code = PLOW[String(los[k]).trim().toLowerCase()];
      if(!code || !cat[k]) return;
      cat[k].sub = code; cat[k].used = Date.now();
      const ep = String((P[code] || {}).ean == null ? '' : P[code].ean).trim();
      if(ep) cat[k].ean = ep;
    });
    await api('POST', 'catalog?on_conflict=key', [{ key:'catalog-ean', mode:'ean', data:cat, updated_at:new Date().toISOString() }], { Prefer:'resolution=merge-duplicates,return=minimal' });
    indexCatalog(cat);
    UI.vn.wijzig = {}; UI.vn.los = {};
    rerender(); toast('Vloernamen opgeslagen.');
  }catch(e){ st('Opslaan mislukt: ' + e.message, 'err'); }
}

/* ---------- Picqer-imports ---------- */
function leesSheet(file){
  return file.arrayBuffer().then(buf => {
    const wb = XLSX.read(buf, { type:'array', cellDates:false });
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, blankrows:false, defval:null });
  });
}
const txt = v => leeg(v) ? null : (typeof v === 'number' ? (Number.isInteger(v) ? String(v) : String(v)) : (String(v).trim() || null));
async function impProducten(file){
  const st = m => { $('st_prod').textContent = m; $('st_prod').className = 'status'; };
  try{
    st('Lezen…');
    const arr = await leesSheet(file);
    const head = (arr[0] || []).map(h => String(h ?? '').trim());
    const MAP = { productcode:'Productcode', naam:'Naam', leverancier:'Leverancier', leverancier_code:'Productcode leverancier', ean:'Barcode',
      gewicht_product_g:'Gewicht', lengte_product_cm:'Lengte', breedte_product_cm:'Breedte', hoogte_product_cm:'Hoogte', actief:'Actief',
      abc:'ABC classificatie', locaties_hm:'Voorraadlocatie Hoofdmagazijn', voorraad_hm:'Voorraad Hoofdmagazijn',
      gereserveerd_hm:'Gereserveerde voorraad Hoofdmagazijn', vrij_hm:'Vrije voorraad Hoofdmagazijn', voorraad_vst:'Voorraad Bulk van Spreuwel', tags:'Tags' };
    const NUM = ['gewicht_product_g','lengte_product_cm','breedte_product_cm','hoogte_product_cm','voorraad_hm','gereserveerd_hm','vrij_hm','voorraad_vst'];
    const idx = {}; Object.entries(MAP).forEach(([k, h]) => idx[k] = head.indexOf(h));
    if(idx.productcode < 0) throw new Error('kolom "Productcode" niet gevonden. Is dit een Picqer-productenexport?');
    const nu = new Date().toISOString(), rows = [];
    for(let i = 1; i < arr.length; i++){
      const a = arr[i], code = txt(a[idx.productcode]);
      if(!code) continue;
      const r = { productcode:code, picqer_datum:nu };
      Object.keys(MAP).forEach(k => {
        if(k === 'productcode' || idx[k] < 0) return;
        const v = a[idx[k]];
        if(NUM.includes(k)) r[k] = num(v);
        else if(k === 'actief') r[k] = leeg(v) ? null : /^(true|ja|1|waar)$/i.test(String(v).trim());
        else r[k] = txt(v);
      });
      rows.push(r);
    }
    if(!rows.length) throw new Error('geen producten gevonden.');
    st('Opslaan… ' + rows.length + ' producten');
    await upsert('producten', rows, 'productcode');
    await load();
    viewGegevens();
    $('st_prod').textContent = rows.length + ' producten bijgewerkt uit Picqer.'; $('st_prod').className = 'status ok';
  }catch(e){ $('st_prod').textContent = 'Import mislukt: ' + e.message; $('st_prod').className = 'status err'; }
}
async function impVerkoop(file){
  const st = (m, c) => { $('st_vk').textContent = m; $('st_vk').className = 'status ' + (c || ''); };
  try{
    const van = $('vk_van').value, tot = $('vk_tot').value;
    if(!van || !tot || tot < van) throw new Error('vul eerst een geldige periode in.');
    const maanden = (new Date(tot) - new Date(van)) / 864e5 / 30.44 + 1 / 30.44;
    st('Lezen…');
    const arr = await leesSheet(file);
    const head = (arr[0] || []).map(h => String(h ?? '').trim());
    const ic = head.indexOf('Productcode'), ia = head.indexOf('Aantal'), il = head.indexOf('Leverancier');
    if(ic < 0 || ia < 0) throw new Error('kolommen "Productcode" en "Aantal" niet gevonden. Is dit het rapport Magazijnverkopen?');
    const som = {}, levVan = {};
    for(let i = 1; i < arr.length; i++){
      const code = txt(arr[i][ic]); if(!code) continue;
      const c2 = PLOW[code.toLowerCase()] || code;
      som[c2] = (som[c2] || 0) + (num(arr[i][ia]) || 0);
      if(il >= 0 && arr[i][il]) levVan[c2] = String(arr[i][il]).trim();
    }
    const levs = [...new Set(Object.values(levVan))];
    const nu = new Date().toISOString();
    const rows = Object.entries(som).map(([code, a]) => ({ productcode:code, leverancier:levVan[code] || (P[code] && P[code].leverancier) || null, aantal:a, periode_van:van, periode_tot:tot, maanden:+maanden.toFixed(2), per_maand:+(a / maanden).toFixed(2), geimporteerd_op:nu }));
    // producten van deze leverancier(s) zonder verkoop: 0 in deze periode
    levs.forEach(l => (BYLEV[l] || []).forEach(code => { if(!(code in som)) rows.push({ productcode:code, leverancier:l, aantal:0, periode_van:van, periode_tot:tot, maanden:+maanden.toFixed(2), per_maand:0, geimporteerd_op:nu }); }));
    st('Opslaan… ' + rows.length + ' producten');
    await upsert('verkoop', rows, 'productcode');
    await load(); viewGegevens();
    st(Object.keys(som).length + ' producten met verkoop ingeladen (' + nf(maanden, 1) + ' maanden)' + (levs.length ? ' voor ' + levs.join(', ') : '') + '.', 'ok');
  }catch(e){ st('Import mislukt: ' + e.message, 'err'); }
}
async function impBackorders(file){
  const st = (m, c) => { $('st_bo').textContent = m; $('st_bo').className = 'status ' + (c || ''); };
  try{
    st('Lezen…');
    const arr = await leesSheet(file);
    const head = (arr[0] || []).map(h => String(h ?? '').trim());
    const col = n => head.indexOf(n);
    const need = ['#', 'Productcode', 'Aantal'];
    need.forEach(n => { if(col(n) < 0) throw new Error('kolom "' + n + '" niet gevonden. Is dit de backorder-export?'); });
    const nu = new Date().toISOString(), rows = [];
    for(let i = 1; i < arr.length; i++){
      const a = arr[i], id = num(a[col('#')]); if(!id) continue;
      const bd = a[col('Besteld op')];
      rows.push({ id, bestelling:txt(a[col('Bestelling/Retour')]), leverancier:txt(a[col('Leverancier')]), productcode:txt(a[col('Productcode')]), product:txt(a[col('Product')]),
        aantal:num(a[col('Aantal')]), beschikbaar:num(a[col('Beschikbaar')]), verwacht:txt(a[col('Verwacht')]), magazijn:txt(a[col('Magazijn')]),
        besteld_op:bd && !isNaN(new Date(bd)) ? new Date(bd).toISOString() : null, geimporteerd_op:nu });
    }
    const levs = [...new Set(rows.map(r => r.leverancier).filter(Boolean))];
    st('Oude regels opruimen…');
    if(levs.length) await api('DELETE', 'backorders?leverancier=in.(' + levs.map(l => '"' + l.replace(/"/g, '') + '"').map(encodeURIComponent).join(',') + ')', undefined, { Prefer:'return=minimal' });
    if(rows.some(r => !r.leverancier)) await api('DELETE', 'backorders?leverancier=is.null', undefined, { Prefer:'return=minimal' });
    st('Opslaan… ' + rows.length + ' regels');
    await upsert('backorders', rows, 'id');
    await load(); viewGegevens();
    st(rows.length + ' backorderregels ingeladen (' + levs.length + ' leveranciers).', 'ok');
  }catch(e){ st('Import mislukt: ' + e.message, 'err'); }
}

const TABS = [['pakbon', 'Pakbon'], ['verdeling', 'Verdeling'], ['pallets', 'Pallets'], ['uitvoer', 'Uitvoer']];
function viewContainer(id, t){
  const c = CONT.find(x => x.id === id);
  if(!c){ app.innerHTML = '<div class="card empty">Container niet gevonden. <a href="#/">Terug</a></div>'; return; }

/* ---------- Tab 3: pallets ---------- */
function plaatsenVoorstel(maat){
  const m = String(maat || '').match(/(\d+)\s*x\s*(\d+)/); if(!m) return null;
  const a = +m[1], b = +m[2], voor = Math.max(a, b) > 120 ? Math.max(a, b) : Math.min(a, b);
  const v = voor / PLAATS_CM;
  if(v <= 1) return 1;
  return v > 1.5 ? Math.ceil(v) : Math.ceil(v * 10) / 10;
}
function tabPallets(c, g){

  </div>

    <div class="scroll"><table>
      <tr><th>Product</th><th class="n">Hier</th><th class="n">VST</th><th>Palletmaat</th><th class="n">Hoogte</th><th class="n">Gewicht</th><th class="n">Plaatsen</th><th class="n">Max/ligger</th><th></th></tr>
      ${rij.map(({ code, p, h, s }) => `<tr class="${[p.palletmaat, p.hoogte_cm, p.gewicht_kg, p.plaatsen].some(leeg) ? 'warn' : ''}">
        <td><span class="code">${esc(code)}</span><div class="desc">${esc(naamVan(code))}</div></td>
        <td class="n">${h || ''}</td><td class="n">${s || ''}</td>

function palletEditor(c, pool){

  const r0 = pool.regels[0] || {};
  const f = num(r0.factor) || 1;
  const spp = sppVan(code) || (pool.pallets[0] || null);
  // voorstellen
  const naam = naamVan(code);
  const dim = naam.match(/(\d{2,4})\s*[x×]\s*(\d{2,4})\s*cm/i);
  let maatV = null;
  if(dim){ const a = dim[1] + 'x' + dim[2], b = dim[2] + 'x' + dim[1]; maatV = MATEN.includes(a) ? a : MATEN.includes(b) ? b : a; }
  const palRegel = pool.regels.find(r => r.soort === 'pallet' && num(r.bruto_per));

    <div class="fields">
      <div class="fld"><label>Vloernaam (op het label)</label><input id="pe_vn" value="${esc(vnaam)}" placeholder="bijv. ${esc(naam)}"><div class="sugg">Voor de Palletlabel-generator — samen met stuks per pallet hiernaast</div></div>

      <div class="fld"><label>Palletmaat (cm)</label><select id="pe_maat"><option value="">— kies —</option>${MATEN.map(m => `<option ${m === maat ? 'selected' : ''}>${m}</option>`).join('')}${maat && !inMaten ? `<option selected>${esc(maat)}</option>` : ''}<option value="anders">anders…</option></select>${sug('pe_maat', maatV, 'uit productnaam')}</div>
      <div class="fld"><label>Hoogte incl. pallet (cm)</label><input id="pe_h" inputmode="decimal" value="${p.hoogte_cm ?? ''}">${sug('pe_h', hoogV, dik ? spp + ' × ' + dik[1] + ' mm + ' + PALLET_CM + ' cm' : '')}</div>
      <div class="fld"><label>Gewicht volle pallet (kg)</label><input id="pe_kg" inputmode="decimal" value="${p.gewicht_kg ?? ''}">${sug('pe_kg', gewV, gewBron)}</div>
      <div class="fld"><label>Plaatsen in stelling</label><input id="pe_pl" inputmode="decimal" value="${p.plaatsen ?? ''}">${sug('pe_pl', plV, 'plaats = 90 cm')}</div>
      <div class="fld"><label>Max per ligger</label><input id="pe_max" inputmode="numeric" value="${p.max_per_ligger ?? ''}"><div class="sugg" id="pe_maxhint"></div></div>

    </div>
    <details class="calc"><summary>Rekenhulp: pallet opbouwen uit pakken/rollen</summary>
      <div class="fields">

        <div class="fld"><label>Gewicht per pak (kg)</label><input id="rk_kg" inputmode="decimal" value="${losRegel ? num(losRegel.bruto_per) : (palRegel ? '' : '')}"></div>
        <div class="fld"><label>Hoogte per laag (cm)</label><input id="rk_h" inputmode="decimal" placeholder="bijv. 13"></div>
        <div class="fld"><label>Pakken per laag</label><input id="rk_pl" inputmode="decimal" placeholder="bijv. 4"></div>

function rekenhulp(){
  const g = id => num($(id) && $(id).value);
  const pp = g('rk_pp') || 1, kg = g('rk_kg'), h = g('rk_h'), perLaag = g('rk_pl'), lagen = g('rk_l');
  const op = ($('rk_op') && $('rk_op').value || '').split(/[,;\s]+/).map(num).filter(x => x > 0);
  let pakken = null, nLagen = null;
  if(op.length){ pakken = op.reduce((a, b) => a + b, 0); nLagen = op.length; }
  else if(perLaag && lagen){ pakken = perLaag * lagen; nLagen = lagen; }
  const out = $('rk_out'); if(!out) return;
  if(!pakken){ out.innerHTML = 'Vul pakken per laag + lagen in, of een opbouw per laag.'; return; }
  const code = $('rk_out').closest('.pedit').dataset.code;
  const f = cur ? factorVan(cur, code) : 1;
  const stuks = pakken * pp * f;
  const hoogte = h ? Math.ceil(nLagen * h + PALLET_CM) : null;
  const gewicht = kg ? Math.ceil(pakken * kg + PALLET_KG) : null;
  out.innerHTML = `<b>${nf(pakken)} pakken</b> = <b>${nf(stuks)} ${eenheidVan(code)}</b> per pallet` +
    (hoogte ? ` · hoogte <b>${hoogte} cm</b> (${nLagen} × ${nf(h, 1)} + ${PALLET_CM})` : '') +
    (gewicht ? ` · gewicht <b>${gewicht} kg</b> (${nf(pakken)} × ${nf(kg, 1)} + ${PALLET_KG})` : '') +
    ` <button class="btn sm" data-act="rkneem" data-s="${stuks}" data-h="${hoogte ?? ''}" data-kg="${gewicht ?? ''}">Overnemen</button>`;
}
function maxHint(){
  const kg = num($('pe_kg') && $('pe_kg').value), el = $('pe_maxhint');
  if(!el) return;
  el.textContent = kg ? '2 × ' + nf(kg) + ' = ' + nf(2 * kg) + ' kg · 3 × = ' + nf(3 * kg) + ' kg · 4 × = ' + nf(4 * kg) + ' kg' : '';
}
async function palletOpslaan(code){
  const st = (m, cls) => { const s = $('pe_st'); if(s){ s.textContent = m; s.className = 'status small ' + (cls || ''); } };
  let maat = $('pe_maat').value;
  if(maat === 'anders'){ maat = prompt('Palletmaat (lengte x breedte in cm), bijv. 90x150:') || ''; maat = maat.replace(/\s/g, '').toLowerCase(); }
  let l = null, b = null;
  const mm = maat.match(/^(\d+)x(\d+)$/); if(mm){ l = +mm[1]; b = +mm[2]; }
  const row = { productcode:code, palletmaat:maat || null, lengte_cm:l, breedte_cm:b, hoogte_cm:num($('pe_h').value), gewicht_kg:num($('pe_kg').value),
    plaatsen:num($('pe_pl').value), max_per_ligger:num($('pe_max').value), opmerking:$('pe_opm').value.trim() || null, updated_at:new Date().toISOString() };
  const e = eenheidVan(code); if(e === 'm') row.eenheid = 'meter'; else if(e === 'rol') row.eenheid = 'rol';
  try{
    st('Opslaan…');
    const saved = await upsert('producten', [row], 'productcode');
    P[code] = Object.assign({}, P[code] || {}, saved[0] || row);
    const nieuweNaam = $('pe_vn').value.trim(), nieuweQty = num($('pe_spp').value);
    const g0 = geh1(code), naamNu = (g0 && g0.name) || '';
    const effNaam = nieuweNaam || naamNu || (P[code] && P[code].naam) || '';
    const wijzigt = (nieuweNaam && nieuweNaam !== naamNu) || (nieuweQty && nieuweQty !== sppVan(code));
    if(wijzigt){
      if(!effNaam) throw new Error('vul eerst een vloernaam in');
      const r = await api('GET', 'catalog?key=eq.catalog-ean&select=data');
      const cat = (r.length ? r[0].data : {}) || {};
      vnZetRegel(cat, code, effNaam, nieuweQty);
      await api('POST', 'catalog?on_conflict=key', [{ key:'catalog-ean', mode:'ean', data:cat, updated_at:new Date().toISOString() }], { Prefer:'resolution=merge-duplicates,return=minimal' });
      indexCatalog(cat);
    }
    UI.pe = null;
    rerender();
    toast(code + ' opgeslagen.');
  }catch(e){ st('Opslaan mislukt: ' + e.message, 'err'); }
}

/* ---------- Tab 4: uitvoer ---------- */
function werkbonData(c){
  const pl = pools(c);
  const prods = pl.order.map(code => ({ code, pool:pl.map[code], v:c.data.verdeling[code] || { porties:[] } }));
  const tel = { hier:0, vst:0, direct:0, plaatsen:0, vstKg:0 };
  prods.forEach(({ code, v }) => (v.porties || []).forEach(x => {
    if(x.soort !== 'pallet') return;
    const k = num(x.n) || 0, p = P[code] || {};
    if(x.dest === 'VST'){ tel.vst += k; tel.vstKg += k * (num(p.gewicht_kg) || 0); }
    else if(DEST[x.dest].hier){ tel.hier += k; tel.plaatsen += k * (num(p.plaatsen) || 1); }
    else tel.direct += k;
  }));
  return { prods, tel };
}

function maakLabels(c){
  const lijst = labelLijst(c);
  if(!lijst.length) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
  const W = 297;
  const size = n => n <= 8 ? 110 : n <= 12 ? 95 : n <= 16 ? 78 : n <= 22 ? 60 : n <= 30 ? 46 : 36;
  const isEan = s => /^\d{12,13}$/.test(s) || /^\d{8}$/.test(s);
  lijst.forEach((r, i) => {
    if(i) doc.addPage('a4', 'landscape');
    doc.setTextColor(16, 21, 28); doc.setFont('helvetica', 'bold'); doc.setFontSize(size(r.name.length));
    doc.text(r.name, W / 2, 48, { align:'center' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(18); doc.setTextColor(57, 67, 79);
    doc.text(r.code, W / 2, 60, { align:'center' });
    doc.setTextColor(16, 21, 28);
    try{
      const cv = document.createElement('canvas');
      const fmt = isEan(r.ean) ? (r.ean.length === 8 ? 'EAN8' : 'EAN13') : 'CODE128';
      JsBarcode(cv, r.ean, { format:fmt, height:130, width:4, displayValue:true, fontSize:34, font:'Arial', fontOptions:'bold', margin:6 });
      const w = 180, h = Math.min(50, w * (cv.height / cv.width));
      doc.addImage(cv.toDataURL('image/png'), 'PNG', (W - w) / 2, 82, w, h);
    }catch(e){ doc.setFontSize(16); doc.setTextColor(179, 38, 30); doc.text('Barcode kon niet worden gemaakt: ' + r.ean, W / 2, 105, { align:'center' }); doc.setTextColor(16, 21, 28); }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(58);
    doc.text(nf(r.stuks).replace(/\./g, ''), W / 2 - 8, 178, { align:'right' });
    doc.setFontSize(15); doc.text('STUKS', W / 2 + 6, 178, { align:'left' });
  });
  const url = doc.output('bloburl');
  const w = window.open(url, '_blank');
  if(!w){ const a = document.createElement('a'); a.href = url; a.download = 'palletlabels-' + (c.pakbon_ref || c.containernummer || c.id) + '.pdf'; a.click(); }
  toast(lijst.length + ' labels gemaakt.');
}
function kopieer(t){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t).then(() => toast('Gekopieerd.'));
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Gekopieerd.');
  return Promise.resolve();
}

app.addEventListener('change', e => {

  if(el.dataset.change && el.files){

    if(!f) return;
    ({ pakbonBestand, impProducten, impVerkoop, impBackorders })[el.dataset.change](f);
    return;
  }
  if(el.dataset.vn){
    const code = el.dataset.vn, w = UI.vn.wijzig[code] = UI.vn.wijzig[code] || {};
    w[el.dataset.vk] = el.value;
    rerenderLater(); return;
  }
  if(el.dataset.vnlos){ UI.vn.los[el.dataset.vnlos] = el.value.trim(); rerenderLater(); return; }
  if(el.dataset.vnf){
    UI.vn.f[el.dataset.vnf] = el.type === 'checkbox' ? el.checked : el.value;
    rerenderLater(); return;
  }
  if(!cur) return;
  if(el.dataset.meta){
    const k = el.dataset.meta; let v = el.value.trim();
    if(k === 'containernummer') v = v.toUpperCase();
    cur[k] = v || null;
    save(); rerenderLater(); if(k === 'leverancier') koppelAlles(cur); return;
  }
  if(el.dataset.regel !== undefined){
    const r = cur.data.regels[+el.dataset.regel], k = el.dataset.k;
    if(k === 'productcode'){
      const v = el.value.trim(), canon = PLOW[v.toLowerCase()];
      if(v && !canon){ toast('"' + v + '" bestaat niet in de Picqer-import. Kies een code uit de lijst.', 4000); el.value = r.productcode || ''; return; }
      r.productcode = canon || ''; r.match = canon ? 'handmatig' : 'onbekend'; r.bevestigd = !!canon;
      if(canon){ const fv = factorVoorstel(canon, r); r.factor = fv.factor; r.factor_bron = fv.bron === 'voorstel' ? 'bevestigd' : fv.bron; leer(r); }
    } else if(k === 'pakbon_code'){ r.pakbon_code = el.value.trim(); if(!r.bevestigd) Object.assign(r, koppel(r, cur.leverancier)); }
    else if(k === 'soort'){ r.soort = el.value; }
    else if(k === 'factor'){ r.factor = num(el.value) || 1; r.factor_bron = 'bevestigd'; if(r.bevestigd) leer(r); }
    else { r[k] = num(el.value); }
    save(); rerenderLater(); return;
  }
  const portie = el.closest('.portie');
  if(portie && el.dataset.p){
    const code = portie.closest('[data-code]').dataset.code, i = +portie.dataset.i, v = cur.data.verdeling[code], x = v.porties[i];
    if(el.dataset.p === 'n') x.n = num(el.value) || 0;
    else if(el.dataset.p === 'per') x.per = num(el.value);
    else if(el.dataset.p === 'dest') x.dest = el.value;
    else if(el.dataset.p === 'note') x.note = el.value;
    v.bevestigd = false;
    save(); if(el.dataset.p !== 'note') rerenderLater(); return;
  }
  if(el.dataset.inst){ cur.data.instellingen[el.dataset.inst] = num(el.value); save(); rerenderLater(); return; }
  if(el.dataset.wb === 'taal'){ cur.data.werkbon.taal = el.value; save(); rerender(); return; }
  if(el.dataset.labeldest){ UI.labelDest[el.dataset.labeldest] = el.checked; rerender(); return; }
});
app.addEventListener('input', e => {
  const el = e.target;
  if(el.dataset.wb === 'extra' && cur){ cur.data.werkbon.extra = el.value; save(); const p = $('wbprev'); if(p) p.innerHTML = werkbonHtml(cur); return; }
  if(el.closest && el.closest('.calc')) rekenhulp();
  if(el.id === 'pe_kg') maxHint();
});
app.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.id === 'pt_nieuw'){ e.preventDefault(); ACT.ptadd(); }
});

/* =====================================================================
   Start
   ===================================================================== */
(async () => { if(await load()) route(); })();
})();
</script>
