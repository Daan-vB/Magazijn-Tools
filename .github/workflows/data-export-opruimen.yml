# Verwijdert de tijdelijke tak export-versleuteld zodra Claude het pakket heeft opgehaald.
name: Data-export opruimen
on:
  push:
    branches: [main]
    paths: ['.github/export/opruimen.txt']
permissions:
  contents: write
jobs:
  opruimen:
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/export-versleuteld" && echo "::notice::tak verwijderd" || echo "::notice::geen tak om te verwijderen"
