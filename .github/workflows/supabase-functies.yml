# Zet Supabase Edge Functions automatisch live als hun code in deze repo verandert.
# Eenmalig nodig: GitHub → Settings → Secrets and variables → Actions → secret SUPABASE_ACCESS_TOKEN
# (maak hem in Supabase: Account → Access Tokens). Sleutels van Picqer blijven alleen in Supabase.
name: Supabase-functies live zetten
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
    inputs:
      functie:
        description: 'Naam van de functie (leeg = alle)'
        required: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT: jarbgetbwkjtxwtcfwmq   # Palletlabels
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Welke functies?
        id: welke
        run: |
          if [ -n "${{ github.event.inputs.functie }}" ]; then echo "lijst=${{ github.event.inputs.functie }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "lijst=$(ls supabase/functions | tr '\n' ' ')" >> $GITHUB_OUTPUT
          else echo "lijst=$(git diff --name-only HEAD~1 HEAD -- supabase/functions | cut -d/ -f3 | sort -u | tr '\n' ' ')" >> $GITHUB_OUTPUT; fi
      - name: Live zetten (Verify JWT uit, koppelcode beschermt)
        run: |
          for f in ${{ steps.welke.outputs.lijst }}; do
            [ -d "supabase/functions/$f" ] || continue
            echo "→ $f"; supabase functions deploy "$f" --project-ref "$PROJECT" --no-verify-jwt
          done
