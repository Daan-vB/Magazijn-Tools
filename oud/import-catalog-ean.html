async function sbGet(key){
  const res = await fetch(SUPABASE_URL + '/rest/v1/catalog?key=eq.' + encodeURIComponent(key) + '&select=data', { headers: SB_HEADERS });
  if(!res.ok) throw new Error('sbGet ' + res.status);
  const rows = await res.json();
  return rows.length ? rows[0].data : {};
}
async function sbSet(key, m, data){
  const res = await fetch(SUPABASE_URL + '/rest/v1/catalog?on_conflict=key', {
    method:'POST',
    headers: Object.assign({}, SB_HEADERS, {'Content-Type':'application/json', Prefer:'resolution=merge-duplicates,return=minimal'}),
    body: JSON.stringify([{ key:key, mode:'ean', data:data, updated_at:new Date().toISOString() }])
  });
  if(!res.ok) throw new Error('sbSet ' + res.status);
}

document.getElementById('go').addEventListener('click', async () => {
  const log = document.getElementById('log');
  const btn = document.getElementById('go');
  btn.disabled = true;
  log.textContent = 'Huidige database ophalen…\n';
  try{
    const current = await sbGet(CATALOG_KEY);
    const before = Object.keys(current).length;

    let added = 0, updated = 0;
    for(const k in IMPORT_DATA){
      if(current[k]) updated++; else added++;
      current[k] = IMPORT_DATA[k];
    }

    log.textContent += before + ' producten stonden al in de database.\n';
    log.textContent += added + ' nieuwe producten toegevoegd.\n';
    log.textContent += updated + ' bestaande producten bijgewerkt.\n';
    log.textContent += 'Opslaan…\n';

    await sbSet(CATALOG_KEY, 'ean', current);

    log.textContent += '\nGelukt ✓ — totaal nu ' + Object.keys(current).length + ' producten in de database.';
    log.className = 'ok';
  }catch(e){
    log.textContent += '\nFout: ' + e.message;
    log.className = 'err';
    btn.disabled = false;
  }
});
